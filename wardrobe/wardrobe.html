/* deck of suggested outfits */
let deckCache = [];
function deckView(deck) {
  const dots = deck.length <= 14 ? `<div class="deck-dots">${deck.map((_, i) => `<span class="deck-dot ${i === deckIndex ? "on" : ""}"></span>`).join("")}</div>` : "";
  return `<div class="deck" id="deck">
    <div class="ptr" id="ptr"><span class="spin">↻</span><span id="ptr-label">Pull to refresh</span></div>
    <div class="deck-card" style="touch-action:none;">${heroCard(deck[deckIndex], deck.length, deckIndex)}</div>
    ${dots}
    <div class="deck-hint">Swipe ← → to browse · up to wear · pull down to refresh</div>
  </div>`;
}
function similarSection(current, pool) {
  const sim = similarOutfits(current, pool);
  if (!sim.length) return "";
  return `<div class="sectitle" style="margin:22px 0 10px;">More like this</div>
    <div class="stack">${sim.map((o, i) => outfitCard(o, i)).join("")}</div>`;
}
function sharedCount(a, b) { const s = new Set(a.garmentIds); let n = 0; for (const id of b.garmentIds) if (s.has(id)) n++; return n; }
function similarOutfits(current, pool) {
  return pool.filter(o => o !== current && sharedCount(o, current) >= 2)
    .sort((a, b) => scoreOutfit(b.items) - scoreOutfit(a.items)).slice(0, 5);
}
function freshSuggestion() {
  const g = getGarments(); if (!canBuildOutfits(g)) return;
  const { outfits } = generateOutfits(g, { store: OUTFIT_STORE });
  if (!outfits.length) return;
  ootd = outfits[Math.floor(Math.random() * outfits.length)];
  deckIndex = 0; haptic(20); renderOutfits();
}
function wirePullRefresh() {
  const deck = document.getElementById("deck"), ptr = document.getElementById("ptr"), label = document.getElementById("ptr-label");
  if (!deck || !ptr) return;
  let startY = 0, pulling = false, dist = 0;
  deck.addEventListener("touchstart", e => { if (window.scrollY > 0) { pulling = false; return; } startY = e.touches[0].clientY; pulling = true; dist = 0; }, { passive: true });
  deck.addEventListener("touchmove", e => {
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0) { ptr.style.height = "0"; ptr.style.opacity = "0"; return; }
    const d = Math.min(dist * 0.5, 70);
    ptr.style.height = d + "px"; ptr.style.opacity = String(Math.min(1, d / 50));
    const armed = dist > 90; ptr.classList.toggle("armed", armed);
    label.textContent = armed ? "Release to refresh" : "Pull to refresh";
  }, { passive: true });
  const endPull = () => { const go = pulling && dist > 90; pulling = false; dist = 0; if (ptr) { ptr.style.height = "0"; ptr.style.opacity = "0"; ptr.classList.remove("armed"); } if (go) freshSuggestion(); };
  deck.addEventListener("touchend", endPull);
  deck.addEventListener("touchcancel", endPull);
}

/* ----- shake for a random outfit (item 1) ----- */
let shakeReady = false, lastShake = 0, lastAccel = null;
function onDeviceMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a) return;
  if (lastAccel) {
    const delta = Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y) + Math.abs(a.z - lastAccel.z);
    const now = Date.now();
    if (delta > 32 && now - lastShake > 1200) { lastShake = now; onShake(); }
  }
  lastAccel = { x: a.x, y: a.y, z: a.z };
}
function onShake() {
  haptic(30);
  const g = getGarments(); if (!canBuildOutfits(g)) return;
  const { outfits } = generateOutfits(g, { store: OUTFIT_STORE }); if (!outfits.length) return;
  ootd = outfits[Math.floor(Math.random() * outfits.length)];
  deckIndex = 0; searching = false; focusGarment = null;
  if (currentTab !== "outfits") {
    currentTab = "outfits";
    document.querySelectorAll("[data-nav]").forEach(el => el.classList.toggle("active", el.dataset.nav === "outfits"));
  }
  render();
}
function initShake() {
  if (typeof DeviceMotionEvent === "undefined") return;
  const add = () => { if (shakeReady) return; window.addEventListener("devicemotion", onDeviceMotion); shakeReady = true; };
  if (typeof DeviceMotionEvent.requestPermission === "function") {
    // iOS 13+ needs a user gesture to grant motion access
    const req = () => { DeviceMotionEvent.requestPermission().then(s => { if (s === "granted") add(); }).catch(() => {}); document.removeEventListener("click", req); };
    document.addEventListener("click", req, { once: true });
  } else { add(); }
}
function heroCard(o, total, idx) {

  const fs = o.items.map(i => i.formality);

      <div class="eyebrow">${label}</div>
      <div class="row wrap tiny muted" style="gap:5px; justify-content:flex-end;">
        <span class="badge">F${Math.min(...fs)}–${Math.max(...fs)}</span>
        <span class="badge">${money(totalCost)}</span>
      </div>
    </div>
    ${visualOutfit(o.items, "lg")}
    ${whyLine(o.items)}
    ${confLine(o.items)}
    <button class="btn primary wear" style="width:100%; margin-top:16px;" onclick="deckWear()">Wear this</button>
    <div class="row wrap" style="gap:8px; margin-top:10px; align-items:center;">

window.deckPrev = function () { if (!deckCache.length) return; deckIndex = (deckIndex - 1 + deckCache.length) % deckCache.length; renderOutfits(); };
window.deckReshuffle = function () { if (deckCache.length < 2) return; let n; do { n = Math.floor(Math.random() * deckCache.length); } while (n === deckIndex); deckIndex = n; renderOutfits(); };
window.deckWear = function () {

function wireDeck() {
  const card = document.querySelector(".deck-card");
  if (!card) return;
  // No pointer capture — that would retarget the click and break taps on the
  // buttons, stars and garment rows inside the card. We track the drag on
  // window instead, added on pointerdown and removed on release.
  let x0 = 0, y0 = 0, drag = false;
  const move = e => {
    if (!drag) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    card.style.transform = `translate(${dx}px, ${Math.min(0, dy)}px) rotate(${dx * 0.03}deg)`; // downward reserved for pull-to-refresh
  };
  const end = e => {
    if (!drag) return; drag = false; card.classList.remove("dragging");
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end);
    const dx = e.clientX - x0, dy = e.clientY - y0; card.style.transform = "";
    const T = 55;
    if (Math.abs(dx) > Math.abs(dy)) { if (dx < -T) { haptic(12); window.deckNext(); } else if (dx > T) { haptic(12); window.deckPrev(); } }
    else if (dy < -T) { window.deckWear(); }   // swipe up = wear
  };
  card.addEventListener("pointerdown", e => {
    drag = true; x0 = e.clientX; y0 = e.clientY; card.classList.add("dragging");
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end);
  });
}

/* ----- weather (Open-Meteo, no key; fails gracefully to no filtering) ----- */
function weatherBar() {
  const emoji = { hot: "☀️", mild: "🌤", cold: "❄️" };
  if (weather.status === "ok") {
    return `<div class="card" style="padding:10px 12px; margin-bottom:14px;">
      <div class="row wrap" style="gap:10px;">
        <span class="row" style="gap:6px;"><span style="font-size:18px;">${emoji[weather.season]}</span>
          <b>${weather.tempC}°C</b><span class="muted small">· ${cap(weather.season)} weather</span></span>
        <span class="chip btn-chip ${weatherFilter ? "on" : ""}" onclick="toggleWeatherFilter()">${weatherFilter ? "Filtering by weather ✓" : "Filter by weather"}</span>
        <button class="btn sm ghost" onclick="clearWeather()">Clear</button>
      </div>
    </div>`;
  }
  const loading = weather.status === "loading";
  const errNote = weather.status === "error"
    ? `<div class="tiny muted" style="margin-top:6px;">Couldn't fetch weather (offline or location blocked). Enter a temperature manually, or continue without it.</div>` : "";
  return `<div class="card" style="padding:10px 12px; margin-bottom:14px;">
    <div class="row wrap" style="gap:8px;">
      <button class="btn sm" onclick="fetchWeather()" ${loading ? "disabled" : ""}>${loading ? "Locating…" : "🌤 Use my location"}</button>
      <span class="muted small">or</span>
      <input id="manual-temp" type="number" placeholder="°C" style="width:78px; min-height:34px;" onkeydown="if(event.key==='Enter')applyManualTemp()" />
      <button class="btn sm" onclick="applyManualTemp()">Set</button>
    </div>${errNote}
  </div>`;
}
window.fetchWeather = function () {
  if (!navigator.geolocation) { weather = { status: "error", tempC: null, season: null }; renderOutfits(); return; }
  weather = { status: "loading", tempC: null, season: null }; renderOutfits();
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`${OPEN_METEO_URL}?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`);
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const t = data.current.temperature_2m;
      weather = { status: "ok", tempC: Math.round(t), season: tempToSeason(t) };
      weatherFilter = true;
    } catch (e) { weather = { status: "error", tempC: null, season: null }; }
    renderOutfits();
  }, () => { weather = { status: "error", tempC: null, season: null }; renderOutfits(); }, { timeout: 8000, maximumAge: 600000 });
};
window.applyManualTemp = function () {
  const el = document.getElementById("manual-temp"); if (!el) return;
  const t = parseFloat(el.value);
  if (Number.isNaN(t)) return;
  weather = { status: "ok", tempC: Math.round(t), season: tempToSeason(t) };
  weatherFilter = true; renderOutfits();
};
window.toggleWeatherFilter = function () { weatherFilter = !weatherFilter; renderOutfits(); };
window.clearWeather = function () { weather = { status: "idle", tempC: null, season: null }; weatherFilter = false; renderOutfits(); };

/* ----- shared outfit rendering ----- */
function outfitCard(o, idx) {
  const totalCost = o.items.reduce((a, i) => a + i.cost, 0);
  const fs = o.items.map(i => i.formality);
  const seasons = [...new Set(o.items.map(i => i.season))];
  return `
    <div class="card o-card">
      <div class="row" style="justify-content:space-between; align-items:flex-start;">
        <div class="small muted">Outfit #${idx + 1}</div>
        <div class="row wrap tiny muted" style="gap:5px; justify-content:flex-end;">
          <span class="badge">F${Math.min(...fs)}–${Math.max(...fs)}</span>
          <span class="badge">${seasons.map(cap).join("/")}</span>
          <span class="badge">${money(totalCost)}</span>
        </div>
      </div>
      ${visualOutfit(o.items)}
      ${whyLine(o.items)}
      ${confLine(o.items)}
      <div class="row wrap" style="gap:8px; align-items:center; margin-top:12px;">
        <button class="btn sm primary" onclick="woreOutfit('${o.garmentIds.join(",")}')">Wore this today</button>
        <button class="btn sm" onclick="saveOutfit('${o.garmentIds.join(",")}')">Save</button>
        ${ratingStars(o.garmentIds)}
      </div>
    </div>`;
}
// one-line reasoning under a suggested outfit (item 6)
function whyLine(items) {
  const parts = explainOutfit(items);
  if (!parts.length) return "";
  return `<div class="why" title="Why this scored well — tune the weights in the config block">✦ ${esc(parts.join(" · "))}</div>`;
}
// confidence badge — strong-everywhere vs a call-out on the weak dimension (item 6)
function confLine(items) {
  const n = confidenceNote(items);
  if (!n) return "";
  return `<div class="conf ${n.strong ? "strong" : "note"}" title="Consistency across scoring dimensions">${n.strong ? "◆ " : "◇ "}${esc(n.label)}</div>`;
}
// clickable 1–5 star row keyed to a garment set; click the current rating to clear
function ratingStars(ids) {
  const cur = getOutfitRating(ids) || 0;
  const csv = ids.join(",");
  return `<span class="stars" title="Rate this outfit — feeds future suggestions">${[1,2,3,4,5].map(n =>
    `<span class="star ${n <= cur ? "on" : ""}" onclick="rateOutfitUI('${csv}',${n})">★</span>`).join("")}</span>`;
}
window.rateOutfitUI = function (csv, n) {
  const ids = csv.split(",");
  const cur = getOutfitRating(ids);
  const nv = cur === n ? 0 : n;
  rateOutfit(ids, nv);
  renderOutfits();
  if (nv && nv <= 2) showReasonPicker(ids.map(getGarment).filter(Boolean));  // low rating → ask why
};
function sortForDisplay(a, b) {
  const order = { base: 0, mid: 1, outer: 2, bottom: 3, shoe: 4 };
  return order[a.category] - order[b.category];
}
function itemPill(it) {
  const mini = it.imageData ? `<span class="mini"><img src="${it.imageData}"></span>`
                            : `<span class="mini">${CATEGORY_ICO[it.category] || "👚"}</span>`;
  return `<div class="o-item">${mini}<div style="min-width:0;">
      <div class="small truncate" style="max-width:130px;">${esc(it.name)}</div>
      <div class="tiny muted">${esc(it.subcategory || CATEGORY_LBL[it.category])}</div>
    </div></div>`;
}
window.woreOutfit = function (ids) {
  const items = ids.split(",").map(getGarment).filter(Boolean);
  wearOutfit(items);
  haptic(18);
  renderOutfits();
};
window.saveOutfit = function (ids) {
  const rec = saveOutfitRecord({ garmentIds: ids.split(",") });
  alert(rec ? "Saved to your outfits (see Build tab)." : "You've already saved this outfit.");
};

/* ----- Build: manual outfit builder + saved outfits ----- */
function renderBuilder(garments, seg) {
  viewSub.textContent = "";
  if (!garments.length) {
    view.innerHTML = seg + emptyState("◈", "Nothing to build with", "Add garments first.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>`);
    return;
  }
  const selItems = [...builderSel].map(getGarment).filter(Boolean);
  const validity = selItems.length ? isValidOutfit(selItems) : null;

  const groups = CATEGORIES.map(cat => {
    const items = garments.filter(g => g.category === cat);
    if (!items.length) return "";
    return `<div class="build-cat">
      <div class="sectitle">${CATEGORY_LBL[cat]}</div>
      <div class="build-chips">
        ${items.map(g => `<span class="pick ${builderSel.has(g.id) ? "on" : ""}" onclick="toggleBuilderPick('${g.id}')">
          <span class="mini">${g.imageData ? `<img src="${g.imageData}">` : (CATEGORY_ICO[cat] || "👚")}</span>${esc(g.name)} ${colorDot(g.color)}</span>`).join("")}
      </div>
    </div>`;
  }).join("");

  const vBox = validity
    ? `<div class="validity ${validity.valid ? "ok" : "bad"}">
        ${validity.valid ? "✓ Valid — passes every rule." : "⚠ Breaks: " + validity.reasons.map(esc).join(" · ") + ". You can still save it."}
      </div>` : `<div class="small muted" style="margin:6px 0 12px;">Tap items to build an outfit. Rule-breaking combos are flagged but still savable.</div>`;

  const saved = state.outfits.slice().reverse();
  const savedCards = saved.map(savedOutfitCard).filter(Boolean);
  const savedHTML = savedCards.length ? `
    <div class="sectitle" style="margin-top:22px;">Saved outfits (${savedCards.length})</div>
    <div class="stack">${savedCards.join("")}</div>` : "";

  view.innerHTML = seg + `
    <div class="card" style="padding:14px; margin-bottom:16px;">
      ${groups}
      ${vBox}
      <div class="row wrap" style="gap:10px; margin-top:6px;">
        <input type="text" id="build-name" class="grow" value="${esc(builderName)}" placeholder="Name this outfit (optional)" style="min-width:160px;" />
      </div>
      <div class="tiny muted" style="margin:10px 0 6px;">Occasions (tap any that fit — an outfit can have several)</div>
      <div class="chiprow scroll">
        ${occasionIds().map(o => fchip(occasionLabel(o), builderOccasions.has(o), `toggleBuilderOccasion('${o}')`)).join("")}
      </div>
      <div class="row" style="gap:10px; margin-top:12px;">
        <button class="btn primary grow" onclick="saveManualOutfit()" ${selItems.length ? "" : "disabled"}>Save outfit</button>
        <button class="btn" onclick="clearBuilder()" ${builderSel.size ? "" : "disabled"}>Clear</button>
      </div>
    </div>
    ${savedHTML}`;

  const nameEl = document.getElementById("build-name");
  if (nameEl) nameEl.oninput = e => { builderName = e.target.value; };
}
function syncBuilderInputs() {
  const n = document.getElementById("build-name"); if (n) builderName = n.value;
}
window.toggleBuilderPick = function (id) {
  syncBuilderInputs();
  if (builderSel.has(id)) builderSel.delete(id); else builderSel.add(id);
  renderOutfits();
};
window.clearBuilder = function () { syncBuilderInputs(); builderSel.clear(); renderOutfits(); };
window.saveManualOutfit = function () {
  const items = [...builderSel].map(getGarment).filter(Boolean);
  if (!items.length) return;
  const v = isValidOutfit(items);
  if (!v.valid && !confirm("This outfit breaks:\n\n• " + v.reasons.join("\n• ") + "\n\nSave it anyway?")) return;
  const name = (document.getElementById("build-name").value || "").trim() || null;
  const occasions = [...builderOccasions].filter(o => getOccasion(o));
  const rec = saveOutfitRecord({ garmentIds: items.map(i => i.id), name, occasions, isManual: true });
  if (!rec) { alert("You've already saved this exact outfit."); return; }
  haptic(14);
  builderSel.clear(); builderName = ""; builderOccasions = new Set();
  renderOutfits();
};
window.toggleBuilderOccasion = function (o) {
  syncBuilderInputs();
  if (builderOccasions.has(o)) builderOccasions.delete(o); else builderOccasions.add(o);
  haptic(6); renderOutfits();
};

function savedOutfitCard(rec) {
  const items = rec.garmentIds.map(getGarment).filter(Boolean);
  if (items.length !== rec.garmentIds.length) return ""; // a component garment was deleted
  const v = isValidOutfit(items);
  return `
    <div class="card o-card">
      <div class="row wrap" style="justify-content:space-between; align-items:flex-start; gap:6px;">
        <div class="small">${rec.name ? esc(rec.name) : "Untitled outfit"}
          ${(rec.occasions || []).filter(o => getOccasion(o)).map(o => `<span class="badge" style="margin-left:4px;">${esc(occasionLabel(o))}</span>`).join("")}
          ${rec.isManual ? `<span class="badge" style="margin-left:4px;">Manual</span>` : ""}
          ${!v.valid ? `<span class="badge warn" style="margin-left:4px;" title="${esc(v.reasons.join(', '))}">Breaks a rule</span>` : ""}
        </div>
        <div class="small muted">${rec.timesWorn ? rec.timesWorn + "× worn" : ""}</div>
      </div>
      ${visualOutfit(items)}
      <div class="row wrap" style="gap:8px; align-items:center; margin-top:12px;">
        <button class="btn sm primary" onclick="woreSaved('${rec.id}')">Wore this today</button>
        <button class="btn sm" onclick="openOutfitOccasions('${rec.id}')">🏷 Occasions</button>
        <button class="btn sm danger" onclick="deleteSaved('${rec.id}')">Delete</button>
        ${ratingStars(rec.garmentIds)}
      </div>
    </div>`;
}
window.woreSaved = function (id) {
  const rec = state.outfits.find(o => o.id === id); if (!rec) return;
  wearOutfit(rec.garmentIds.map(getGarment).filter(Boolean));
  rec.timesWorn += 1; rec.lastWorn = todayISO();
  saveToStorage(); haptic(18); renderOutfits();
};
window.deleteSaved = function (id) {
  if (confirm("Delete this saved outfit?")) { haptic(30); deleteOutfitRecord(id); renderOutfits(); }
};

/* ---------- Plan (Gap analysis / Wishlist) ---------- */
function renderPlan() {
  viewTitle.textContent = "Plan";
  const garments = getGarments();
  const seg = segmented([["week", "Week"], ["gaps", "Gap analysis"], ["wishlist", "Wishlist"], ["packing", "Packing"]], planMode, "setPlanMode");
  if (planMode === "week") renderWeekPlanner(garments, seg);
  else if (planMode === "wishlist") renderWishlist(garments, seg);
  else if (planMode === "packing") renderPacking(garments, seg);
  else renderGaps(garments, seg);
}
window.setPlanMode = function (m) { planMode = m; renderPlan(); };

/* ============================================================================
   WEEKLY PLANNER — view
   ============================================================================ */
function renderWeekPlanner(garments, seg) {
  if (!plannerBlockStart) plannerBlockStart = currentMonday();
  if (plannerHorizon == null) plannerHorizon = plannerSettings().horizon;
  const block = plannerBlockList();
  if (!plannerWeek || !block.includes(plannerWeek)) plannerWeek = block[0];
  if (plannerHistory) return renderWeekHistory(garments, seg);

  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◇", "The planner needs a base wardrobe",
      "Add at least a bottom, a shoe and a top, then fill your whole week in one tap.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }

  const monIso = plannerWeek;
  applyCarryOver(monIso);                         // roll unworn past days forward (current week only)
  const dates = weekDates(monIso);
  const week = getWeek(monIso);
  viewSub.textContent = plannerHorizon > 1
    ? `${plannerHorizon}-week block · ${fmtShort(weekDates(block[0])[0])} – ${fmtShort(weekDates(block[block.length - 1])[6])}`
    : `${fmtShort(dates[0])} – ${fmtShort(dates[6])}`;

  // horizon selector (part 6) + settings entry
  const horizonSel = `<div class="pl-strict"><span class="tiny muted">Plan</span><div class="seg sm">
    ${[1, 2, 3, 4].map(n => `<button class="seg-btn ${plannerHorizon === n ? "on" : ""}" onclick="setPlannerHorizon(${n})">${n} wk</button>`).join("")}
  </div><button class="btn sm ghost" onclick="openPlannerSettings()" title="Planner settings">⚙</button></div>`;

  // week tabs when the block spans more than one week (part 6)
  const tabs = plannerHorizon > 1
    ? `<div class="pl-weektabs">${block.map((wk, i) => `<button class="pl-weektab ${wk === monIso ? "on" : ""}" onclick="plannerViewWeek('${wk}')">W${i + 1}<span class="pl-weektab-sub">${fmtShort(weekDates(wk)[0])}</span></button>`).join("")}</div>`
    : `<div class="pl-nav">
        <button class="btn sm ghost" onclick="plannerShiftWeek(-1)" title="Previous week">←</button>
        <button class="pl-week-label" onclick="plannerGoCurrent()" title="Jump to this week">${esc(weekRelLabel(monIso))}</button>
        <button class="btn sm ghost" onclick="plannerShiftWeek(1)" title="Next week">→</button>
      </div>`;

  const wx = plannerWeatherControl();
  const blockFilled = block.some(wk => getWeek(wk).days.some(d => d.outfit));
  const planLabel = plannerHorizon > 1 ? `✨ Auto-plan ${plannerHorizon} weeks` : "✨ Auto-plan week";
  const controls = `<div class="row wrap" style="gap:8px; margin:12px 0 2px;">
    <button class="btn sm primary" onclick="autoPlanUI()">${planLabel}</button>
    ${plannerHorizon > 1 ? `<button class="btn sm" onclick="regenWeekUI()">↻ This week</button>` : ""}
    ${blockFilled ? `<button class="btn sm" onclick="clearWeekUI()">Clear week</button>` : ""}
    <button class="btn sm ghost" onclick="togglePlannerHistory()">History</button>
  </div>`;

  const grid = `<div class="pl-grid" id="pl-grid">${dates.map((_, i) => plannerDayCell(monIso, i)).join("")}</div>`;
  const active = week.days.filter(d => !d.excluded).length;
  const hint = week.days.some(d => d.outfit) ? "" : `<div class="tiny muted" style="text-align:center; margin-top:12px;">Tap <b>${esc(planLabel)}</b> to fill ${active} active day${active === 1 ? "" : "s"}, or tap any day to assign one yourself. Tap a day's ⊘ to switch it off.</div>`;

  view.innerHTML = seg + horizonSel + tabs + wx + controls + grid + hint;
  wirePlannerSwipe();
}

function plannerDayCell(monIso, i) {
  const week = getWeek(monIso), d = week.days[i], iso = weekDates(monIso)[i];
  const isToday = iso === todayISO();
  const hy = hydrateOutfit(d.outfit);
  const temp = plannerForecast.status === "ok" ? plannerForecast.byDate[iso] : undefined;
  const tempTag = (typeof temp === "number" && !d.excluded) ? `<span class="pl-temp">${temp}°</span>` : "";
  const meta = [];
  if (d.importance === "important") meta.push(`<span class="pl-star" title="Important day">★</span>`);
  if (d.locked) meta.push(`<span class="pl-lock" title="Locked">🔒</span>`);
  const badges = [];
  if (d.carriedOver) badges.push(`<span class="pl-badge carry">Carried over</span>`);
  if (d.worn) badges.push(`<span class="pl-badge worn">✓ Worn</span>`);
  const excludeBtn = `<span class="pl-exclude" title="${d.excluded ? "Switch on" : "Switch off"}" onclick="event.stopPropagation(); toggleDayExcluded(${i})">${d.excluded ? "○" : "⊘"}</span>`;
  const body = d.excluded
    ? `<div class="pl-empty">Off</div>`
    : hy ? `<div class="pl-thumbs">${planThumbs(hy.items)}</div>` : `<div class="pl-empty">＋ Empty</div>`;
  return `<button class="pl-day ${isToday ? "today" : ""} ${d.locked ? "locked" : ""} ${d.excluded ? "excluded" : (hy ? "" : "is-empty")} ${d.importance === "important" ? "important" : ""} ${plannerChanged.has(i) ? "changed" : ""}" onclick="openDaySheet(${i})">
    <div class="pl-day-head">
      <span class="pl-dow">${WEEKDAYS[i]}<span class="pl-date">${fmtDayNum(iso)}</span></span>
      <span class="pl-day-meta">${tempTag}${meta.join("")}${excludeBtn}</span>
    </div>
    ${body}
    ${badges.length ? `<div class="pl-badges">${badges.join("")}</div>` : ""}
  </button>`;
}

function planThumbs(items) {
  return items.slice().sort(sortForDisplay).map(g => {
    const inner = g.imageData ? `<img src="${g.imageData}" alt="">` : `<span class="catico">${CATEGORY_ICO[g.category] || "👚"}</span>`;
    const st = g.imageData ? "" : swatchStyle(g.color);
    return `<span class="pl-thumb" style="${st}">${inner}</span>`;
  }).join("");
}

function plannerWeatherControl() {
  if (plannerForecast.status === "ok")
    return `<div class="tiny muted" style="margin-top:8px;">🌤 Forecast highs shown · each day filtered to weather-appropriate outfits. <button class="linkbtn" onclick="clearPlannerForecast()">clear</button></div>`;
  if (plannerForecast.status === "loading")
    return `<div class="tiny muted" style="margin-top:8px;">Locating…</div>`;
  const err = plannerForecast.status === "error"
    ? ` <span class="muted">Couldn’t fetch (offline or location blocked) — planning without weather.</span>` : "";
  return `<div class="tiny muted" style="margin-top:8px;"><button class="linkbtn" onclick="fetchPlannerForecast()">🌤 Add 7-day forecast</button>${err}</div>`;
}

// swipe left/right on the grid to change weeks; a small drag won't fire (day taps still work)
function wirePlannerSwipe() {
  const grid = document.getElementById("pl-grid");
  if (!grid) return;
  let x0 = null, y0 = null;
  grid.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; }, { passive: true });
  grid.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = y0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) plannerSwipeNav(dx < 0 ? 1 : -1);
  }, { passive: true });
  grid.addEventListener("pointercancel", () => { x0 = y0 = null; });
}

/* ----- day sheet: full outfit + all per-day options (tap or long-press a day) ----- */
window.openDaySheet = function (i) {
  plannerSheetDay = i;
  const monIso = plannerWeek, iso = weekDates(monIso)[i], d = getWeek(monIso).days[i];
  const hy = hydrateOutfit(d.outfit);
  const temp = plannerForecast.status === "ok" ? plannerForecast.byDate[iso] : undefined;
  const title = `${WEEKDAYS_FULL[i]} <span class="muted small" style="font-weight:500;">${fmtShort(iso)}${typeof temp === "number" ? ` · ${temp}°` : ""}</span>`;
  const bodyHtml = d.excluded
    ? `<div class="empty muted" style="padding:26px 0;">This day is switched off — the generator skips it.</div>`
    : hy ? visualOutfit(hy.items) : `<div class="empty muted" style="padding:26px 0;">No outfit assigned yet.</div>`;
  const actions = [];
  if (!d.excluded) {
    if (hy && !d.worn) actions.push(`<button class="btn primary" onclick="dayWore()">Wore this</button>`);
    if (hy && d.worn) actions.push(`<button class="btn" disabled>✓ Worn</button>`);
    actions.push(`<button class="btn" onclick="dayAssign()">${hy ? "Replace" : "Assign"} outfit</button>`);
    if (hy && !d.worn) actions.push(`<button class="btn" onclick="dayShuffleFromSheet()">Shuffle</button>`);
    actions.push(`<button class="btn" onclick="dayToggleImportance()">${d.importance === "important" ? "★ Important" : "☆ Mark important"}</button>`);
    actions.push(`<button class="btn" onclick="dayToggleLock()">${d.locked ? "🔓 Unlock" : "🔒 Lock"}</button>`);
    if (hy) actions.push(`<button class="btn ghost danger" onclick="dayClear()">Clear</button>`);
  }
  actions.push(`<button class="btn ${d.excluded ? "primary" : "ghost"}" onclick="dayToggleExcludedSheet()">${d.excluded ? "Switch day on" : "⊘ Switch day off"}</button>`);

  const el = document.createElement("div");
  el.className = "overlay"; el.id = "day-overlay";
  el.innerHTML = `<div class="sheet" style="max-height:86vh; overflow:auto;">
    <div class="row" style="justify-content:space-between; align-items:flex-start;">
      <b style="font-size:16px;">${title}</b>
      <button class="btn sm ghost" onclick="closeDaySheet()">Close</button>
    </div>
    ${d.importance === "important" ? `<div class="tiny muted" style="margin-top:3px;">★ Important — gets a top-ranked outfit when you auto-plan.</div>` : ""}
    ${d.locked ? `<div class="tiny muted" style="margin-top:3px;">🔒 Locked — kept when you auto-plan or shuffle.</div>` : ""}
    ${d.carriedOver ? `<div class="tiny muted" style="margin-top:3px;">↪ Carried over from an earlier unworn day.</div>` : ""}
    <div style="margin-top:12px;">${bodyHtml}</div>
    <div class="row wrap" style="gap:8px; margin-top:14px;">${actions.join("")}</div>
  </div>`;
  el.addEventListener("click", e => { if (e.target === el) closeDaySheet(); });
  document.body.appendChild(el); haptic(10);
};
window.closeDaySheet = function () { const o = document.getElementById("day-overlay"); if (o) o.remove(); };
window.dayWore = function () {
  const d = getWeek(plannerWeek).days[plannerSheetDay], hy = hydrateOutfit(d.outfit);
  if (!hy) return;
  wearOutfit(hy.items); d.worn = true; saveToStorage(); haptic(22);
  closeDaySheet(); renderPlan();
};
window.dayToggleLock = function () {
  const d = getWeek(plannerWeek).days[plannerSheetDay];
  d.locked = !d.locked; saveToStorage(); haptic(12);
  closeDaySheet(); renderPlan();
};
window.dayClear = function () {
  const d = getWeek(plannerWeek).days[plannerSheetDay];
  d.outfit = null; d.worn = false; d.carriedOver = false; saveToStorage(); haptic(12);
  closeDaySheet(); renderPlan();
};
window.dayShuffleFromSheet = function () {
  const changed = shuffleDay(plannerWeek, plannerSheetDay, plannerBlockList());
  plannerChanged = new Set(changed); haptic(16);
  closeDaySheet(); renderPlan();
  if (changed.length) showToast("Day reshuffled");
  else showToast("No different outfit fits the constraints");
  setTimeout(() => { plannerChanged = new Set(); if (currentTab === "plan" && planMode === "week" && !plannerHistory) renderPlan(); }, 1500);
};
window.dayAssign = function () { openAssignPicker(plannerSheetDay); };
window.dayToggleImportance = function () {
  const d = getWeek(plannerWeek).days[plannerSheetDay];
  d.importance = d.importance === "important" ? "normal" : "important";
  saveToStorage(); haptic(10); closeDaySheet(); renderPlan();
};
window.dayToggleExcludedSheet = function () { toggleDayExcluded(plannerSheetDay); closeDaySheet(); };
window.toggleDayExcluded = function (i) {
  const d = getWeek(plannerWeek).days[i];
  d.excluded = !d.excluded;
  if (d.excluded) { d.outfit = null; d.worn = false; d.carriedOver = false; }   // switched-off days hold no plan
  saveToStorage(); haptic(10); renderPlan();
};

/* ----- manual assignment: pick a saved or generated outfit for a day ----- */
window.openAssignPicker = function (i) {
  plannerSheetDay = i; closeDaySheet();
  const iso = weekDates(plannerWeek)[i];
  const season = forecastSeason(iso);
  const scored = plannerPool();
  const gen = poolForDay(scored, season).slice().sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.o);
  const saved = state.outfits.map(o => ({ garmentIds: o.garmentIds, items: o.garmentIds.map(getGarment).filter(Boolean), _name: o.name, _saved: true }))
    .filter(o => o.items.length === o.garmentIds.length && o.items.length);

  const cards = [];
  if (saved.length) cards.push(`<div class="sectitle" style="margin:4px 0 8px;">Saved outfits</div>` + saved.map(assignCard).join(""));
  cards.push(`<div class="sectitle" style="margin:${saved.length ? "16px" : "4px"} 0 8px;">Generated${season ? ` · suited to ${cap(season)} weather` : ""}</div>` +
    (gen.length ? gen.map(assignCard).join("") : `<div class="tiny muted">No outfits available.</div>`));

  const el = document.createElement("div");

window.clearPlannerForecast = function () { plannerForecast = { status: "idle", byDate: {} }; renderPlan(); };
window.fetchPlannerForecast = function () {
  if (!navigator.geolocation) { plannerForecast = { status: "error", byDate: {} }; renderPlan(); return; }
  plannerForecast = { status: "loading", byDate: {} }; renderPlan();
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`${OPEN_METEO_URL}?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max&past_days=7&forecast_days=14&timezone=auto`);
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const times = (data.daily && data.daily.time) || [], temps = (data.daily && data.daily.temperature_2m_max) || [];
      const byDate = {};
      times.forEach((t, i) => { if (typeof temps[i] === "number") byDate[t] = Math.round(temps[i]); });
      plannerForecast = { status: "ok", byDate };
    } catch (e) { plannerForecast = { status: "error", byDate: {} }; }
    if (currentTab === "plan") renderPlan();
  }, () => { plannerForecast = { status: "error", byDate: {} }; if (currentTab === "plan") renderPlan(); }, { timeout: 8000, maximumAge: 1800000 });
};

/* ----- week history: planned vs. actually worn ----- */
function renderWeekHistory(garments, seg) {
  viewSub.textContent = "Planned vs. worn";
  const cur = currentMonday();
  const keys = Object.keys(state.planner.weeks)
    .filter(k => k < cur && state.planner.weeks[k].days.some(d => d.outfit || d.worn))
    .sort().reverse();
  const back = `<div class="row" style="margin:12px 0;"><button class="btn sm ghost" onclick="togglePlannerHistory()">← Back to week</button></div>`;
  if (!keys.length) {
    view.innerHTML = seg + back + emptyState("◷", "No past weeks yet",
      "Plan a week and mark outfits worn. Once a week is behind you it lands here, showing how closely you followed the plan.", "");
    return;
  }
  const blocks = keys.map(k => {
    const w = state.planner.weeks[k], dates = weekDates(k);
    const planned = w.days.filter(d => d.outfit).length;
    const worn = w.days.filter(d => d.worn).length;
    const pct = planned ? Math.round(worn / planned * 100) : 0;
    const rows = w.days.map((d, i) => {
      const hy = hydrateOutfit(d.outfit);
      const status = d.worn ? `<span class="pl-badge worn">✓ Worn</span>`

      return `<div class="pl-hrow">
        <span class="pl-hdow">${WEEKDAYS[i]}</span>

        <span>${status}</span>

    return `<div class="card" style="padding:14px; margin-bottom:14px;">

  }).join("");
  view.innerHTML = seg + back + blocks;
}

function canBuildOutfits(garments) {
  const b = groupByCategory(garments);
  return !!(b.bottom.length && b.shoe.length && (b.base.length || b.mid.length));
}

    return;
  }
  const spent = g.reduce((a, x) => a + x.cost, 0);
  const { count, capped } = generateOutfits(g, { store: 0 });
  const worn = g.filter(x => x.timesWorn > 0);
  const totalWears = g.reduce((a, x) => a + x.timesWorn, 0);
  const avgCpw = worn.length ? worn.reduce((a, x) => a + cpw(x), 0) / worn.length : null;
  const neverWorn = g.filter(x => !x.timesWorn);
  const stale = g.filter(x => x.timesWorn && daysSince(x.lastWorn) >= STALE_DAYS);
  const wl = getWishlist();
  const wlValue = wl.reduce((a, x) => a + x.cost, 0);

  const avgRating = ratings.length ? ratings.reduce((a, r) => a + r, 0) / ratings.length : null;

  const most = g.slice().sort((a, b) => b.timesWorn - a.timesWorn)[0];
  const least = worn.slice().sort((a, b) => a.timesWorn - b.timesWorn)[0];
  const bestValue = worn.slice().sort((a, b) => cpw(a) - cpw(b))[0];   // lowest cost/wear
  const worstValue = worn.slice().sort((a, b) => cpw(b) - cpw(a))[0];  // highest cost/wear

  // wardrobe composition by category
  const catCounts = CATEGORIES.map(c => [CATEGORY_LBL[c], g.filter(x => x.category === c).length]);

  const line = (label, g) => g ? `<div class="row" style="justify-content:space-between; gap:10px;"><span class="small truncate">${esc(g.name)}</span><span class="small muted" style="flex:none;">${label}</span></div>` : "";

function rejectionsCard() {
  const a = analyzeRejections();
  if (!a) { pendingSuggestion = null; return ""; }
  const lbl = r => (REJECT_REASONS.find(x => x[0] === r) || [r, r])[1];
  const list = Object.entries(a.byReason).sort((x, y) => y[1] - x[1]).map(([r, c]) => `<span class="badge">${esc(lbl(r))} · ${c}</span>`).join("");
  pendingSuggestion = a.top ? a.top.suggestion : null;
  const suggestion = a.top ? `
    <div class="small" style="margin-top:10px;">${esc(a.top.message)}</div>
    <button class="btn sm primary" style="margin-top:10px;" onclick="applySuggestion()">${esc(a.top.suggestion.label)}</button>
    <div class="tiny muted" style="margin-top:6px;">Applied only after you confirm — nothing changes automatically.</div>` : "";
  return `<div class="card" style="padding:14px;">
    <div class="sectitle">What you've turned down (${a.total})</div>
    <div class="row wrap" style="gap:6px; margin-top:6px;">${list}</div>
    ${suggestion}
  </div>`;
}
window.applySuggestion = function () {

/* ---------- export / import (move data between devices) ---------- */
window.exportData = function () {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `wardrobe-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
window.importData = function (input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== "object" || !Array.isArray(parsed.garments)) throw new Error("Not a wardrobe export.");
      if (!confirm(`Replace all current data with ${parsed.garments.length} garments from this file?`)) { input.value = ""; return; }
      state = {
        garments: parsed.garments.map(normalizeGarment),
        outfits: Array.isArray(parsed.outfits) ? parsed.outfits : [],
        wishlist: Array.isArray(parsed.wishlist) ? parsed.wishlist.map(x => { const w = normalizeGarment(x); w.isWishlist = true; return w; }) : [],
        ratings: (parsed.ratings && typeof parsed.ratings === "object") ? parsed.ratings : {},
        rejections: Array.isArray(parsed.rejections) ? parsed.rejections : [],
        ruleOverrides: (parsed.ruleOverrides && typeof parsed.ruleOverrides === "object") ? parsed.ruleOverrides : {},
        coWear: (parsed.coWear && typeof parsed.coWear === "object") ? parsed.coWear : {},
        occasions: normalizeOccasions(parsed.occasions),
        profile: normalizeProfile(parsed.profile),
        planner: normalizePlanner(parsed.planner),
      };
      state.outfits = state.outfits.map(o => ({ ...o, occasions: normalizeOutfitOccasions(o) }));
      Object.assign(rules, state.ruleOverrides);
      saveToStorage(); rebuildRatingContext();
      lastUnlock = null; ootd = null; ootdDismissed = false; packResult = null;
      plannerWeek = null; plannerHistory = false; plannerForecast = { status: "idle", byDate: {} };
      alert(`Imported ${state.garments.length} garments.`);
      setTab("wardrobe");
    } catch (err) { alert("Import failed: " + err.message); }
    input.value = "";
  };
  reader.readAsText(file);
};

/* ---------- photo helpers ---------- */
const PHOTO_MAX = 1000;                 // longest side (bumped from 800 to survive cropping)
const PHOTO_BG_DEFAULT = "#eceae6";     // neutral fill behind transparent/letterboxed images
const PHOTO_BGS = ["#eceae6", "#ffffff", "#1a1c20"];

function fileToDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(new Error("read error")); r.onload = e => res(e.target.result); r.readAsDataURL(file); });
}
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("decode error")); im.src = src; });
}
// resize keeping aspect (used by the fast paths: quick add, batch). Fills a neutral bg first.
function resizeImage(file, max) {
  max = max || PHOTO_MAX;
  return fileToDataURL(file).then(loadImage).then(img => {
    let { width, height } = img;
    if (width > height && width > max) { height = Math.round(height * max / width); width = max; }
    else if (height > max) { width = Math.round(width * max / height); height = max; }
    const c = document.createElement("canvas"); c.width = width; c.height = height;
    const ctx = c.getContext("2d"); ctx.fillStyle = PHOTO_BG_DEFAULT; ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);
    return c.toDataURL("image/jpeg", 0.85);
  });
}

/* ---- drag & drop wiring (item: drop zones) ---- */
function wireDropZone(el, onFiles) {
  if (!el) return;
  el.classList.add("dropzone");
  if (!el.querySelector(".drop-hint")) el.insertAdjacentHTML("beforeend", `<div class="drop-hint">Drop to upload</div>`);
  const over = e => { e.preventDefault(); el.classList.add("dragover"); };
  el.addEventListener("dragenter", over);
  el.addEventListener("dragover", over);
  el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove("dragover"); });
  el.addEventListener("drop", e => {
    e.preventDefault(); el.classList.remove("dragover");
    const files = [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith("image/"));
    if (files.length) onFiles(files);
  });
}
// paste: one document-level handler, driven by whatever photo screen is active (cleared each render)
let activePasteHandler = null;
document.addEventListener("paste", e => {
  if (!activePasteHandler) return;
  const items = e.clipboardData && e.clipboardData.items; if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) { const f = it.getAsFile(); if (f) { e.preventDefault(); activePasteHandler([f]); return; } }
  }
});

/* ---- crop modal: pan + pinch/zoom into a 4:5 frame, neutral bg, → cropped JPEG ---- */
function openCropper(srcDataURL, onDone) {
  loadImage(srcDataURL).then(img => {
    const overlay = document.createElement("div"); overlay.className = "overlay"; overlay.id = "crop-overlay";
    overlay.innerHTML = `<div class="sheet">
      <div class="row" style="justify-content:space-between; align-items:center;"><b>Crop photo</b><button class="btn sm ghost" id="crop-cancel">Cancel</button></div>
      <div class="tiny muted" style="margin:4px 0 0;">Drag to reposition · pinch or use the slider to zoom.</div>
      <div class="crop-frame" id="crop-frame"><img id="crop-img"><div class="crop-grid"></div></div>
      <input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" style="width:100%; margin-top:14px;">
      <div class="row" style="gap:8px; align-items:center; margin-top:8px;"><span class="tiny muted">Background</span>
        ${PHOTO_BGS.map((c, i) => `<span class="bg-swatch ${i === 0 ? "on" : ""}" data-bg="${c}" style="background:${c}"></span>`).join("")}
      </div>
      <button class="btn primary" id="crop-done" style="width:100%; margin-top:14px;">Use photo</button>
    </div>`;
    document.body.appendChild(overlay);

    const frame = document.getElementById("crop-frame"), imel = document.getElementById("crop-img");
    const FW = frame.clientWidth, FH = frame.clientHeight;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const cover = Math.max(FW / nw, FH / nh);
    let scale = 1, tx = 0, ty = 0, bg = PHOTO_BGS[0];
    const size = () => ({ w: nw * cover * scale, h: nh * cover * scale });
    const apply = () => {
      const { w, h } = size();
      tx = Math.min(0, Math.max(FW - w, tx)); ty = Math.min(0, Math.max(FH - h, ty));
      imel.style.width = w + "px"; imel.style.height = h + "px"; imel.style.left = tx + "px"; imel.style.top = ty + "px";
    };
    imel.src = srcDataURL;
    (() => { const { w, h } = size(); tx = (FW - w) / 2; ty = (FH - h) / 2; apply(); })();

    const pts = new Map(); let startDist = 0, startScale = 1;
    const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    frame.addEventListener("pointerdown", e => { frame.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const p = [...pts.values()]; startDist = d2(p[0], p[1]); startScale = scale; } });
    frame.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { tx += e.clientX - prev.x; ty += e.clientY - prev.y; apply(); }
      else if (pts.size === 2) { const p = [...pts.values()]; scale = Math.min(4, Math.max(1, startScale * (d2(p[0], p[1]) / startDist))); document.getElementById("crop-zoom").value = scale; apply(); }
    });
    const up = e => pts.delete(e.pointerId);
    frame.addEventListener("pointerup", up); frame.addEventListener("pointercancel", up);
    frame.addEventListener("wheel", e => { e.preventDefault(); scale = Math.min(4, Math.max(1, scale * (e.deltaY < 0 ? 1.08 : 0.92))); document.getElementById("crop-zoom").value = scale; apply(); }, { passive: false });
    document.getElementById("crop-zoom").addEventListener("input", e => { scale = parseFloat(e.target.value); apply(); });
    overlay.querySelectorAll(".bg-swatch").forEach(s => s.addEventListener("click", () => { overlay.querySelectorAll(".bg-swatch").forEach(x => x.classList.remove("on")); s.classList.add("on"); bg = s.dataset.bg; }));
    document.getElementById("crop-cancel").onclick = () => overlay.remove();
    document.getElementById("crop-done").onclick = () => {
      const { w } = size(); const ratio = nw / w;   // natural px per displayed px
      const sx = (-tx) * ratio, sy = (-ty) * ratio, sW = FW * ratio, sH = FH * ratio;
      const OW = 800, OH = 1000;                     // 4:5, longest side 1000
      const c = document.createElement("canvas"); c.width = OW; c.height = OH;
      const ctx = c.getContext("2d"); ctx.fillStyle = bg; ctx.fillRect(0, 0, OW, OH);
      ctx.drawImage(img, sx, sy, sW, sH, 0, 0, OW, OH);
      overlay.remove(); haptic(12); onDone(c.toDataURL("image/jpeg", 0.85));
    };
  }).catch(err => alert("Could not read image: " + err.message));
}

function pickAndCrop(file, onDone) {

  const wrap = document.createElement("div");
  wrap.className = "toast-wrap"; wrap.id = "sw-update";
  wrap.innerHTML = `<div class="toast">
    <span class="msg">New version available</span>
    <button class="btn sm primary" id="sw-refresh">Refresh</button>
    <button class="btn sm ghost" id="sw-later">Later</button>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("sw-refresh").onclick = () => { document.getElementById("sw-refresh").textContent = "Refreshing…"; onRefresh(); };
  document.getElementById("sw-later").onclick = () => wrap.remove();
}

// PWA: register the service worker only when served over http(s). On file:// this
// is a no-op — the app still works, it just can't be installed/offline-cached there.
// Detects a waiting worker and prompts to refresh instead of needing a manual cache clear.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let updating = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    // ignore the first-install clients.claim(); only reload for a user-triggered update
    if (updating) location.reload();
  });
  const onUpdateReady = worker => showUpdatePrompt(() => {
    updating = true;
    worker.postMessage("SKIP_WAITING");
    setTimeout(() => { if (updating) location.reload(); }, 1800); // fallback if controllerchange is missed
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) onUpdateReady(reg.waiting);   // update already waiting from a prior visit
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener("statechange", () => {
          // "installed" + an existing controller ⇒ this is an update, not a first install
          if (nw.state === "installed" && navigator.serviceWorker.controller) onUpdateReady(reg.waiting || nw);
        });
      });
      reg.update().catch(() => {});   // proactively check for a newer SW on load
    }).catch(() => {});
  });
}
</script>
