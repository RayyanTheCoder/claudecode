<!--
  WARDROBE — single-file personal wardrobe app.
  No build step, no framework, no npm. Data lives in localStorage.
  Open this file in a browser; works fully offline.

  Session 1: data layer, CRUD, list view, outfit engine (structural +
  color + formality + season + silhouette rules), unlock counter, browser.
  Session 2: gap analysis, wishlist, outfit of the day, occasion filter,
  manual outfit builder.
  Session 3: weather-aware suggestions (Open-Meteo), outfit rating +
  suggestion weighting, packing mode, JSON export/import, full stats.
  Session 4: UI polish + PWA (visual outfits, quick add, swipe deck, chips,
  unified search, service worker + manifest).
  Session 5: 6-theme system (swatch picker, persisted, status-bar match),
  shake-for-random, expanded haptics, tap a garment to see its outfits,
  similar outfits, wear animation, pull-to-refresh, hover/press states.
  Session 6: guided step-by-step add flow (animated, persisted), quick +
  detailed (advanced) forms, smart defaults from subcategory, bulk edit,
  duplicate, delete-undo, camera capture, batch photo mode, constrained
  shuffle. Adds a 'regular' fit value; engine rules otherwise unchanged.
  Session 7: photo drag/drop + paste + crop step; 1:1 / 4:5 display normalize.
  Session 8: one guided wizard for add + edit of garments AND wishlist items
  (mode-aware), wishlist cost required + projection shown on the summary.
  Session 9: essential vs secondary fields (secondary defaulted, "Add more
  detail" on summary); progressive detail + once-per-session Refine prompt;
  learn-from-corrections reason picker + Stats pattern with confirm-to-apply
  config change (persisted overrides); bulk-add-by-category. Engine untouched.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wardrobe</title>
<meta name="theme-color" content="#0b0c0e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wardrobe" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%95%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />

<style>
  /* ---------- design tokens ---------- */
  :root {
    --bg:        #0b0c0e;
    --bg-raise:  #14161b;
    --bg-raise2: #191c22;
    --border:    #262a31;
    --border-2:  #333843;
    --text:      #e7e9ee;
    --muted:     #8b909b;
    --muted-2:   #6b7077;
    --accent:    #7c8dff;
    --accent-ink:#0b0c0e;
    --good:      #4ec98a;
    --warn:      #e6b84b;
    --bad:       #e07a6b;
    --radius:    14px;
    --tap:       44px;
    --bar:       rgba(16,18,22,.9);
    --shadow:    rgba(0,0,0,.6);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
            "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- layout shell ---------- */
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .sidebar { display: none; }
  main {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 16px calc(84px + env(safe-area-inset-bottom));
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 14px 16px calc(14px);
    background: var(--bar);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }

  /* bottom tabs (phone) */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--bar);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    appearance: none; background: none; border: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 8px; color: var(--muted-2);
    font-size: 11px; cursor: pointer; min-height: var(--tap);
    transition: color .15s ease;
  }
  .tab .ico { font-size: 19px; line-height: 1; }
  .tab.active { color: var(--text); }
  .tab.active .ico { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 50%, transparent)); }

  /* ---------- generic components ---------- */
  .card {
    background: var(--bg-raise);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .tiny { font-size: 11.5px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    appearance: none; cursor: pointer;
    background: var(--bg-raise2); color: var(--text);
    border: 1px solid var(--border-2); border-radius: 10px;
    padding: 9px 13px; min-height: var(--tap);
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .15s ease, border-color .15s ease, transform .05s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:hover { border-color: var(--muted-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn.danger { color: var(--bad); border-color: #4a2b28; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 12.5px; color: var(--muted); }
  .field .req { color: var(--accent); }
  input[type=text], input[type=number], select, textarea {
    background: var(--bg); border: 1px solid var(--border-2);
    border-radius: 10px; padding: 11px 12px; min-height: var(--tap);
    width: 100%; outline: none;
    transition: border-color .15s ease;
  }
  textarea { min-height: 74px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  .invalid { border-color: var(--bad) !important; }
  .err { color: var(--bad); font-size: 12px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg-raise2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted);
  }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .chip.tag { cursor: default; }

  .swatch { width: 14px; height: 14px; border-radius: 5px; border: 1px solid rgba(255,255,255,.18); flex: none; }
  .fam-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- garment grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .g-card { overflow: hidden; display: flex; gap: 12px; padding: 10px; align-items: center; }
  .g-thumb {
    width: 64px; height: 64px; border-radius: 10px; flex: none;
    background: var(--bg-raise2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--muted-2); overflow: hidden;
  }
  .g-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .g-meta { min-width: 0; flex: 1; }
  .g-name { font-weight: 600; }
  .g-actions { display: flex; gap: 6px; flex: none; }

  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--bg-raise2); border: 1px solid var(--border); color: var(--muted); }
  .badge.warn { color: var(--warn); border-color: #4a3f22; }
  .badge.cap { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); font-weight: 600; }

  /* ---------- outfit cards ---------- */
  .o-card { padding: 12px; }
  .o-items { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
  .o-item { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 5px 9px 5px 5px; }
  .o-item .mini { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-raise2); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .o-item .mini img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- unlock banner ---------- */
  .unlock {
    border: 1px solid var(--accent); border-radius: var(--radius);
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent) 4%, transparent));
    padding: 16px; margin-bottom: 16px;
  }
  .unlock .big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .unlock .big.pos { color: var(--accent); }

  /* ---------- stats ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  .stat .l { color: var(--muted); font-size: 12.5px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty .ico { font-size: 40px; opacity: .5; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input { min-height: 40px; width: auto; }
  .search { flex: 1; min-width: 160px; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; }

  .banner { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .banner.warn { background: rgba(230,184,75,.1); border: 1px solid #4a3f22; color: var(--warn); }
  .banner.bad  { background: rgba(224,122,107,.1); border: 1px solid #4a2b28; color: var(--bad); }

  .sectitle { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted-2); margin: 4px 0 2px; }

  /* ---------- desktop ---------- */
  @media (min-width: 860px) {
    .app { flex-direction: row; }
    .tabs { display: none; }
    .sidebar {
      display: flex; flex-direction: column; gap: 4px;
      width: 210px; flex: none; padding: 20px 12px;
      border-right: 1px solid var(--border);
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar .brand { font-size: 17px; font-weight: 700; padding: 6px 12px 16px; }
    .side-tab {
      appearance: none; background: none; border: 0; text-align: left;
      color: var(--muted); padding: 10px 12px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; font-size: 14px;
    }
    .side-tab .ico { font-size: 17px; }
    .side-tab:hover { background: var(--bg-raise); color: var(--text); }
    .side-tab.active { background: var(--bg-raise2); color: var(--text); }
    main { padding: 8px 28px 40px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1180px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  /* ---------- segmented control ---------- */
  .seg { display: inline-flex; background: var(--bg-raise); border: 1px solid var(--border); border-radius: 11px; padding: 3px; margin-bottom: 16px; gap: 2px; }
  .seg-btn { appearance: none; background: none; border: 0; color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; min-height: 36px; }
  .seg-btn.on { background: var(--bg-raise2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }

  /* ---------- occasion chips (interactive) ---------- */
  .chip.btn-chip { cursor: pointer; }
  .chip.btn-chip:hover { border-color: var(--muted-2); color: var(--text); }

  /* ---------- outfit of the day ---------- */
  .ootd {
    border: 1px solid var(--border-2); border-radius: var(--radius);
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, transparent), color-mix(in srgb, var(--bg-raise2) 55%, transparent));
    padding: 16px; margin-bottom: 18px;
  }
  .ootd .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); font-weight: 600; }

  /* ---------- gap analysis ---------- */
  .gap-row { padding: 14px; }
  .gap-delta { font-size: 22px; font-weight: 700; letter-spacing: -.5px; color: var(--accent); flex: none; min-width: 66px; text-align: right; }
  .gap-delta.zero { color: var(--muted-2); }
  .gap-bar { height: 5px; border-radius: 3px; background: var(--bg-raise2); overflow: hidden; margin-top: 8px; }
  .gap-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  /* ---------- manual builder ---------- */
  .build-cat { margin-bottom: 14px; }
  .build-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .pick {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--bg-raise); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px 11px 6px 6px; font-size: 13px; transition: border-color .12s ease, background .12s ease;
  }
  .pick .mini { width: 26px; height: 26px; border-radius: 6px; background: var(--bg-raise2); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .pick .mini img { width: 100%; height: 100%; object-fit: cover; }
  .pick.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .validity { padding: 12px 14px; border-radius: 11px; margin: 4px 0 14px; font-size: 13px; }
  .validity.ok { background: rgba(78,201,138,.1); border: 1px solid #23402f; color: var(--good); }
  .validity.bad { background: rgba(230,184,75,.09); border: 1px solid #4a3f22; color: var(--warn); }

  /* ---------- rating stars ---------- */
  .stars { display: inline-flex; gap: 1px; margin-left: 2px; }
  .star { cursor: pointer; color: var(--muted-2); font-size: 18px; line-height: 1; padding: 2px; transition: color .1s ease; }
  .star.on { color: var(--warn); }
  .star:hover { color: var(--warn); }

  /* ===================== session 4 ===================== */
  /* ===== theme palettes — :root is Charcoal; data-theme swaps the rest ===== */
  :root[data-theme="paper"] {
    --bg:#f5f4f0; --bg-raise:#ffffff; --bg-raise2:#ece9e1; --border:#e4e1d8; --border-2:#d5d1c6;
    --text:#22201c; --muted:#5f5b52; --muted-2:#948f83; --accent:#4f57e8; --accent-ink:#ffffff;
    --good:#2f8f52; --warn:#a9761d; --bad:#b8442f; --bar:rgba(255,255,255,.85); --shadow:rgba(80,66,40,.18);
  }
  :root[data-theme="ink"] {
    --bg:#0c1020; --bg-raise:#141a2e; --bg-raise2:#1a2138; --border:#26304a; --border-2:#34405f;
    --text:#e7eaf3; --muted:#8b94ad; --muted-2:#697391; --accent:#8b7bff; --accent-ink:#0c1020;
    --good:#4ec98a; --warn:#e6b84b; --bad:#e07a6b; --bar:rgba(18,24,44,.9); --shadow:rgba(0,0,8,.6);
  }
  :root[data-theme="sand"] {
    --bg:#efe7d8; --bg-raise:#faf6ec; --bg-raise2:#e7ddca; --border:#ddd1b9; --border-2:#ccbb9c;
    --text:#3a2e20; --muted:#6b5c46; --muted-2:#9a8a70; --accent:#b45f3a; --accent-ink:#ffffff;
    --good:#2f8f52; --warn:#a9761d; --bad:#b8442f; --bar:rgba(250,246,236,.85); --shadow:rgba(90,70,40,.2);
  }
  :root[data-theme="slate"] {
    --bg:#1a2029; --bg-raise:#232b36; --bg-raise2:#2a333f; --border:#354150; --border-2:#45525f;
    --text:#dfe4ea; --muted:#93a0af; --muted-2:#6f7c8b; --accent:#6fa0d6; --accent-ink:#10151b;
    --good:#4ec98a; --warn:#e6b84b; --bad:#e07a6b; --bar:rgba(28,36,46,.9); --shadow:rgba(0,6,16,.55);
  }
  :root[data-theme="noir"] {
    --bg:#000000; --bg-raise:#0c0c0c; --bg-raise2:#151515; --border:#262626; --border-2:#3a3a3a;
    --text:#ffffff; --muted:#a0a0a0; --muted-2:#6e6e6e; --accent:#22d3ee; --accent-ink:#00181c;
    --good:#3ddc84; --warn:#ffcc4d; --bad:#ff6b5e; --bar:rgba(0,0,0,.92); --shadow:rgba(0,0,0,.85);
  }
  /* ===== NEUTRAL themes — no hue anywhere on the chrome, so garment colours read true ===== */
  :root[data-theme="greyscale"] {
    --bg:#1a1a1a; --bg-raise:#242424; --bg-raise2:#2e2e2e; --border:#3a3a3a; --border-2:#4a4a4a;
    --text:#eaeaea; --muted:#9a9a9a; --muted-2:#6e6e6e; --accent:#8c8c8c; --accent-ink:#141414;
    --good:#c8c8c8; --warn:#9a9a9a; --bad:#767676; --bar:rgba(26,26,26,.92); --shadow:rgba(0,0,0,.6);
  }
  :root[data-theme="studio"] {
    /* ~18% grey backdrop (photographer's neutral), off-white surfaces, dark grey text */
    --bg:#787878; --bg-raise:#f4f3f1; --bg-raise2:#e9e8e5; --border:#c9c8c5; --border-2:#b2b1ae;
    --text:#1e1e1e; --muted:#4a4a4a; --muted-2:#5f5f5f; --accent:#4d4d4d; --accent-ink:#f4f3f1;
    --good:#3f7a55; --warn:#7d6224; --bad:#8f4032; --bar:rgba(120,120,120,.94); --shadow:rgba(0,0,0,.22);
  }
  :root[data-theme="canvas"] {
    /* very light warm-neutral, minimal contrast, thin dark text — gallery-like */
    --bg:#f2f0ea; --bg-raise:#f9f8f4; --bg-raise2:#eceae2; --border:#e3e0d7; --border-2:#d2cec2;
    --text:#2a2824; --muted:#6f6b61; --muted-2:#9a968b; --accent:#6b6459; --accent-ink:#f9f8f4;
    --good:#3f7a55; --warn:#8a6a2a; --bad:#9a4436; --bar:rgba(249,248,244,.85); --shadow:rgba(70,60,45,.14);
  }
  /* ===== PREMIUM themes ===== */
  :root[data-theme="obsidian"] {
    --bg:#08080a; --bg-raise:#111113; --bg-raise2:#18181b; --border:#28282c; --border-2:#3a3a3f;
    --text:#f4f1ea; --muted:#a29c90; --muted-2:#6f6a60; --accent:#c9a227; --accent-ink:#0a0a0a;
    --good:#4ec98a; --warn:#e6b84b; --bad:#e07a6b; --bar:rgba(8,8,10,.94); --shadow:rgba(0,0,0,.85);
  }
  :root[data-theme="onyx"] {
    --bg:#08080a; --bg-raise:#111113; --bg-raise2:#18181b; --border:#28282c; --border-2:#3a3a3f;
    --text:#f0ede7; --muted:#9d988e; --muted-2:#6b675e; --accent:#cdbb96; --accent-ink:#14120d;
    --good:#4ec98a; --warn:#e6b84b; --bad:#e07a6b; --bar:rgba(8,8,10,.94); --shadow:rgba(0,0,0,.85);
  }
  :root[data-theme="bronze"] {
    --bg:#120d09; --bg-raise:#1b140e; --bg-raise2:#241a12; --border:#342619; --border-2:#463322;
    --text:#f0e6d4; --muted:#b0a189; --muted-2:#7c6f5b; --accent:#b87333; --accent-ink:#160f08;
    --good:#5aa86a; --warn:#d09a3a; --bad:#cc6a52; --bar:rgba(18,13,9,.94); --shadow:rgba(0,0,0,.8);
  }
  /* 300ms cross-fade applied only while a theme switch is in flight */
  html.theming, html.theming * {
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease, fill .3s ease !important;
  }

  /* ---- hover / press: subtle accent border on interactive surfaces (item 7) ---- */
  .card, .g-card, .o-card, .gap-row, .stat, .hero { transition: border-color .15s ease, box-shadow .15s ease; }
  .card:hover, .g-card:hover, .o-card:hover, .gap-row:hover, .stat:hover, .hero:hover,
  .btn:hover, .fchip:hover, .iconbtn:hover, .pick:hover, .seg-btn:hover, .theme-card:hover,
  .card:active, .o-card:active, .g-card:active, .btn:active, .fchip:active, .pick:active, .iconbtn:active {
    border-color: var(--accent);
  }
  .vrow { cursor: pointer; border-radius: 10px; padding: 2px; margin: -2px; transition: background .12s ease; }
  .vrow:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .vrow:hover .vname { color: var(--accent); }

  /* ---- theme picker sheet ---- */
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

function occasionMatches(rule, items) {

  const f = items.map(i => i.formality);
  if (rule.minFormality != null && Math.min(...f) < rule.minFormality) return false;
  if (rule.maxFormality != null && Math.max(...f) > rule.maxFormality) return false;
  if (rule.peakMin != null && Math.max(...f) < rule.peakMin) return false;

  if (avoidTex.length && items.some(i => avoidTex.includes(i.texture))) return false;

  if (ex.length && items.some(i => ex.includes(i.id))) return false;

    minFormality: num(o && o.minFormality),
    maxFormality: num(o && o.maxFormality),

};

function normalizeHex(hex) {
  if (typeof hex !== "string") return null;
  let h = hex.trim().toLowerCase();
  if (/^#?[0-9a-f]{3}$/.test(h)) { h = h.replace("#", ""); h = "#" + h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }

  else return null;

}
function nameToHex(name) {
  const n = (name || "").trim().toLowerCase();
  if (!n) return null;

function hslOf(hex) { const { r, g, b } = hexToRgb(hex); return rgbToHsl(r, g, b); }

function tempOf(hex) {                                        // warm | cool | neutral (temperature axis)
  const { h, s } = hslOf(hex);
  if (s < 0.15) return "neutral";
  return (h < 75 || h > 320) ? "warm" : "cool";
}
// Derived colour family — reproduces the four buckets from the hex instead of hand-set.
function familyFromHex(hex) {
  const { h, s, l } = hslOf(hex);
  const warmHue = (h >= 20 && h <= 95) || h >= 345;   // browns, tans, olives, warm reds
  if (s >= 0.42 && l > 0.18 && l < 0.86 && !(warmHue && s < 0.5)) return "accent";
  if (l >= 0.72 && s < 0.5) return "neutralLight";    // white / cream / oatmeal — light neutrals
  if (warmHue && s >= 0.18) return "warmNeutral";     // tan / camel / olive / brown
  if (l >= 0.62) return "neutralLight";
  return "neutralDark";
}

// ---- texture (item 2) ----
const TEXTURES = ["jersey", "denim", "knit", "fleece", "corduroy", "suede", "leather", "woven", "technical"];
const TEXTURE_LBL = { jersey: "Jersey", denim: "Denim", knit: "Knit", fleece: "Fleece", corduroy: "Corduroy", suede: "Suede", leather: "Leather", woven: "Woven", technical: "Technical" };
const TEXTURE_BY_SUB = {
  tee: "jersey", "long sleeve": "jersey", tank: "jersey", henley: "jersey", polo: "jersey", "knit tee": "jersey",
  hoodie: "fleece", sweatshirt: "fleece", sweatpants: "fleece",
  "quarter-zip": "knit", crewneck: "knit", cardigan: "knit", knit: "knit",
  jeans: "denim", jacket: "technical", overshirt: "woven", coat: "woven", gilet: "technical",
  chinos: "woven", shorts: "woven", trousers: "woven", cargos: "woven", shirt: "woven",
  sneaker: "technical", boot: "leather", loafer: "leather", sandal: "leather", cords: "corduroy",
};
function textureFor(subcategory, category) {
  const s = (subcategory || "").trim().toLowerCase();
  if (TEXTURE_BY_SUB[s]) return TEXTURE_BY_SUB[s];
  if (/cord/.test(s)) return "corduroy";
  if (/suede/.test(s)) return "suede";
  if (/leather/.test(s)) return "leather";
  if (category === "base") return "jersey";
  if (category === "bottom") return "woven";
  if (category === "shoe") return "technical";
  return "woven";
}

// ---- silhouette (item 4) ----
const SILHOUETTES = ["fitted", "straight", "boxy", "tapered", "longline", "cropped"];
const SILHOUETTE_LBL = { fitted: "Fitted", straight: "Straight", boxy: "Boxy", tapered: "Tapered", longline: "Longline", cropped: "Cropped" };
function silhouetteFor(subcategory, fit, category) {
  const s = (subcategory || "").trim().toLowerCase();
  if (/crop/.test(s)) return "cropped";
  if (/coat|overcoat|trench|longline|parka|mac/.test(s)) return "longline";
  if (category === "bottom") return fit === "slim" ? "tapered" : "straight";
  if (fit === "slim") return "fitted";
  if (fit === "relaxed") return "boxy";
  return "straight";
}

// ---- dressiness / casualness (item 3). Casualness nuance by subcategory so migrated
// loungewear lands high-casual even when its old formality was middling. ----
const CASUAL_BY_SUB = {
  tee: 3, "long sleeve": 3, "knit tee": 2, tank: 4, henley: 3, polo: 2,
  hoodie: 4, sweatshirt: 4, "quarter-zip": 2, crewneck: 2, cardigan: 2, knit: 2,
  jacket: 2, overshirt: 3, coat: 2, gilet: 3, shirt: 2,
  jeans: 3, sweatpants: 5, chinos: 2, shorts: 4, trousers: 1, cargos: 4,
  sneaker: 3, boot: 2, loafer: 1, sandal: 4,
};
function casualFor(subcategory, dressiness) {
  const s = (subcategory || "").trim().toLowerCase();
  if (CASUAL_BY_SUB[s] != null) return CASUAL_BY_SUB[s];
  return clampInt(6 - dressiness, 1, 5, 3);
}

/* ============================================================================

   Stored as hex so the same HSL maths the engine already uses applies. Fully skippable;
   defaults are neutral so an empty profile leaves ranking essentially unchanged.
   ============================================================================ */
const SKIN_SWATCHES = [
  { id: "fair",       label: "Fair",        hex: "#f2d6c2" },
  { id: "light",      label: "Light",       hex: "#e8c1a5" },

const HAIR_SWATCHES = [

  { id: "darkBrown",  label: "Dark brown",  hex: "#3b2a1e" },
  { id: "brown",      label: "Brown",       hex: "#5c4230" },
  { id: "lightBrown", label: "Light brown", hex: "#8a6a48" },

  { id: "hazel",      label: "Hazel",       hex: "#8a6b3a" },

const UNDERTONES = [
  ["warm",    "Warm",    "Veins look green; gold jewellery suits you; you tan easily."],
  ["cool",    "Cool",    "Veins look blue; silver jewellery suits you; you burn easily."],
  ["neutral", "Neutral", "A mix of both, or hard to tell — a safe default."],
];
// A neutral, unset default profile. `active:false` means scoring skips personalisation.
function defaultProfile() {
  return { active: false, skinHex: "#c99a75", undertone: "neutral", hairHex: "#3b2a1e", eyeHex: "#6b4423" };
}
function normalizeProfile(p) {
  const d = defaultProfile();
  if (!p || typeof p !== "object") return d;
  return {
    active: !!p.active,
    skinHex: normalizeHex(p.skinHex) || d.skinHex,
    undertone: ["warm", "cool", "neutral"].includes(p.undertone) ? p.undertone : d.undertone,
    hairHex: normalizeHex(p.hairHex) || d.hairHex,
    eyeHex: normalizeHex(p.eyeHex) || d.eyeHex,
  };
}
// Derived: lightness gap between hair and skin (item 1). Not stored — always computed.
function hairContrast(profile) { return Math.abs(litOf(profile.hairHex) - litOf(profile.skinHex)); }

/* ============================================================================
   DATA LAYER
   ============================================================================ */
let state = { garments: [], outfits: [], wishlist: [], ratings: {}, rejections: [], ruleOverrides: {}, coWear: {}, occasions: defaultOccasions(), profile: defaultProfile(), planner: { strictness: "consecutive", settings: defaultPlannerSettings(), weeks: {} } };

function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.garments = Array.isArray(parsed.garments) ? parsed.garments : [];
      state.outfits  = Array.isArray(parsed.outfits) ? parsed.outfits : [];
      state.wishlist = Array.isArray(parsed.wishlist) ? parsed.wishlist : [];
      state.ratings  = (parsed.ratings && typeof parsed.ratings === "object") ? parsed.ratings : {};
      state.rejections = Array.isArray(parsed.rejections) ? parsed.rejections : [];
      state.ruleOverrides = (parsed.ruleOverrides && typeof parsed.ruleOverrides === "object") ? parsed.ruleOverrides : {};
      state.coWear = (parsed.coWear && typeof parsed.coWear === "object") ? parsed.coWear : {};
      state.occasions = normalizeOccasions(parsed.occasions);
      state.profile = normalizeProfile(parsed.profile);
      // migration: a saved outfit's single `occasion` becomes an `occasions` array (item: multiple per outfit)
      state.outfits = state.outfits.map(o => ({ ...o, occasions: normalizeOutfitOccasions(o) }));
      // migration: re-normalize every garment so old records gain the upgraded fields
      // (colorHex, texture, silhouette, dressiness/casualness) derived from what they had
      state.garments = state.garments.map(normalizeGarment);
      state.wishlist = state.wishlist.map(x => { const w = normalizeGarment(x); w.isWishlist = true; return w; });
      state.planner = normalizePlanner(parsed.planner);
    }
  } catch (e) {
    console.error("load failed", e);
    state = { garments: [], outfits: [], wishlist: [], ratings: {}, rejections: [], ruleOverrides: {}, coWear: {}, occasions: defaultOccasions(), profile: defaultProfile(), planner: { strictness: "consecutive", settings: defaultPlannerSettings(), weeks: {} } };
  }
  Object.assign(rules, state.ruleOverrides);   // apply any confirmed config changes
}
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    alert("Could not save — storage may be full (photos are large). " + e.message);
  }
}

function getGarments() { return state.garments; }
function getGarment(id) { return state.garments.find(g => g.id === id) || null; }

function normalizeGarment(g) {
  const subcategory = (g.subcategory || "").trim();
  const fit = g.fit || "slim";

  // --- colour: hex is primary; family + temperature + lightness derive from it (item 1) ---
  const colorHex = normalizeHex(g.colorHex) || nameToHex(g.color) || FAMILY_TO_HEX[g.colorFamily] || "#3a3f47";
  const colorFamily = familyFromHex(colorHex);   // derived, never hand-set

  // --- formality → two axes (item 3). Migrate from the old single value; nuance casualness by subcategory ---
  const dressiness = clampInt(g.dressiness, 1, 5, clampInt(g.formality, 1, 5, 3));
  const casualness = (g.casualness != null)
    ? clampInt(g.casualness, 1, 5, 3)
    : casualFor(subcategory, dressiness);
  const formality = clampInt(Math.round((dressiness + (6 - casualness)) / 2), 1, 5, 3);  // derived, for legacy UI/rules

  return {
    id: g.id || uid(),
    name: (g.name || "").trim(),
    category: g.category,
    subcategory,
    color: (g.color || "").trim(),
    colorHex,                         // NEW primary colour value
    colorFamily,                      // derived from colorHex
    dressiness,                       // NEW — how formal/elevated (1–5)
    casualness,                       // NEW — how relaxed/informal (1–5)
    formality,                        // derived blend, kept for back-compat
    texture: TEXTURES.includes(g.texture) ? g.texture : textureFor(subcategory, g.category),   // NEW (item 2)
    silhouette: SILHOUETTES.includes(g.silhouette) ? g.silhouette : silhouetteFor(subcategory, fit, g.category), // NEW (item 4)
    // how noticeable a repeat is — drives planner repeat limits. Default by category; user can flag
    // a branded piece "high" regardless. Base worn under a layer is treated as low at plan time.
    visibility: ["high", "medium", "low"].includes(g.visibility) ? g.visibility : ((rules.planner.defaultVisibility || {})[g.category] || "high"),
    // per-garment planner repeat cap; null = use the category default (a branded piece can be tighter)
    maxWeeklyRepeats: (g.maxWeeklyRepeats == null || g.maxWeeklyRepeats === "") ? null : clampInt(g.maxWeeklyRepeats, 1, 14, null),
    season: g.season || "all",
    fit,
    weight: g.weight || "medium",
    visualWeight: g.category === "shoe" ? (g.visualWeight || "standard") : null,
    cost: Number(g.cost) || 0,
    timesWorn: clampInt(g.timesWorn, 0, 1e9, 0),
    lastWorn: g.lastWorn || null,
    dateAdded: g.dateAdded || todayISO(),
    imageData: g.imageData || null,
    rating: g.rating ? clampInt(g.rating, 1, 5, null) : null,
    notes: (g.notes || "").trim(),
    // fields that took a silent default and haven't been confirmed by the user (item 2)
    unconfirmed: Array.isArray(g.unconfirmed) ? g.unconfirmed : [],
  };
}
function clampInt(v, lo, hi, dflt) {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return dflt;
  return Math.min(hi, Math.max(lo, n));
}

function addGarment(data) {
  const g = normalizeGarment(data);
  state.garments.push(g);
  saveToStorage();
  return g;
}
function updateGarment(id, data) {
  const i = state.garments.findIndex(g => g.id === id);
  if (i < 0) return null;
  state.garments[i] = normalizeGarment({ ...state.garments[i], ...data, id });
  saveToStorage();
  return state.garments[i];
}
function deleteGarment(id) {
  state.garments = state.garments.filter(g => g.id !== id);
  // drop saved outfits that referenced it
  state.outfits = state.outfits.filter(o => !o.garmentIds.includes(id));
  saveToStorage();
}

// wear tracking — increments every item and records which pairs were worn together,
// so the engine learns real combinations over time (item 5, learned-pair weighting)
function wearOutfit(items) {
  const stamp = todayISO();
  items.forEach(it => {
    const g = getGarment(it.id);
    if (g) { g.timesWorn += 1; g.lastWorn = stamp; }
  });
  const ids = items.map(i => i.id);
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const pk = ids[i] < ids[j] ? ids[i] + "|" + ids[j] : ids[j] + "|" + ids[i];
    state.coWear[pk] = (state.coWear[pk] || 0) + 1;
  }
  saveToStorage();
  rebuildRatingContext();   // co-wear feeds the learned-pair signal
}

// --- wishlist (hypothetical garments the user is considering buying) ---
function getWishlist() { return state.wishlist; }
function addWishlist(data) {
  const w = normalizeGarment(data);
  w.isWishlist = true;
  state.wishlist.push(w);
  saveToStorage();
  return w;
}
function deleteWishlist(id) {
  state.wishlist = state.wishlist.filter(w => w.id !== id);
  saveToStorage();
}
function updateWishlistItem(id, data) {
  const i = state.wishlist.findIndex(w => w.id === id);
  if (i < 0) return null;
  const w = normalizeGarment({ ...state.wishlist[i], ...data, id });
  w.isWishlist = true;
  state.wishlist[i] = w;
  saveToStorage();
  return w;
}

// --- confirm a silently-defaulted field on a garment (item 2) ---
function confirmGarmentField(id, field, value) {
  const g = getGarment(id); if (!g) return;
  if (value !== undefined) g[field] = field === "formality" ? clampInt(value, 1, 5, g.formality) : value;
  g.unconfirmed = (g.unconfirmed || []).filter(f => f !== field);
  saveToStorage();
}

// --- rejection log + pattern analysis (item 3) ---
const REJECT_REASONS = [
  ["too casual", "Too casual"], ["too dressy", "Too dressy"], ["colours clash", "Colours clash"],
  ["wrong for weather", "Wrong for weather"], ["just not feeling it", "Just not feeling it"],
];
function logRejection(reason, items) {
  const fs = items.map(i => i.formality);
  state.rejections.push({
    reason, formalityMin: Math.min(...fs), formalityMax: Math.max(...fs),
    subcategories: items.map(i => (i.subcategory || "").toLowerCase()).filter(Boolean),
    hasSweatpants: items.some(i => /sweatpant/i.test(i.subcategory)),
    colors: items.map(i => (i.color || "").toLowerCase()).filter(Boolean),
    colorFamilies: items.map(i => i.colorFamily),
    seasons: [...new Set(items.map(i => i.season))],
  });
  if (state.rejections.length > 200) state.rejections.shift();
  saveToStorage();
}
function applyRuleOverride(key, value) {
  state.ruleOverrides[key] = value;
  Object.assign(rules, { [key]: value });
  saveToStorage();
}
// suggest a config change for a reason if a pattern is strong enough; never applies it
function suggestionFor(reason, list) {
  if (reason === "too casual" || reason === "too dressy") {
    if (rules.formalitySpread <= 1) return null;
    const nv = rules.formalitySpread - 1;
    const loungey = list.filter(r => r.hasSweatpants).length;
    return {
      message: `You've rejected ${list.length} outfits as “${reason}”${loungey >= Math.ceil(list.length / 2) ? ", most mixing loungewear with smarter pieces" : ""}. Tighten the formality spread from ${rules.formalitySpread} to ${nv}?`,
      suggestion: { key: "formalitySpread", value: nv, label: `Set formality spread to ${nv}` },
    };
  }
  if (reason === "colours clash") {
    const pc = {};
    list.forEach(r => { const cols = [...new Set(r.colors)]; for (let i = 0; i < cols.length; i++) for (let j = i + 1; j < cols.length; j++) { const k = [cols[i], cols[j]].sort().join("|"); pc[k] = (pc[k] || 0) + 1; } });
    const best = Object.entries(pc).sort((a, b) => b[1] - a[1])[0];
    if (!best || best[1] < 2) return null;
    const [c1, c2] = best[0].split("|");
    if (rules.blockedPairs.some(p => p.map(x => x.toLowerCase()).sort().join("|") === best[0])) return null;
    return {
      message: `${list.length} “colours clash” rejections often pair ${c1} + ${c2}. Flag that pair as requires-intent?`,
      suggestion: { key: "blockedPairs", value: [...rules.blockedPairs, [c1, c2]], label: `Block ${c1} + ${c2}` },
    };
  }
  if (reason === "wrong for weather") {
    const strict = { hot: ["hot", "all"], mild: ["mild", "all"], cold: ["cold", "all"], all: ["hot", "mild", "cold", "all"] };
    if (JSON.stringify(rules.seasonCompatibility) === JSON.stringify(strict)) return null;
    return {
      message: `${list.length} “wrong for weather” rejections. Match seasons strictly, so hot and cold pieces stop mixing with mild?`,
      suggestion: { key: "seasonCompatibility", value: strict, label: "Strict season matching" },
    };
  }
  return null;
}
function analyzeRejections() {
  const rj = state.rejections; if (!rj.length) return null;
  const byReason = {}; rj.forEach(r => byReason[r.reason] = (byReason[r.reason] || 0) + 1);
  let top = null;
  for (const reason of ["too casual", "too dressy", "colours clash", "wrong for weather"]) {
    const list = rj.filter(r => r.reason === reason);
    if (list.length < 3) continue;
    if (top && list.length <= top.count) continue;
    const s = suggestionFor(reason, list);
    if (s) top = { reason, count: list.length, message: s.message, suggestion: s.suggestion };
  }
  return { total: rj.length, byReason, top };
}
// one-tap: move a wishlist item into the real wardrobe as a fresh garment
function convertWishlist(id) {
  const w = state.wishlist.find(x => x.id === id);
  if (!w) return null;
  const { id: _id, isWishlist, timesWorn, lastWorn, dateAdded, ...spec } = w;
  const g = addGarment({ ...spec });
  deleteWishlist(id);
  return g;
}

// --- saved outfits ---
// An outfit can carry several occasions (e.g. school + errands). Legacy records
// stored a single `occasion` string; normalizeOutfitOccasions folds it into the array.
function normalizeOutfitOccasions(o) {
  if (Array.isArray(o.occasions)) return o.occasions.filter(Boolean);
  return o.occasion ? [o.occasion] : [];
}
function saveOutfitRecord({ garmentIds, name = null, occasions = [], isManual = false }) {
  if (state.outfits.some(o => sameSet(o.garmentIds, garmentIds))) return null;
  const rec = { id: uid(), garmentIds, name, occasions: (occasions || []).filter(Boolean), rating: null, timesWorn: 0, lastWorn: null, isManual };
  state.outfits.push(rec);
  saveToStorage();
  return rec;
}
function setOutfitOccasions(recId, occasions) {
  const rec = state.outfits.find(o => o.id === recId);
  if (rec) { rec.occasions = (occasions || []).filter(Boolean); saveToStorage(); }
}
function deleteOutfitRecord(id) {
  state.outfits = state.outfits.filter(o => o.id !== id);
  saveToStorage();
}
function sameSet(a, b) { return a.length === b.length && [...a].sort().join() === [...b].sort().join(); }

// --- outfit ratings (feed back into suggestion weighting) ---
// Ratings are keyed by the sorted garment-id set, so a combo stays rated
// whether it was surfaced by the browser or saved manually.
function outfitKey(ids) { return [...ids].sort().join(","); }
function getOutfitRating(ids) { return state.ratings[outfitKey(ids)] || null; }
function rateOutfit(ids, rating) {
  const key = outfitKey(ids);
  if (rating) state.ratings[key] = rating; else delete state.ratings[key];
  const rec = state.outfits.find(o => sameSet(o.garmentIds, ids)); // mirror onto a saved record
  if (rec) rec.rating = rating || null;
  saveToStorage();
  rebuildRatingContext();
}

// Derived weighting context, recomputed whenever ratings change:
//   exact — rating for a whole combo
//   pair  — average (rating-3) across every rated combo a garment pair appears in
let ratingContext = { exact: {}, pair: new Map() };
let coWearMap = new Map();   // pairKey → times the two garments were worn together
function rebuildRatingContext() {
  const exact = {};
  const sum = new Map(), cnt = new Map();
  for (const [key, rating] of Object.entries(state.ratings)) {
    exact[key] = rating;
    const ids = key.split(",");
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const pk = ids[i] < ids[j] ? ids[i] + "|" + ids[j] : ids[j] + "|" + ids[i];
      sum.set(pk, (sum.get(pk) || 0) + (rating - 3));
      cnt.set(pk, (cnt.get(pk) || 0) + 1);
    }
  }
  const pair = new Map();
  for (const pk of sum.keys()) pair.set(pk, sum.get(pk) / cnt.get(pk));
  ratingContext = { exact, pair };
  coWearMap = new Map(Object.entries(state.coWear || {}));
}

/* ============================================================================
   OUTFIT ENGINE  —  validity, generation, unlock counting
   ============================================================================ */

// Validity: returns { valid, reasons[] }. Single source of truth for every rule.
function isValidOutfit(items) {
  const reasons = [];
  const byCat = { base: [], mid: [], outer: [], bottom: [], shoe: [] };
  for (const it of items) if (byCat[it.category]) byCat[it.category].push(it);

  /* --- structural --- */
  if (byCat.bottom.length !== 1) reasons.push("Needs exactly one bottom");
  if (byCat.shoe.length !== 1)   reasons.push("Needs exactly one shoe");
  if (byCat.base.length > 1)     reasons.push("At most one base layer");
  if (byCat.mid.length > rules.maxMid) reasons.push(`At most ${rules.maxMid} mid layer`);
  if (byCat.outer.length > rules.maxOuter) reasons.push(`At most ${rules.maxOuter} outer layer`);
  if (byCat.mid.length + byCat.outer.length > rules.maxLayers) reasons.push(`At most ${rules.maxLayers} mid/outer layers`);
  // must have a base, OR a mid worn alone
  if (byCat.base.length === 0 && byCat.mid.length === 0) reasons.push("Needs a base layer or a mid worn alone");

  /* --- no two items sharing a subcategory (e.g. two hoodies) --- */
  if (rules.blockDuplicateSubcategory) {
    const seen = new Set();
    for (const it of items) {
      const sub = (it.subcategory || "").trim().toLowerCase();
      if (!sub) continue;
      if (seen.has(sub)) { reasons.push("Two items share a subcategory"); break; }
      seen.add(sub);
    }
  }

  /* --- weight order: lighter layers sit under heavier ones --- */
  const layers = items.filter(i => i.category in TIER);
  for (let a = 0; a < layers.length; a++) {
    for (let b = 0; b < layers.length; b++) {
      if (TIER[layers[a].category] < TIER[layers[b].category]) {

  const created = generateOutfits(withNew, { store: 60, requireId: garment.id });

    .sort((a, b) => b.s - a.s)

/*
  Gap analysis: score each hypothetical garment by how many new outfits it
  unlocks against the current wardrobe. `before` is computed once and reused.
  Returns rows sorted by unlock delta, richest first.
*/
function analyzeGaps(garments, candidates) {
  const before = generateOutfits(garments, { store: 0 });
  return candidates.map(c => {
    const draft = normalizeGarment(c);
    const withNew = garments.concat(draft);
    const after = generateOutfits(withNew, { store: 0 });
    const created = generateOutfits(withNew, { store: 24, requireId: draft.id });
    const best = created.outfits
      .map(o => ({ o, s: scoreOutfit(o.items) }))
      .sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.o);
    const delta = after.count - before.count;
    return {
      spec: c,
      draft,
      delta,
      capped: before.capped || after.capped,
      costPerUnlock: (c.cost > 0 && delta > 0) ? c.cost / delta : null,
      best,
    };
  }).sort((a, b) => b.delta - a.delta);
}

/*
  Outfit of the day: weighted random pick from a pool of valid outfits.
  Weight = aesthetic score, heavily reduced for outfits whose items were worn
  within OOTD_AVOID_DAYS. `excludeKey` skips the current pick on reshuffle.
*/
function pickOOTD(pool, excludeKey) {
  const cands = pool.filter(o => o.garmentIds.join() !== excludeKey);
  if (!cands.length) return pool[0] || null;
  const weighted = cands.map(o => {
    let w = Math.max(0.15, scoreOutfit(o.items));
    const recent = o.items.some(i => { const d = daysSince(i.lastWorn); return d != null && d < OOTD_AVOID_DAYS; });
    if (recent) w *= 0.15;
    return { o, w };
  });
  const total = weighted.reduce((a, x) => a + x.w, 0);
  let r = Math.random() * total;
  for (const x of weighted) { r -= x.w; if (r <= 0) return x.o; }
  return weighted[weighted.length - 1].o;
}

// An outfit suits a season if every item is season-compatible with it.
function outfitSuitsSeason(items, s) {
  return items.every(i => (rules.seasonCompatibility[i.season] || []).includes(s));
}

/*
  Packing mode: cover `days` distinct outfits (matching the chosen occasions)
  with as few garments as possible. Greedy — each step adds the outfit that
  introduces the fewest new garments, tie-broken by aesthetic score (the pool
  is pre-sorted, so the first minimum wins). Returns the capsule + day outfits.
*/
function planPacking(garments, days, occasions) {
  const { outfits } = generateOutfits(garments, { store: OUTFIT_STORE });
  let pool = outfits;
  if (occasions.length) {
    pool = pool.filter(o => occasions.some(occ => matchesOccasionId(occ, o.items)));
  }
  pool = pool.map(o => ({ o, s: scoreOutfit(o.items) })).sort((a, b) => b.s - a.s).map(x => x.o);
  if (!pool.length) return { chosen: [], capsule: [], pool: 0, shortfall: days };

  const chosen = [], capsule = new Set(), used = new Set();
  while (chosen.length < days) {
    let best = null, bestCost = Infinity, bestIdx = -1;
    for (let i = 0; i < pool.length; i++) {
      if (used.has(i)) continue;
      let cost = 0;
      for (const id of pool[i].garmentIds) if (!capsule.has(id)) cost++;
      if (cost < bestCost) { bestCost = cost; best = pool[i]; bestIdx = i; if (cost === 0) break; }
    }
    if (!best) break; // pool exhausted before reaching `days`
    used.add(bestIdx);
    chosen.push(best);
    best.garmentIds.forEach(id => capsule.add(id));
  }
  const capsuleItems = [...capsule].map(getGarment).filter(Boolean);
  return { chosen, capsule: capsuleItems, pool: pool.length, shortfall: Math.max(0, days - chosen.length) };
}

/* ============================================================================
   WEEKLY PLANNER — engine
   A week is keyed by its Monday (ISO date). Each week holds 7 day slots; a slot
   stores only { garmentIds } for its outfit (hydrated against live garments at
   render time). All date math is UTC to match todayISO(), so week boundaries
   never drift with the local clock.
   ============================================================================ */
const WEEKDAYS      = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const WEEKDAYS_FULL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MONTHS_SHORT  = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function isoAddDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function isoWeekdayIdx(iso) { return (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7; }  // 0=Mon … 6=Sun
function mondayOf(iso) { return isoAddDays(iso, -isoWeekdayIdx(iso)); }
function currentMonday() { return mondayOf(todayISO()); }
function weekDates(monIso) { return Array.from({ length: 7 }, (_, i) => isoAddDays(monIso, i)); }
function fmtDayNum(iso) { return String(Number(iso.slice(8, 10))); }
function fmtShort(iso) { return `${Number(iso.slice(8, 10))} ${MONTHS_SHORT[Number(iso.slice(5, 7)) - 1]}`; }
function weekRelLabel(monIso) {
  const diff = Math.round((new Date(monIso + "T00:00:00Z") - new Date(currentMonday() + "T00:00:00Z")) / (7 * 86400000));
  if (diff === 0) return "This week";
  if (diff === 1) return "Next week";
  if (diff === -1) return "Last week";
  return fmtShort(monIso);
}

// ---- planner settings (seeded from rules.planner; user-editable in the preferences panel, part 8) ----
function defaultPlannerSettings() {
  const p = rules.planner;
  return {
    maxWeeklyRepeats: { ...p.maxWeeklyRepeats },
    overlapThreshold: p.overlapThreshold,
    spacing: p.spacing,
    lowVisibilityExempt: p.lowVisibilityExempt,
    defaultExcludedDays: p.defaultExcludedDays.slice(),
    horizon: p.horizon,
  };
}
function normalizePlannerSettings(s) {
  const d = defaultPlannerSettings();
  if (!s || typeof s !== "object") return d;
  const mwr = {};
  ["base", "mid", "outer", "bottom", "shoe"].forEach(c => { mwr[c] = clampInt(s.maxWeeklyRepeats && s.maxWeeklyRepeats[c], 1, 14, d.maxWeeklyRepeats[c]); });
  return {
    maxWeeklyRepeats: mwr,
    overlapThreshold: clampInt(s.overlapThreshold, 0, 4, d.overlapThreshold),
    spacing: ["maximise", "consecutive", "none"].includes(s.spacing) ? s.spacing : d.spacing,
    lowVisibilityExempt: typeof s.lowVisibilityExempt === "boolean" ? s.lowVisibilityExempt : d.lowVisibilityExempt,
    defaultExcludedDays: Array.isArray(s.defaultExcludedDays) ? [...new Set(s.defaultExcludedDays.filter(n => n >= 0 && n <= 6))] : d.defaultExcludedDays,
    horizon: clampInt(s.horizon, 1, 4, d.horizon),
  };
}
function plannerSettings() { return (state.planner && state.planner.settings) || defaultPlannerSettings(); }

function emptyDay(excluded) { return { outfit: null, locked: false, worn: false, carriedOver: false, excluded: !!excluded, importance: "normal" }; }
function emptyWeek() {
  const ex = (state.planner && state.planner.settings ? state.planner.settings.defaultExcludedDays : rules.planner.defaultExcludedDays) || [];
  return { days: Array.from({ length: 7 }, (_, i) => emptyDay(ex.includes(i))) };
}
function normalizePlanner(p) {
  const settings = normalizePlannerSettings(p && p.settings);
  const out = { strictness: (p && p.strictness === "weekly") ? "weekly" : "consecutive", settings, weeks: {} };
  const ex = settings.defaultExcludedDays;
  if (p && p.weeks && typeof p.weeks === "object") {
    for (const k of Object.keys(p.weeks)) {
      const days = Array.isArray(p.weeks[k] && p.weeks[k].days) ? p.weeks[k].days : [];
      out.weeks[k] = { days: Array.from({ length: 7 }, (_, i) => {
        const d = days[i] || {};
        return {
          outfit: (d.outfit && Array.isArray(d.outfit.garmentIds)) ? { garmentIds: d.outfit.garmentIds.slice() } : null,
          locked: !!d.locked, worn: !!d.worn, carriedOver: !!d.carriedOver,
          excluded: typeof d.excluded === "boolean" ? d.excluded : ex.includes(i),
          importance: d.importance === "important" ? "important" : "normal",
        };
      }) };
    }
  }
  return out;
}
function getWeek(monIso) {
  if (!state.planner.weeks[monIso]) state.planner.weeks[monIso] = emptyWeek();
  return state.planner.weeks[monIso];
}
// stored { garmentIds } → { garmentIds, items }; returns null if any garment was since deleted
function hydrateOutfit(o) {
  if (!o || !Array.isArray(o.garmentIds) || !o.garmentIds.length) return null;
  const items = o.garmentIds.map(getGarment).filter(Boolean);
  if (items.length !== o.garmentIds.length) return null;
  return { garmentIds: o.garmentIds.slice(), items };
}

function plannerPool() {
  const { outfits } = generateOutfits(getGarments(), { store: OUTFIT_STORE });
  return outfits.map(o => ({ o, s: Math.max(0.15, scoreOutfit(o.items)) }));
}
function lookKey(o) { return o.garmentIds.slice().sort().join(","); }   // whole-look identity (distinct from outfitKey(ids))
function sharesGarment(o, idSet) { return o.garmentIds.some(id => idSet.has(id)); }
function forecastSeason(iso) {
  const t = plannerForecast.status === "ok" ? plannerForecast.byDate[iso] : undefined;
  return (typeof t === "number") ? tempToSeason(t) : null;
}
// graceful weather filter: narrow to outfits suiting `season`; if that empties, keep the pool
function poolForDay(scored, season) {
  if (!season) return scored;
  const f = scored.filter(x => outfitSuitsSeason(x.o.items, season));
  return f.length ? f : scored;
}

/*
  Weighted-random outfit pick. `blocked` is a set of garment ids the pick should
  avoid (the no-repeat constraint) — soft: if nothing avoids them we fall back to
  the full pool rather than leaving a gap. Whole-look repeats and recently-worn
  items are down-weighted, mirroring the OOTD logic.
*/
function weightedPick(scored, opts = {}) {
  const { blocked = new Set(), excludeKey = null, avoidKeys = new Set() } = opts;
  if (!scored.length) return null;
  let pool = excludeKey ? scored.filter(x => x.o.garmentIds.join() !== excludeKey) : scored;
  if (!pool.length) pool = scored;
  const clean = pool.filter(x => !sharesGarment(x.o, blocked));
  const use = clean.length ? clean : pool;                       // soft fallback
  const weighted = use.map(x => {
    let w = x.s;
    if (avoidKeys.has(lookKey(x.o))) w *= 0.12;                // discourage reusing the same whole look
    const recent = x.o.items.some(i => { const d = daysSince(i.lastWorn); return d != null && d < OOTD_AVOID_DAYS; });
    if (recent) w *= 0.3;
    return { o: x.o, w: Math.max(0.02, w) };
  });
  const total = weighted.reduce((a, x) => a + x.w, 0);
  let r = Math.random() * total;
  for (const x of weighted) { r -= x.w; if (r <= 0) return { garmentIds: x.o.garmentIds.slice(), items: x.o.items }; }
  const last = weighted[weighted.length - 1].o;
  return { garmentIds: last.garmentIds.slice(), items: last.items };
}

// A day is "fixed" (never regenerated) if it's locked or already marked worn.
function dayFixed(d) { return d.locked || d.worn; }

/* ---------- repetition + visibility + overlap (parts 1, 2, 4) ---------- */
// A garment's effective visibility within a given outfit: a base under a layer is barely
// seen (low); a base worn alone reads full (high); a user-flagged branded piece is always
// high. Everything else keeps its stored visibility (part 2).
function effectiveVisibility(g, items) {
  if (g.visibility === "high") return "high";
  if (g.category === "base") return items.some(i => i.category === "mid" || i.category === "outer") ? "low" : "high";
  return g.visibility || "high";
}
// How many times this garment may appear across the planned period, adjusted for visibility.
// A per-garment override (g.maxWeeklyRepeats) wins over the category default entirely.
function effectiveRepeatLimit(g, items, settings) {
  if (g.maxWeeklyRepeats != null) return Math.max(1, g.maxWeeklyRepeats);
  const base = (settings.maxWeeklyRepeats || {})[g.category];
  const lim = (base == null) ? 2 : base;
  const vis = effectiveVisibility(g, items);
  if (vis === "low") return settings.lowVisibilityExempt ? Infinity : lim + 1;
  const delta = (rules.planner.visibilityRepeatDelta || {})[vis] || 0;   // high stricter, medium neutral
  return Math.max(1, lim + delta);
}
function overlapCount(idsA, idsB) { const b = new Set(idsB); let n = 0; for (const id of idsA) if (b.has(id)) n++; return n; }

/* ---------- active-day model across a multi-week block (parts 6, 7) ---------- */
function horizonWeeks(startMonIso, weeksCount) { return Array.from({ length: Math.max(1, weeksCount) }, (_, w) => isoAddDays(startMonIso, w * 7)); }
// Flat, ordered list of the days the generator may touch — excluded days are skipped
// entirely, so spacing/adjacency counts across ACTIVE days only (part 7). `pos` is the
// continuous active-sequence index, which makes Fri→Mon across a week boundary adjacent (part 6).
function buildActiveNodes(weekIsos) {
  const nodes = [];
  weekIsos.forEach(wk => {
    const week = getWeek(wk), dates = weekDates(wk);
    week.days.forEach((day, idx) => { if (day.excluded) return; nodes.push({ weekIso: wk, idx, date: dates[idx], day }); });
  });
  nodes.forEach((n, i) => n.pos = i);
  return nodes;
}
function seedAccumulator(contextNodes) {
  const counts = new Map(), placedLooks = new Set(), placements = [];
  contextNodes.forEach(n => {
    const hy = hydrateOutfit(n.day.outfit); if (!hy) return;
    hy.garmentIds.forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
    placedLooks.add(lookKey(hy));
    placements.push({ pos: n.pos, garmentIds: hy.garmentIds });
  });
  return { counts, placedLooks, placements };
}

/*
  Shared greedy placement. Fills `targetNodes` given `contextNodes` (already-decided days,
  e.g. locked/worn or other weeks' plans). Enforces, in order of relaxation:
    0 — whole-look uniqueness, overlap ≤ threshold, per-garment repeat limits, no-adjacent-repeat
    1 — drops repeat limits + adjacency
    2 — drops overlap too (last resort so an active day is never left empty)
  Important days pick the top-ranked valid outfit; normal days pick weighted-random for variety (part 5).
*/
function placeNodes(targetNodes, contextNodes, scored, settings) {
  const { counts, placedLooks, placements } = seedAccumulator(contextNodes);
  const topOf = cands => { const b = cands.reduce((a, x) => x.s > a.s ? x : a); return { garmentIds: b.o.garmentIds.slice(), items: b.o.items }; };
  const violates = (o, node, relax) => {
    if (placedLooks.has(lookKey(o))) return true;                                  // no outfit repeats across the block
    // an explicit per-garment limit is a deliberate choice — protected until the very last resort
    if (relax < 3) for (const g of o.items) if (g.maxWeeklyRepeats != null && (counts.get(g.id) || 0) + 1 > g.maxWeeklyRepeats) return true;
    if (relax < 2) for (const p of placements) if (overlapCount(o.garmentIds, p.garmentIds) > settings.overlapThreshold) return true;
    if (relax < 1) {
      for (const g of o.items) if (g.maxWeeklyRepeats == null && (counts.get(g.id) || 0) + 1 > effectiveRepeatLimit(g, o.items, settings)) return true;
      if (settings.spacing !== "none") for (const p of placements) if (Math.abs(p.pos - node.pos) === 1 && overlapCount(o.garmentIds, p.garmentIds) > 0) return true;
    }
    return false;
  };
  const ordered = targetNodes.filter(n => n.day.importance === "important").concat(targetNodes.filter(n => n.day.importance !== "important"));
  for (const node of ordered) {
    const dayPool = poolForDay(scored, forecastSeason(node.date));
    let pick = null;
    for (let relax = 0; relax <= 3 && !pick; relax++) {
      const cands = dayPool.filter(x => !violates(x.o, node, relax));
      if (!cands.length) continue;
      pick = node.day.importance === "important" ? topOf(cands) : weightedPick(cands, {});
    }
    if (!pick) pick = topOf(dayPool.length ? dayPool : scored);
    node.day.outfit = { garmentIds: pick.garmentIds.slice() }; node.day.worn = false; node.day.carriedOver = false;
    pick.garmentIds.forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
    placedLooks.add(lookKey(pick));
    placements.push({ pos: node.pos, garmentIds: pick.garmentIds });
  }
}

// Count of same-garment repeats landing on adjacent active days — the thing spacing fights.
function adjacencyCount(nodes) {
  const pos = new Map();
  nodes.forEach(n => { const hy = hydrateOutfit(n.day.outfit); if (hy) hy.garmentIds.forEach(id => { (pos.get(id) || pos.set(id, []).get(id)).push(n.pos); }); });
  let c = 0;
  for (const arr of pos.values()) { arr.sort((a, b) => a - b); for (let i = 1; i < arr.length; i++) if (arr[i] - arr[i - 1] === 1) c++; }
  return c;
}
/* Placement is randomised (weighted picks for variety), and a single local-search pass can
   get stuck, so run a few whole placements and keep the one with the fewest adjacencies —
   then, for "maximise", the best spread. Cheap and much more reliable on small wardrobes. */
// How many times an explicit per-garment limit is exceeded across the block (the constraint
// the user most cares about — used to rank trials ahead of spacing).
function overLimitCount(nodes) {
  const counts = new Map();
  nodes.forEach(n => { const hy = hydrateOutfit(n.day.outfit); if (hy) hy.garmentIds.forEach(id => counts.set(id, (counts.get(id) || 0) + 1)); });
  let v = 0;
  for (const [id, c] of counts) { const g = getGarment(id); if (g && g.maxWeeklyRepeats != null && c > g.maxWeeklyRepeats) v += c - g.maxWeeklyRepeats; }
  return v;
}
function bestOfPlacements(open, fixed, allNodes, scored, settings) {
  if (!open.length) return;
  const trials = settings.spacing === "none" ? 3 : 6;
  let best = null, bestKey = null;
  for (let t = 0; t < trials; t++) {
    open.forEach(n => { n.day.outfit = null; });
    placeNodes(open, fixed, scored, settings);
    if (settings.spacing !== "none") repairSpacing(allNodes, settings);
    // rank: fewest explicit-limit breaches first, then fewest adjacencies, then best spread
    const key = [overLimitCount(allNodes), adjacencyCount(allNodes), -spacingObjective(allNodes, settings.spacing)];
    const better = !bestKey || key[0] < bestKey[0] || (key[0] === bestKey[0] && (key[1] < bestKey[1] || (key[1] === bestKey[1] && key[2] < bestKey[2])));
    if (better) { best = open.map(n => n.day.outfit); bestKey = key; }
    if (key[0] === 0 && key[1] === 0 && settings.spacing !== "maximise") break;   // clean enough for avoid-consecutive
  }
  open.forEach((n, i) => { n.day.outfit = best[i]; });
}

/* Plan a whole block of `weeksCount` weeks in one pass (part 6). Constraints span the
   full period; locked/worn days are kept and seed the constraints. */
function planHorizon(startMonIso, weeksCount) {
  const scored = plannerPool();
  if (!scored.length) return false;
  const settings = plannerSettings();
  const nodes = buildActiveNodes(horizonWeeks(startMonIso, weeksCount));
  if (!nodes.length) return false;
  const fixed = nodes.filter(n => dayFixed(n.day));
  const open = nodes.filter(n => !dayFixed(n.day));
  bestOfPlacements(open, fixed, nodes, scored, settings);
  saveToStorage();
  return true;
}

/* Maximum-spacing pass (part 3): swap outfits between non-fixed active days to push
   repeats of the same garment as far apart as possible, keeping weather-suit intact.
   The set of outfits is unchanged, so repeat/overlap limits stay satisfied. */
// Objective for the swap pass. In both modes adjacency (gap 1) between active days is a
// heavy cost; "maximise" additionally rewards larger minimum gaps so repeats spread out,
// while "consecutive" only cares about removing back-to-back repeats.
function spacingObjective(nodes, mode) {
  const pos = new Map();
  nodes.forEach(n => { const hy = hydrateOutfit(n.day.outfit); if (hy) hy.garmentIds.forEach(id => { (pos.get(id) || pos.set(id, []).get(id)).push(n.pos); }); });
  let score = 0;
  for (const arr of pos.values()) {
    if (arr.length < 2) continue;
    arr.sort((a, b) => a - b);
    let minGap = Infinity;
    for (let i = 1; i < arr.length; i++) minGap = Math.min(minGap, arr[i] - arr[i - 1]);
    if (mode === "maximise") score += minGap;
    if (minGap === 1) score -= 100;   // adjacency across active days is always a cost (part 3 + boundary continuity)
  }
  return score;
}
function repairSpacing(nodes, settings) {
  const mode = settings.spacing;
  const swappable = nodes.filter(n => !dayFixed(n.day) && n.day.outfit);
  const suits = n => { const season = forecastSeason(n.date); if (!season) return true; const hy = hydrateOutfit(n.day.outfit); return hy ? outfitSuitsSeason(hy.items, season) : true; };
  let improved = true, guard = 0;
  while (improved && guard++ < 40) {
    improved = false;
    for (let a = 0; a < swappable.length; a++) for (let b = a + 1; b < swappable.length; b++) {
      const na = swappable[a], nb = swappable[b], oa = na.day.outfit, ob = nb.day.outfit;
      const before = spacingObjective(nodes, mode);
      na.day.outfit = ob; nb.day.outfit = oa;
      if (suits(na) && suits(nb) && spacingObjective(nodes, mode) > before) improved = true;
      else { na.day.outfit = oa; nb.day.outfit = ob; }   // revert
    }
  }
}

/* Regenerate just one week's non-fixed days, keeping every other week's plan (and all
   locked days everywhere) as fixed context (part 6). */
function regenerateWeek(weekIso, blockWeekIsos) {
  const scored = plannerPool();
  if (!scored.length) return false;
  const settings = plannerSettings();
  const weeks = (blockWeekIsos && blockWeekIsos.length) ? blockWeekIsos : [weekIso];
  if (!weeks.includes(weekIso)) weeks.push(weekIso);
  const nodes = buildActiveNodes(weeks);
  const target = nodes.filter(n => n.weekIso === weekIso && !dayFixed(n.day));
  const context = nodes.filter(n => !target.includes(n));   // other weeks + this week's fixed days
  if (!target.length) return false;
  bestOfPlacements(target, context, nodes, scored, settings);
  saveToStorage();
  return true;
}

// Backward-compatible single-week plan.
function autoPlanWeek(monIso) { return planHorizon(monIso, 1); }

/*
  Reshuffle a single day to a different valid outfit, honouring every constraint against
  the rest of the block (part 6). Returns the day index for the flash highlight.
*/
function shuffleDay(monIso, dayIdx, blockWeekIsos) {
  const scored = plannerPool();
  if (!scored.length) return [];
  const settings = plannerSettings();
  const week = getWeek(monIso), target = week.days[dayIdx];
  if (dayFixed(target) || target.excluded) return [];
  const weeks = (blockWeekIsos && blockWeekIsos.length) ? blockWeekIsos.slice() : [monIso];
  if (!weeks.includes(monIso)) weeks.push(monIso);
  const nodes = buildActiveNodes(weeks);
  const targetNode = nodes.find(n => n.weekIso === monIso && n.idx === dayIdx);
  const { counts, placedLooks, placements } = seedAccumulator(nodes.filter(n => n !== targetNode));
  const cur = hydrateOutfit(target.outfit);
  const dayPool = poolForDay(scored, forecastSeason(weekDates(monIso)[dayIdx]));
  const violates = (o, relax) => {
    if (cur && o.garmentIds.join() === cur.garmentIds.join()) return true;   // force a change
    if (placedLooks.has(lookKey(o))) return true;
    if (relax < 3) for (const g of o.items) if (g.maxWeeklyRepeats != null && (counts.get(g.id) || 0) + 1 > g.maxWeeklyRepeats) return true;
    if (relax < 2) for (const p of placements) if (overlapCount(o.garmentIds, p.garmentIds) > settings.overlapThreshold) return true;
    if (relax < 1) {
      for (const g of o.items) if (g.maxWeeklyRepeats == null && (counts.get(g.id) || 0) + 1 > effectiveRepeatLimit(g, o.items, settings)) return true;
      if (settings.spacing !== "none" && targetNode) for (const p of placements) if (Math.abs(p.pos - targetNode.pos) === 1 && overlapCount(o.garmentIds, p.garmentIds) > 0) return true;
    }
    return false;
  };
  let pick = null;
  for (let relax = 0; relax <= 3 && !pick; relax++) { const cands = dayPool.filter(x => !violates(x.o, relax)); if (cands.length) pick = weightedPick(cands, {}); }
  if (!pick) return [];
  target.outfit = { garmentIds: pick.garmentIds.slice() }; target.worn = false; target.carriedOver = false;
  saveToStorage();
  return [dayIdx];
}

/*
  Carry unworn plans forward: for the live current week, any past day that had an
  outfit but was never marked worn rolls into the next empty, unlocked day that is
  today or later. Runs on render; the moved-out source becomes empty so it can't
  re-trigger.
*/
function applyCarryOver(monIso) {
  if (monIso !== currentMonday()) return false;
  const week = getWeek(monIso);
  const dates = weekDates(monIso);
  const today = todayISO();
  let moved = false;
  for (let i = 0; i < 7; i++) {
    if (dates[i] >= today) break;
    const src = week.days[i];
    if (src.locked || src.worn || src.excluded || !src.outfit) continue;
    for (let j = i + 1; j < 7; j++) {
      if (dates[j] < today) continue;
      const tgt = week.days[j];
      if (tgt.locked || tgt.excluded || tgt.outfit) continue;
      tgt.outfit = src.outfit; tgt.carriedOver = true; tgt.worn = false;
      src.outfit = null; src.carriedOver = false;
      moved = true; break;
    }
  }
  if (moved) saveToStorage();
  return moved;
}

      <div class="chiprow scroll">${sorts.map(([v, l]) => fchip(l, filters.sort === v, `setWFilter('sort','${v}')`)).join("")}</div>
    </div>`;

  let list = g.slice();
  if (filters.category !== "all") list = list.filter(x => x.category === filters.category);
  if (filters.season !== "all") list = list.filter(x => x.season === filters.season || x.season === "all");
  list.sort((a, b) => {
    switch (filters.sort) {
      case "cost": return b.cost - a.cost;
      case "timesWorn": return b.timesWorn - a.timesWorn;
      case "cpw": return (cpw(a) ?? 1e12) - (cpw(b) ?? 1e12);

  const cards = list.map(garmentCard).join("");
  view.innerHTML = actions + selbar + toolbar + (list.length
    ? `<div class="grid">${cards}</div>`
    : `<div class="empty muted">No garments match those filters.</div>`);

function garmentCard(g) {

  const staleBadge = (g.timesWorn && stale != null && stale >= STALE_DAYS)
    ? `<span class="badge warn" title="Not worn in ${stale} days">💤 ${stale}d</span>` : "";
  const thumb = g.imageData ? `<img src="${g.imageData}" alt="" />` : `<span>${CATEGORY_ICO[g.category] || "👚"}</span>`;

window.openBulkPicker = function (field) {

  const el = document.createElement("div"); el.className = "overlay"; el.id = "bulk-overlay";

window.bulkApply = function (field, value) {

    : field === "formality" ? { formality: parseInt(value, 10) }
    : field === "maxWeeklyRepeats" ? { maxWeeklyRepeats: value === "" ? null : parseInt(value, 10) }
    : { [field]: value };

/* ---- long-press context menu (items 1 & 2) ---- */
function wireLongPress() {
  document.querySelectorAll("#view .g-card[data-id]").forEach(card => {
    let timer = null, sx = 0, sy = 0;
    card.addEventListener("pointerdown", e => {
      if (selectMode) return;
      sx = e.clientX; sy = e.clientY;
      timer = setTimeout(() => { timer = null; haptic(18); openCtx(card.dataset.id, e.clientX, e.clientY); }, 500);
    });
    card.addEventListener("pointermove", e => { if (timer && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 10) { clearTimeout(timer); timer = null; } });
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    card.addEventListener("pointerup", cancel); card.addEventListener("pointercancel", cancel); card.addEventListener("pointerleave", cancel);
  });
}
window.openCtx = function (id, x, y) {
  closeCtx();
  const el = document.createElement("div"); el.className = "ctx"; el.id = "ctx";
  el.style.left = Math.min(x, window.innerWidth - 196) + "px";
  el.style.top = Math.min(y, window.innerHeight - 190) + "px";
  el.innerHTML = `
    <button onclick="ctxSelect('${id}')">☑ Select multiple</button>
    <button onclick="duplicateGarment('${id}')">⧉ Duplicate</button>
    <button onclick="startEdit('${id}');closeCtx()">✎ Edit</button>
    <button class="danger" onclick="ctxDelete('${id}')">🗑 Delete</button>`;
  document.body.appendChild(el);
  setTimeout(() => document.addEventListener("pointerdown", ctxOutside), 0);
};
function ctxOutside(e) { const c = document.getElementById("ctx"); if (c && !c.contains(e.target)) closeCtx(); }
window.closeCtx = function () { const c = document.getElementById("ctx"); if (c) c.remove(); document.removeEventListener("pointerdown", ctxOutside); };
window.ctxSelect = function (id) { closeCtx(); selectMode = true; selected.clear(); selected.add(id); render(); };
window.ctxDelete = function (id) { closeCtx(); confirmDelete(id); };

/* ----- Suggested: today's outfit hero + swipe deck (phone) / list (desktop) ----- */
function renderSuggested(garments, seg) {
  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyPreview("◈", "No outfits yet",
      "Add a bottom, a shoe and a top, and today's look shows up right here to wear in one tap.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample</button>`),
      previewOutfitCards());
    return;
  }

  const { outfits, count, capped } = generateOutfits(garments, { store: OUTFIT_STORE });
  // rank with the active occasion's scoring lean (e.g. Date boosts contrast + texture)
  const occ = occasionFilter !== "all" ? occasionFilter : null;

  const weatherOn = weatherFilter && weather.status === "ok";
  let pool = weatherOn ? outfits.filter(o => outfitSuitsSeason(o.items, weather.season)) : outfits;
  if (occ) pool = pool.filter(o => matchesOccasionId(occ, o.items));
  // constrained shuffle — only outfits containing every "must include" garment (item 7)
  if (mustInclude.size) pool = pool.filter(o => [...mustInclude].every(id => o.garmentIds.includes(id)));
  // score, then run the diversity pass so the top of the deck isn't near-duplicates (item 4)
  pool = diversify(pool, occ);

  // today's pick leads the deck (weighted away from recently-worn)
  if (!ootd || !pool.some(o => o.garmentIds.join() === ootd.garmentIds.join())) ootd = pickOOTD(pool, "");
  const deck = ootd ? [ootd, ...pool.filter(o => o.garmentIds.join() !== ootd.garmentIds.join())] : pool.slice();
  deckCache = deck;
  deckIndex = Math.max(0, Math.min(deckIndex, deck.length - 1));

  viewSub.textContent = `${count}${capped ? "+" : ""} valid · ${pool.length} shown`;

  const occChips = `<div class="chiprow scroll" style="margin-bottom:14px;">
    ${["all", ...occasionIds()].map(o => fchip(o === "all" ? "All" : occasionLabel(o), occasionFilter === o, `setOccasion('${o}')`)).join("")}
    ${fchip("⚙ Edit", false, "openOccasionEditor()")}</div>`;
  const controls = weatherBar() + occChips + mustIncludeBar();

  if (!deck.length) {
    const names = [...mustInclude].map(id => getGarment(id)).filter(Boolean).map(g => g.name).join(" + ");
    const msg = mustInclude.size ? `No valid outfits include ${esc(names)}. Remove a constraint to see more.`
      : weatherOn ? `No outfits suit ${weather.tempC}°C right now — clear the weather filter to see more.`
      : `No ${occasionFilter === "all" ? "" : occasionLabel(occasionFilter) + " "}outfits from your current wardrobe.`;
    view.innerHTML = seg + controls + `<div class="empty muted">${msg}</div>`;
    return;
  }

  const current = deck[deckIndex];
  const similar = similarSection(current, pool);
  const refine = refineCard();
  if (isPhone()) {
    // phone: single big card, swipe to browse
    view.innerHTML = seg + refine + controls + deckView(deck) + similar;
    wireDeck();
    wirePullRefresh();
  } else {
    // desktop: hero + similar + scrolling grid fallback
    const rest = deck.filter((_, i) => i !== deckIndex);
    const listCards = rest.slice(0, 60).map((o, i) => outfitCard(o, i)).join("");
    view.innerHTML = seg + refine + controls + heroCard(current, deck.length, deckIndex) + similar +
      `<div class="sectitle" style="margin:22px 0 10px;">Browse all (${deck.length})</div>
       <div class="grid">${listCards}</div>`;
  }
}

/* ---- "Refine" prompt: one question about one incomplete garment, once/session (item 2) ---- */
function refineTarget() {
  for (const field of ["season", "formality", "weight", "fit"]) {   // most validity-affecting first
    const g = getGarments().find(x => (x.unconfirmed || []).includes(field));
    if (g) return { garment: g, field };
  }
  return null;
}
function refineCard() {
  if (refineShown) return "";
  const t = refineTarget(); if (!t) return "";
  const { garment: g, field } = t;
  const opts = field === "season" ? WIZ_SEASON
    : field === "weight" ? WIZ_WEIGHT
    : field === "fit" ? WIZ_FIT.map(f => [f[0], f[1]])
    : [1, 2, 3, 4, 5].map(n => [String(n), WIZ_FORM[n - 1]]);
  const q = field === "season" ? `Is the ${g.name} for hot, mild, cold, or all-year weather?`
    : field === "weight" ? `How heavy is the ${g.name}?`
    : field === "fit" ? `How does the ${g.name} fit?`
    : `How dressy is the ${g.name}?`;
  return `<div class="card" style="padding:14px; margin-bottom:14px; border-color:var(--accent);">
    <div class="row" style="justify-content:space-between; align-items:flex-start;">
      <div class="eyebrow" style="color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Quick refine</div>
      <button class="iconbtn" style="width:28px; height:28px; font-size:15px;" onclick="dismissRefine()">×</button>
    </div>
    <div class="small" style="margin:6px 0 10px;">${esc(q)}</div>
    <div class="row wrap" style="gap:7px;">${opts.map(([v, l]) => `<button class="fchip" onclick="answerRefine('${g.id}','${field}','${v}')">${esc(l)}</button>`).join("")}</div>
  </div>`;
}

window.dismissRefine = function () { refineShown = true; haptic(6); renderOutfits(); };
