<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>Passage Roulette</title>
<style>
  :root {
    --bg: #0f0f10;
    --surface: #1a1a1c;
    --surface-2: #242427;
    --border: #2e2e32;
    --text: #ececec;
    --text-dim: #9a9aa0;
    --text-faint: #6a6a70;
    --accent: #e0a458;
    --accent-ink: #1a1206;
    --danger: #c65b5b;
    --radius: 16px;
    --pad: 20px;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"] {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #efece5;
    --border: #e2ddd3;
    --text: #23211d;
    --text-dim: #6b675f;
    --text-faint: #9a958b;
    --accent: #b9762a;
    --accent-ink: #ffffff;
    --danger: #b34242;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  .app { max-width: 640px; margin: 0 auto; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px var(--pad); position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  header h1 {
    font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0;
    letter-spacing: 0.2px;
  }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; font-size: 17px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    transition: background .15s;
  }
  .icon-btn:active { background: var(--surface-2); }

  main { padding: 0 var(--pad); }
  .view { display: none; }
  .view.active { display: block; }

  /* Random card */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 30px 26px;
    margin-top: 8px;
  }
  .passage-text {
    font-family: var(--serif); font-size: 22px; line-height: 1.62;
    margin: 0 0 22px; white-space: pre-wrap; overflow-wrap: break-word;
  }
  .meta-book { font-family: var(--serif); font-size: 15px; color: var(--text-dim); font-style: italic; }
  .meta-author { font-size: 13.5px; color: var(--text-faint); margin-top: 2px; }
  .meta-note {
    font-size: 13px; color: var(--text-dim); margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--border); line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .card-tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px; color: var(--text-dim); background: var(--surface-2);
    border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px;
  }
  .card-fav { color: var(--accent); }

  .random-actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .btn {
    font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
    border-radius: 12px; padding: 13px 18px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); transition: filter .15s, background .15s;
  }
  .btn:active { filter: brightness(0.94); }
  .btn-accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn-accent.flex, .btn.flex { flex: 1; }
  .btn-ghost { background: transparent; }

  .scope-bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin: 4px 0 2px; font-size: 13px; color: var(--text-dim);
  }
  select, input[type="text"], input[type="search"], textarea {
    font-family: var(--sans); font-size: 15px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; width: 100%; outline: none;
  }
  select { -webkit-appearance: none; appearance: none; padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: right 16px center, right 11px center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .scope-select { width: auto; flex: 1; min-width: 140px; padding: 9px 34px 9px 12px; font-size: 13px; }
  .chip-toggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    padding: 9px 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .chip-toggle.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* Empty state */
  .empty {
    text-align: center; padding: 60px 24px; color: var(--text-dim);
  }
  .empty .big { font-size: 40px; margin-bottom: 12px; }
  .empty p { margin: 6px 0 20px; }

  /* Form */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 7px; font-weight: 500; }
  .field .opt { color: var(--text-faint); font-weight: 400; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .fav-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
  }
  .fav-row span { font-size: 15px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; transition: .2s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: var(--text-dim); border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent); border-color: transparent; }
  .switch input:checked + .slider::before { transform: translateX(20px); background: var(--accent-ink); }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }

  h2.view-title { font-family: var(--serif); font-size: 22px; margin: 10px 0 16px; font-weight: 600; }

  /* Library */
  .lib-search { margin-bottom: 12px; }
  .lib-count { font-size: 12.5px; color: var(--text-faint); margin: 0 2px 12px; }
  .item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 16px; margin-bottom: 12px;
  }
  .item-text {
    font-family: var(--serif); font-size: 16px; line-height: 1.5; margin: 0 0 8px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .item-meta { font-size: 12.5px; color: var(--text-faint); }
  .item-meta em { color: var(--text-dim); font-style: italic; }
  .item-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .item-actions { display: flex; gap: 8px; margin-top: 12px; }
  .mini-btn {
    font-size: 13px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); cursor: pointer;
  }
  .mini-btn.fav.on { color: var(--accent); border-color: var(--accent); }
  .mini-btn.del { color: var(--danger); }
  .mini-btn.del:active { background: color-mix(in srgb, var(--danger) 14%, transparent); }

  /* Data actions */
  .data-row { display: flex; gap: 10px; margin-top: 10px; }

  /* Bottom nav */
  nav.bottom {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-around;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button {
    flex: 1; background: none; border: none; color: var(--text-faint);
    font-family: var(--sans); font-size: 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
  }
  nav.bottom button .nav-icon { font-size: 20px; line-height: 1; }
  nav.bottom button.active { color: var(--accent); }

  .toast {
    position: fixed; bottom: calc(84px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(12px); opacity: 0;
    background: var(--text); color: var(--bg); font-size: 13.5px; font-weight: 500;
    padding: 10px 18px; border-radius: 999px; z-index: 50; pointer-events: none;
    transition: opacity .2s, transform .2s; white-space: nowrap; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 480px) {
    .passage-text { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Passage Roulette</h1>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>

  <main>
    <!-- RANDOM -->
    <section class="view active" id="view-random">
      <div class="scope-bar">
        <select class="scope-select" id="scopeTag" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
        <button class="chip-toggle" id="scopeFav">★ Favourites</button>
      </div>
      <div id="randomSlot"></div>
    </section>

    <!-- ADD / EDIT -->
    <section class="view" id="view-add">
      <h2 class="view-title" id="formTitle">Add passage</h2>
      <form id="passageForm" autocomplete="off">
        <input type="hidden" id="f-id">
        <div class="field">
          <label for="f-text">Passage</label>
          <textarea id="f-text" required placeholder="Type or paste the passage…"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label for="f-book">Book</label>
            <input type="text" id="f-book" placeholder="Title">
          </div>
          <div class="field">
            <label for="f-author">Author</label>
            <input type="text" id="f-author" placeholder="Author">
          </div>
        </div>
        <div class="field">
          <label for="f-note">Note <span class="opt">— optional</span></label>
          <textarea id="f-note" style="min-height:70px" placeholder="Why you saved it"></textarea>
        </div>
        <div class="field">
          <label for="f-tags">Tags <span class="opt">— optional, comma separated</span></label>
          <input type="text" id="f-tags" placeholder="grief, memory, opening lines">
        </div>
        <div class="fav-row">
          <span>Favourite</span>
          <label class="switch"><input type="checkbox" id="f-fav"><span class="slider"></span></label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-accent flex">Save</button>
          <button type="button" class="btn btn-ghost" id="cancelEdit" style="display:none">Cancel</button>
        </div>
      </form>
    </section>

    <!-- LIBRARY -->
    <section class="view" id="view-library">
      <h2 class="view-title">Library</h2>
      <div class="lib-search">
        <input type="search" id="libSearch" placeholder="Search text, book, author, tag…">
      </div>
      <p class="lib-count" id="libCount"></p>
      <div id="libList"></div>

      <div style="margin-top:26px; padding-top:20px; border-top:1px solid var(--border)">
        <label style="display:block; font-size:13px; color:var(--text-dim); margin-bottom:10px; font-weight:500">Backup</label>
        <div class="data-row">
          <button class="btn flex" id="exportBtn">Export JSON</button>
          <button class="btn flex" id="importBtn">Import JSON</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      </div>
    </section>
  </main>

  <nav class="bottom">
    <button data-nav="random" class="active"><span class="nav-icon">🎲</span>Random</button>
    <button data-nav="add"><span class="nav-icon">＋</span>Add</button>
    <button data-nav="library"><span class="nav-icon">📚</span>Library</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var STORE = "passageRoulette.v1";
  var THEME = "passageRoulette.theme";
  var passages = [];
  var lastRandomId = null;

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      passages = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(passages)) passages = [];
    } catch (e) { passages = []; }
    if (passages.length === 0) seed();
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(passages)); }
    catch (e) { toast("Could not save — storage full?"); }
  }
  function uid() {
    return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }
  function seed() {
    passages = [{
      id: uid(),
      text: "For a long time I used to go to bed early. Sometimes, when I had put out my candle, my eyes would close so quickly that I had not even time to say “I'm going to sleep.”",
      book: "Swann's Way",
      author: "Marcel Proust",
      note: "The whole book folded into a first breath.",
      tags: ["opening lines", "memory"],
      favorite: true,
      dateAdded: new Date().toISOString()
    }, {
      id: uid(),
      text: "The mass of men lead lives of quiet desperation. What is called resignation is confirmed desperation.",
      book: "Walden",
      author: "Henry David Thoreau",
      note: "",
      tags: ["solitude"],
      favorite: false,
      dateAdded: new Date().toISOString()
    }];
    save();
  }

  /* ---------- helpers ---------- */
  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  var toastTimer;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function allTags() {
    var set = {};
    passages.forEach(function (p) { (p.tags || []).forEach(function (t) { set[t] = true; }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
  }
  function byId(id) { return passages.filter(function (p) { return p.id === id; })[0]; }

  /* ---------- random ---------- */
  function scopedList() {
    var tag = $("#scopeTag").value;
    var favOnly = $("#scopeFav").classList.contains("on");
    return passages.filter(function (p) {
      if (favOnly && !p.favorite) return false;
      if (tag && (p.tags || []).indexOf(tag) === -1) return false;
      return true;
    });
  }
  function pickRandom() {
    var pool = scopedList();
    if (pool.length === 0) { renderRandom(null); return; }
    var choice;
    if (pool.length === 1) {
      choice = pool[0];
    } else {
      // avoid immediate repeat
      do { choice = pool[Math.floor(Math.random() * pool.length)]; }
      while (choice.id === lastRandomId);
    }
    lastRandomId = choice.id;
    renderRandom(choice);
  }
  function renderRandom(p) {
    var slot = $("#randomSlot");
    if (!p) {
      var favOnly = $("#scopeFav").classList.contains("on");
      var tag = $("#scopeTag").value;
      var msg = passages.length === 0
        ? "No passages yet."
        : "Nothing matches this filter" + (favOnly ? " in favourites" : "") + (tag ? " tagged “" + esc(tag) + "”" : "") + ".";
      slot.innerHTML =
        '<div class="empty"><div class="big">🎲</div><p>' + msg + '</p>' +
        '<button class="btn btn-accent" data-nav="add">Add a passage</button></div>';
      return;
    }
    var tagsHtml = (p.tags && p.tags.length)
      ? '<div class="card-tags">' + p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>'
      : "";
    var bookLine = p.book ? '<div class="meta-book">' + (p.favorite ? '<span class="card-fav">★</span> ' : '') + esc(p.book) + '</div>'
      : (p.favorite ? '<div class="meta-book"><span class="card-fav">★</span></div>' : '');
    var authorLine = p.author ? '<div class="meta-author">' + esc(p.author) + '</div>' : '';
    var noteHtml = p.note ? '<div class="meta-note">' + esc(p.note) + '</div>' : '';
    slot.innerHTML =
      '<div class="card">' +
        '<p class="passage-text">' + esc(p.text) + '</p>' +
        bookLine + authorLine + noteHtml + tagsHtml +
      '</div>' +
      '<div class="random-actions">' +
        '<button class="btn btn-accent flex" id="againBtn">Another</button>' +
        '<button class="btn btn-ghost" id="favToggleBtn" title="Favourite">' + (p.favorite ? "★ Favourited" : "☆ Favourite") + '</button>' +
      '</div>';
    $("#againBtn").addEventListener("click", pickRandom);
    $("#favToggleBtn").addEventListener("click", function () {
      p.favorite = !p.favorite;
      save();
      renderRandom(p);
      renderLibrary();
    });
  }

  /* ---------- scope controls ---------- */
  function refreshTagSelect() {
    var sel = $("#scopeTag");
    var current = sel.value;
    var tags = allTags();
    sel.innerHTML = '<option value="">All tags</option>' +
      tags.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join("");
    if (tags.indexOf(current) !== -1) sel.value = current;
  }

  /* ---------- form ---------- */
  function resetForm() {
    $("#passageForm").reset();
    $("#f-id").value = "";
    $("#formTitle").textContent = "Add passage";
    $("#cancelEdit").style.display = "none";
  }
  function editPassage(id) {
    var p = byId(id);
    if (!p) return;
    $("#f-id").value = p.id;
    $("#f-text").value = p.text || "";
    $("#f-book").value = p.book || "";
    $("#f-author").value = p.author || "";
    $("#f-note").value = p.note || "";
    $("#f-tags").value = (p.tags || []).join(", ");
    $("#f-fav").checked = !!p.favorite;
    $("#formTitle").textContent = "Edit passage";
    $("#cancelEdit").style.display = "";
    show("add");
    $("#f-text").focus();
  }
  function parseTags(str) {
    return String(str || "").split(",")
      .map(function (s) { return s.trim(); })
      .filter(function (s, i, a) { return s && a.indexOf(s) === i; });
  }
  function submitForm(e) {
    e.preventDefault();
    var text = $("#f-text").value.trim();
    if (!text) { toast("Passage text is required"); return; }
    var id = $("#f-id").value;
    var data = {
      text: text,
      book: $("#f-book").value.trim(),
      author: $("#f-author").value.trim(),
      note: $("#f-note").value.trim(),
      tags: parseTags($("#f-tags").value),
      favorite: $("#f-fav").checked
    };
    if (id) {
      var p = byId(id);
      if (p) { for (var k in data) p[k] = data[k]; }
      toast("Updated");
    } else {
      data.id = uid();
      data.dateAdded = new Date().toISOString();
      passages.unshift(data);
      toast("Saved");
    }
    save();
    resetForm();
    refreshTagSelect();
    renderLibrary();
    pickRandom();
    show("random");
  }

  /* ---------- library ---------- */
  function matches(p, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return (p.text || "").toLowerCase().indexOf(q) !== -1 ||
      (p.book || "").toLowerCase().indexOf(q) !== -1 ||
      (p.author || "").toLowerCase().indexOf(q) !== -1 ||
      (p.tags || []).join(" ").toLowerCase().indexOf(q) !== -1;
  }
  function renderLibrary() {
    var q = $("#libSearch").value.trim();
    var list = passages.filter(function (p) { return matches(p, q); });
    $("#libCount").textContent = list.length + (list.length === 1 ? " passage" : " passages") +
      (q ? " matching" : "");
    var box = $("#libList");
    if (passages.length === 0) {
      box.innerHTML = '<div class="empty"><div class="big">📚</div><p>Your library is empty.</p>' +
        '<button class="btn btn-accent" data-nav="add">Add your first passage</button></div>';
      return;
    }
    if (list.length === 0) {
      box.innerHTML = '<div class="empty"><p>No passages match “' + esc(q) + '”.</p></div>';
      return;
    }
    box.innerHTML = list.map(function (p) {
      var metaBits = [];
      if (p.book) metaBits.push('<em>' + esc(p.book) + '</em>');
      if (p.author) metaBits.push(esc(p.author));
      var meta = metaBits.length ? '<div class="item-meta">' + metaBits.join(" · ") + '</div>' : '';
      var tags = (p.tags && p.tags.length)
        ? '<div class="item-tags">' + p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>'
        : "";
      return '<div class="item" data-id="' + p.id + '">' +
        '<p class="item-text">' + esc(p.text) + '</p>' + meta + tags +
        '<div class="item-actions">' +
          '<button class="mini-btn fav ' + (p.favorite ? "on" : "") + '" data-act="fav">' + (p.favorite ? "★ Favourite" : "☆ Favourite") + '</button>' +
          '<button class="mini-btn" data-act="edit">Edit</button>' +
          '<button class="mini-btn del" data-act="del">Delete</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  /* ---------- export / import ---------- */
  function exportJSON() {
    var blob = new Blob([JSON.stringify(passages, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = "passages-" + d + ".json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("Exported " + passages.length + " passages");
  }
  function importJSON(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try { incoming = JSON.parse(reader.result); }
      catch (e) { toast("Invalid JSON file"); return; }
      if (!Array.isArray(incoming)) { toast("Expected a JSON array"); return; }
      var existing = {};
      passages.forEach(function (p) { existing[p.id] = true; });
      var added = 0;
      incoming.forEach(function (raw) {
        if (!raw || typeof raw.text !== "string" || !raw.text.trim()) return;
        var p = {
          id: (typeof raw.id === "string" && raw.id && !existing[raw.id]) ? raw.id : uid(),
          text: raw.text,
          book: typeof raw.book === "string" ? raw.book : "",
          author: typeof raw.author === "string" ? raw.author : "",
          note: typeof raw.note === "string" ? raw.note : "",
          tags: Array.isArray(raw.tags) ? raw.tags.filter(function (t) { return typeof t === "string"; }) : [],
          favorite: !!raw.favorite,
          dateAdded: typeof raw.dateAdded === "string" ? raw.dateAdded : new Date().toISOString()
        };
        existing[p.id] = true;
        passages.unshift(p);
        added++;
      });
      save();
      refreshTagSelect();
      renderLibrary();
      pickRandom();
      toast("Imported " + added + " passage" + (added === 1 ? "" : "s"));
    };
    reader.readAsText(file);
  }

  /* ---------- navigation ---------- */
  function show(name) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    var view = $("#view-" + name);
    if (view) view.classList.add("active");
    document.querySelectorAll("nav.bottom button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-nav") === name);
    });
    if (name === "library") renderLibrary();
    if (name === "add" && !$("#f-id").value) resetForm();
    window.scrollTo(0, 0);
  }

  /* ---------- theme ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("#themeBtn").textContent = t === "light" ? "☀" : "◐";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", t === "light" ? "#f6f4ef" : "#0f0f10");
  }
  function initTheme() {
    var saved = localStorage.getItem(THEME) || "dark";
    applyTheme(saved);
  }

  /* ---------- events ---------- */
  function wire() {
    // bottom nav + any data-nav button
    document.body.addEventListener("click", function (e) {
      var nav = e.target.closest("[data-nav]");
      if (nav) { show(nav.getAttribute("data-nav")); return; }
    });

    $("#scopeTag").addEventListener("change", pickRandom);
    $("#scopeFav").addEventListener("click", function () {
      this.classList.toggle("on");
      pickRandom();
    });

    $("#passageForm").addEventListener("submit", submitForm);
    $("#cancelEdit").addEventListener("click", function () { resetForm(); show("library"); });

    $("#libSearch").addEventListener("input", renderLibrary);
    $("#libList").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-act]");
      if (!btn) return;
      var item = e.target.closest(".item");
      var id = item && item.getAttribute("data-id");
      var p = byId(id);
      if (!p) return;
      var act = btn.getAttribute("data-act");
      if (act === "fav") {
        p.favorite = !p.favorite; save(); renderLibrary();
      } else if (act === "edit") {
        editPassage(id);
      } else if (act === "del") {
        if (confirm("Delete this passage?")) {
          passages = passages.filter(function (x) { return x.id !== id; });
          save(); refreshTagSelect(); renderLibrary();
          if (lastRandomId === id) { lastRandomId = null; pickRandom(); }
          toast("Deleted");
        }
      }
    });

    $("#exportBtn").addEventListener("click", exportJSON);
    $("#importBtn").addEventListener("click", function () { $("#importFile").click(); });
    $("#importFile").addEventListener("change", function () {
      if (this.files && this.files[0]) importJSON(this.files[0]);
      this.value = "";
    });

    $("#themeBtn").addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      localStorage.setItem(THEME, next);
      applyTheme(next);
    });
  }

  /* ---------- boot ---------- */
  initTheme();
  load();
  wire();
  refreshTagSelect();
  pickRandom();      // boots straight to a random passage
  renderLibrary();
})();
</script>
</body>
</html>
