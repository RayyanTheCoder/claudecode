<!--
  WARDROBE — single-file personal wardrobe app.
  No build step, no framework, no npm. Data lives in localStorage.
  Open this file in a browser; works fully offline.

  Session 1: data layer, CRUD, list view, outfit engine (structural +
  color + formality + season + silhouette rules), unlock counter, browser.
  Session 2: gap analysis, wishlist, outfit of the day, occasion filter,
  manual outfit builder.
  Session 3: weather-aware suggestions (Open-Meteo), outfit rating +
  suggestion weighting, packing mode, JSON export/import, full stats.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wardrobe</title>

<style>
  /* ---------- design tokens ---------- */
  :root {
    --bg:        #0b0c0e;
    --bg-raise:  #14161b;
    --bg-raise2: #191c22;
    --border:    #262a31;
    --border-2:  #333843;
    --text:      #e7e9ee;
    --muted:     #8b909b;
    --muted-2:   #6b7077;
    --accent:    #7c8dff;
    --accent-ink:#0b0c0e;
    --good:      #4ec98a;
    --warn:      #e6b84b;
    --bad:       #e07a6b;
    --radius:    14px;
    --tap:       44px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
            "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- layout shell ---------- */
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .sidebar { display: none; }
  main {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 16px calc(84px + env(safe-area-inset-bottom));
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 14px 16px calc(14px);
    background: linear-gradient(var(--bg), rgba(11,12,14,.85));
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }

  /* bottom tabs (phone) */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: rgba(16,18,22,.92);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    appearance: none; background: none; border: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 8px; color: var(--muted-2);
    font-size: 11px; cursor: pointer; min-height: var(--tap);
    transition: color .15s ease;
  }
  .tab .ico { font-size: 19px; line-height: 1; }
  .tab.active { color: var(--text); }
  .tab.active .ico { filter: drop-shadow(0 0 8px rgba(124,141,255,.5)); }

  /* ---------- generic components ---------- */
  .card {
    background: var(--bg-raise);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .tiny { font-size: 11.5px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    appearance: none; cursor: pointer;
    background: var(--bg-raise2); color: var(--text);
    border: 1px solid var(--border-2); border-radius: 10px;
    padding: 9px 13px; min-height: var(--tap);
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .15s ease, border-color .15s ease, transform .05s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:hover { border-color: var(--muted-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn.danger { color: var(--bad); border-color: #4a2b28; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 12.5px; color: var(--muted); }
  .field .req { color: var(--accent); }
  input[type=text], input[type=number], select, textarea {
    background: var(--bg); border: 1px solid var(--border-2);
    border-radius: 10px; padding: 11px 12px; min-height: var(--tap);
    width: 100%; outline: none;
    transition: border-color .15s ease;
  }
  textarea { min-height: 74px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  .invalid { border-color: var(--bad) !important; }
  .err { color: var(--bad); font-size: 12px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg-raise2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted);
  }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .chip.tag { cursor: default; }

  .swatch { width: 14px; height: 14px; border-radius: 5px; border: 1px solid rgba(255,255,255,.18); flex: none; }
  .fam-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- garment grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .g-card { overflow: hidden; display: flex; gap: 12px; padding: 10px; align-items: center; }
  .g-thumb {
    width: 64px; height: 64px; border-radius: 10px; flex: none;
    background: var(--bg-raise2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--muted-2); overflow: hidden;
  }
  .g-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .g-meta { min-width: 0; flex: 1; }
  .g-name { font-weight: 600; }
  .g-actions { display: flex; gap: 6px; flex: none; }

  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--bg-raise2); border: 1px solid var(--border); color: var(--muted); }
  .badge.warn { color: var(--warn); border-color: #4a3f22; }

  /* ---------- outfit cards ---------- */
  .o-card { padding: 12px; }
  .o-items { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
  .o-item { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 5px 9px 5px 5px; }
  .o-item .mini { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-raise2); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .o-item .mini img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- unlock banner ---------- */
  .unlock {
    border: 1px solid var(--accent); border-radius: var(--radius);
    background: linear-gradient(160deg, rgba(124,141,255,.16), rgba(124,141,255,.04));
    padding: 16px; margin-bottom: 16px;
  }
  .unlock .big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .unlock .big.pos { color: var(--accent); }

  /* ---------- stats ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  .stat .l { color: var(--muted); font-size: 12.5px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty .ico { font-size: 40px; opacity: .5; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input { min-height: 40px; width: auto; }
  .search { flex: 1; min-width: 160px; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; }

  .banner { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .banner.warn { background: rgba(230,184,75,.1); border: 1px solid #4a3f22; color: var(--warn); }
  .banner.bad  { background: rgba(224,122,107,.1); border: 1px solid #4a2b28; color: var(--bad); }

  .sectitle { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted-2); margin: 4px 0 2px; }

  /* ---------- desktop ---------- */
  @media (min-width: 860px) {
    .app { flex-direction: row; }
    .tabs { display: none; }
    .sidebar {
      display: flex; flex-direction: column; gap: 4px;
      width: 210px; flex: none; padding: 20px 12px;
      border-right: 1px solid var(--border);
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar .brand { font-size: 17px; font-weight: 700; padding: 6px 12px 16px; }
    .side-tab {
      appearance: none; background: none; border: 0; text-align: left;
      color: var(--muted); padding: 10px 12px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; font-size: 14px;
    }
    .side-tab .ico { font-size: 17px; }
    .side-tab:hover { background: var(--bg-raise); color: var(--text); }
    .side-tab.active { background: var(--bg-raise2); color: var(--text); }
    main { padding: 8px 28px 40px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1180px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  /* ---------- segmented control ---------- */
  .seg { display: inline-flex; background: var(--bg-raise); border: 1px solid var(--border); border-radius: 11px; padding: 3px; margin-bottom: 16px; gap: 2px; }
  .seg-btn { appearance: none; background: none; border: 0; color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; min-height: 36px; }
  .seg-btn.on { background: var(--bg-raise2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }

  /* ---------- occasion chips (interactive) ---------- */
  .chip.btn-chip { cursor: pointer; }
  .chip.btn-chip:hover { border-color: var(--muted-2); color: var(--text); }

  /* ---------- outfit of the day ---------- */
  .ootd {
    border: 1px solid var(--border-2); border-radius: var(--radius);
    background: linear-gradient(160deg, rgba(124,141,255,.12), rgba(20,22,27,.4));
    padding: 16px; margin-bottom: 18px;
  }
  .ootd .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); font-weight: 600; }

  /* ---------- gap analysis ---------- */
  .gap-row { padding: 14px; }
  .gap-delta { font-size: 22px; font-weight: 700; letter-spacing: -.5px; color: var(--accent); flex: none; min-width: 66px; text-align: right; }
  .gap-delta.zero { color: var(--muted-2); }
  .gap-bar { height: 5px; border-radius: 3px; background: var(--bg-raise2); overflow: hidden; margin-top: 8px; }
  .gap-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  /* ---------- manual builder ---------- */
  .build-cat { margin-bottom: 14px; }
  .build-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .pick {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--bg-raise); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px 11px 6px 6px; font-size: 13px; transition: border-color .12s ease, background .12s ease;
  }
  .pick .mini { width: 26px; height: 26px; border-radius: 6px; background: var(--bg-raise2); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .pick .mini img { width: 100%; height: 100%; object-fit: cover; }
  .pick.on { border-color: var(--accent); background: rgba(124,141,255,.12); }
  .validity { padding: 12px 14px; border-radius: 11px; margin: 4px 0 14px; font-size: 13px; }
  .validity.ok { background: rgba(78,201,138,.1); border: 1px solid #23402f; color: var(--good); }
  .validity.bad { background: rgba(230,184,75,.09); border: 1px solid #4a3f22; color: var(--warn); }

  /* ---------- rating stars ---------- */
  .stars { display: inline-flex; gap: 1px; margin-left: 2px; }
  .star { cursor: pointer; color: var(--muted-2); font-size: 18px; line-height: 1; padding: 2px; transition: color .1s ease; }
  .star.on { color: var(--warn); }
  .star:hover { color: var(--warn); }
</style>

<script>
/* ============================================================================
   CONFIG  —  edit these to tune the outfit engine. Nothing below hardcodes rules.
   ============================================================================ */
const rules = {
  maxAccentItems: 1,
  formalitySpread: 2,
  requireDarkAnchor: true,
  blockedPairs: [["brown", "navy"]],
  relaxedBottomBlockedShoes: ["lowProfile"],
  maxLayers: 2,          // combined mid + outer layers
  maxOuter: 1,           // outermost shells
  seasonCompatibility: {
    hot:  ["hot", "mild", "all"],
    mild: ["hot", "mild", "cold", "all"],
    cold: ["mild", "cold", "all"],
    all:  ["hot", "mild", "cold", "all"],
  },
};

/*
  Gap-analysis candidates — hypothetical garments to score against your current
  wardrobe. Each is a full garment spec; the engine reports how many new outfits
  each would unlock. Edit this list freely.
*/
const gapCandidates = [
  { name: "Navy quarter-zip",      category: "mid",    subcategory: "quarter-zip", color: "navy",  colorFamily: "neutralDark",  formality: 3, season: "mild", fit: "slim",    weight: "medium", cost: 80 },
  { name: "White oxford shirt",    category: "mid",    subcategory: "shirt",       color: "white", colorFamily: "neutralLight", formality: 4, season: "all",  fit: "slim",    weight: "light",  cost: 70 },
  { name: "Brown tee",             category: "base",   subcategory: "tee",         color: "brown", colorFamily: "warmNeutral",  formality: 2, season: "hot",  fit: "slim",    weight: "light",  cost: 25 },
  { name: "Ecru crewneck sweat",   category: "mid",    subcategory: "sweatshirt",  color: "ecru",  colorFamily: "warmNeutral",  formality: 2, season: "mild", fit: "relaxed", weight: "medium", cost: 60 },
  { name: "Black slim jeans",      category: "bottom", subcategory: "jeans",       color: "black", colorFamily: "neutralDark",  formality: 3, season: "all",  fit: "slim",    weight: "medium", cost: 90 },
  { name: "Tan chukka boots",      category: "shoe",   subcategory: "boot",        color: "tan",   colorFamily: "warmNeutral",  formality: 4, season: "all",  fit: "slim",    weight: "medium", cost: 150, visualWeight: "substantial" },
  { name: "Grey wool overcoat",    category: "outer",  subcategory: "coat",        color: "grey",  colorFamily: "neutralDark",  formality: 4, season: "cold", fit: "slim",    weight: "heavy",  cost: 280 },
  { name: "Olive cargos",          category: "bottom", subcategory: "cargos",      color: "olive", colorFamily: "warmNeutral",  formality: 2, season: "mild", fit: "relaxed", weight: "medium", cost: 75 },
];

/*
  Occasion rules — predicates over an outfit's items. Used to filter the outfit
  browser by intent. Heuristic and editable; occasions can overlap.
*/
const occasionRules = {
  campus:   items => { const f = items.map(i => i.formality); return Math.min(...f) >= 2 && Math.max(...f) <= 4; },
  goingOut: items => Math.max(...items.map(i => i.formality)) >= 3 && !items.some(i => /sweatpant/i.test(i.subcategory)),
  gym:      items => Math.max(...items.map(i => i.formality)) <= 2,
  lazy:     items => Math.max(...items.map(i => i.formality)) <= 2 && items.some(i => i.fit === "relaxed"),
};

// Ordering & display maps
const WEIGHT_VAL   = { light: 1, medium: 2, heavy: 3 };
const TIER         = { base: 0, mid: 1, outer: 2 };           // layer stack order
const CATEGORIES   = ["base", "mid", "outer", "bottom", "shoe"];
const CATEGORY_LBL = { base: "Base layer", mid: "Mid layer", outer: "Outer", bottom: "Bottom", shoe: "Shoe" };
const CATEGORY_ICO = { base: "👕", mid: "🧥", outer: "🧥", bottom: "👖", shoe: "👟" };
const COLOR_FAMILIES = ["neutralDark", "neutralLight", "warmNeutral", "accent"];
const FAMILY_LBL   = { neutralDark: "Neutral dark", neutralLight: "Neutral light", warmNeutral: "Warm neutral", accent: "Accent" };
const FAMILY_HEX   = { neutralDark: "#2b2f36", neutralLight: "#d7d9dd", warmNeutral: "#8a7a63", accent: "#7c8dff" };
const SEASONS      = ["hot", "mild", "cold", "all"];
const FITS         = ["slim", "relaxed"];
const WEIGHTS      = ["light", "medium", "heavy"];
const VISUAL_WEIGHTS = ["lowProfile", "standard", "substantial"];
const OCCASIONS    = ["campus", "goingOut", "gym", "lazy"];
const OCCASION_LBL = { campus: "Campus", goingOut: "Going out", gym: "Gym", lazy: "Lazy" };

const STORAGE_KEY = "wardrobe.v1";
const MAX_EVAL = 300000;   // safety cap on combinations evaluated per run
const STALE_DAYS = 60;     // "not worn in N days" flag
const OOTD_AVOID_DAYS = 14; // downweight outfits worn within this many days

// Weather (Open-Meteo, no API key). Temperature °C → season bucket. Editable.
const OPEN_METEO_URL = "https://api.open-meteo.com/v1/forecast";
const weatherBuckets = { coldBelow: 12, hotAbove: 20 }; // cold < 12 ≤ mild ≤ 20 < hot
function tempToSeason(t) {
  if (t < weatherBuckets.coldBelow) return "cold";
  if (t > weatherBuckets.hotAbove) return "hot";
  return "mild";
}

/* ============================================================================
   DATA LAYER
   ============================================================================ */
let state = { garments: [], outfits: [], wishlist: [], ratings: {} };

function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.garments = Array.isArray(parsed.garments) ? parsed.garments : [];
      state.outfits  = Array.isArray(parsed.outfits) ? parsed.outfits : [];
      state.wishlist = Array.isArray(parsed.wishlist) ? parsed.wishlist : [];
      state.ratings  = (parsed.ratings && typeof parsed.ratings === "object") ? parsed.ratings : {};
    }
  } catch (e) {
    console.error("load failed", e);
    state = { garments: [], outfits: [], wishlist: [], ratings: {} };
  }
}
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    alert("Could not save — storage may be full (photos are large). " + e.message);
  }
}

function getGarments() { return state.garments; }
function getGarment(id) { return state.garments.find(g => g.id === id) || null; }

function normalizeGarment(g) {
  return {
    id: g.id || uid(),
    name: (g.name || "").trim(),
    category: g.category,
    subcategory: (g.subcategory || "").trim(),
    color: (g.color || "").trim(),
    colorFamily: g.colorFamily || "neutralDark",
    formality: clampInt(g.formality, 1, 5, 3),
    season: g.season || "all",
    fit: g.fit || "slim",
    weight: g.weight || "medium",
    visualWeight: g.category === "shoe" ? (g.visualWeight || "standard") : null,
    cost: Number(g.cost) || 0,
    timesWorn: clampInt(g.timesWorn, 0, 1e9, 0),
    lastWorn: g.lastWorn || null,
    dateAdded: g.dateAdded || todayISO(),
    imageData: g.imageData || null,
    rating: g.rating ? clampInt(g.rating, 1, 5, null) : null,
    notes: (g.notes || "").trim(),
  };
}
function clampInt(v, lo, hi, dflt) {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return dflt;
  return Math.min(hi, Math.max(lo, n));
}

function addGarment(data) {
  const g = normalizeGarment(data);
  state.garments.push(g);
  saveToStorage();
  return g;
}
function updateGarment(id, data) {
  const i = state.garments.findIndex(g => g.id === id);
  if (i < 0) return null;
  state.garments[i] = normalizeGarment({ ...state.garments[i], ...data, id });
  saveToStorage();
  return state.garments[i];
}
function deleteGarment(id) {
  state.garments = state.garments.filter(g => g.id !== id);
  // drop saved outfits that referenced it
  state.outfits = state.outfits.filter(o => !o.garmentIds.includes(id));
  saveToStorage();
}

// wear tracking — increments every item in an outfit
function wearOutfit(items) {
  const stamp = todayISO();
  items.forEach(it => {
    const g = getGarment(it.id);
    if (g) { g.timesWorn += 1; g.lastWorn = stamp; }
  });
  saveToStorage();
}

// --- wishlist (hypothetical garments the user is considering buying) ---
function getWishlist() { return state.wishlist; }
function addWishlist(data) {
  const w = normalizeGarment(data);
  w.isWishlist = true;
  state.wishlist.push(w);
  saveToStorage();
  return w;
}
function deleteWishlist(id) {
  state.wishlist = state.wishlist.filter(w => w.id !== id);
  saveToStorage();
}
// one-tap: move a wishlist item into the real wardrobe as a fresh garment
function convertWishlist(id) {
  const w = state.wishlist.find(x => x.id === id);
  if (!w) return null;
  const { id: _id, isWishlist, timesWorn, lastWorn, dateAdded, ...spec } = w;
  const g = addGarment({ ...spec });
  deleteWishlist(id);
  return g;
}

// --- saved outfits ---
function saveOutfitRecord({ garmentIds, name = null, occasion = null, isManual = false }) {
  if (state.outfits.some(o => sameSet(o.garmentIds, garmentIds))) return null;
  const rec = { id: uid(), garmentIds, name, occasion, rating: null, timesWorn: 0, lastWorn: null, isManual };
  state.outfits.push(rec);
  saveToStorage();
  return rec;
}
function deleteOutfitRecord(id) {
  state.outfits = state.outfits.filter(o => o.id !== id);
  saveToStorage();
}
function sameSet(a, b) { return a.length === b.length && [...a].sort().join() === [...b].sort().join(); }

// --- outfit ratings (feed back into suggestion weighting) ---
// Ratings are keyed by the sorted garment-id set, so a combo stays rated
// whether it was surfaced by the browser or saved manually.
function outfitKey(ids) { return [...ids].sort().join(","); }
function getOutfitRating(ids) { return state.ratings[outfitKey(ids)] || null; }
function rateOutfit(ids, rating) {
  const key = outfitKey(ids);
  if (rating) state.ratings[key] = rating; else delete state.ratings[key];
  const rec = state.outfits.find(o => sameSet(o.garmentIds, ids)); // mirror onto a saved record
  if (rec) rec.rating = rating || null;
  saveToStorage();
  rebuildRatingContext();
}

// Derived weighting context, recomputed whenever ratings change:
//   exact — rating for a whole combo
//   pair  — average (rating-3) across every rated combo a garment pair appears in
let ratingContext = { exact: {}, pair: new Map() };
function rebuildRatingContext() {
  const exact = {};
  const sum = new Map(), cnt = new Map();
  for (const [key, rating] of Object.entries(state.ratings)) {
    exact[key] = rating;
    const ids = key.split(",");
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const pk = ids[i] < ids[j] ? ids[i] + "|" + ids[j] : ids[j] + "|" + ids[i];
      sum.set(pk, (sum.get(pk) || 0) + (rating - 3));
      cnt.set(pk, (cnt.get(pk) || 0) + 1);
    }
  }
  const pair = new Map();
  for (const pk of sum.keys()) pair.set(pk, sum.get(pk) / cnt.get(pk));
  ratingContext = { exact, pair };
}

/* ============================================================================
   OUTFIT ENGINE  —  validity, generation, unlock counting
   ============================================================================ */

// Validity: returns { valid, reasons[] }. Single source of truth for every rule.
function isValidOutfit(items) {
  const reasons = [];
  const byCat = { base: [], mid: [], outer: [], bottom: [], shoe: [] };
  for (const it of items) if (byCat[it.category]) byCat[it.category].push(it);

  /* --- structural --- */
  if (byCat.bottom.length !== 1) reasons.push("Needs exactly one bottom");
  if (byCat.shoe.length !== 1)   reasons.push("Needs exactly one shoe");
  if (byCat.base.length > 1)     reasons.push("At most one base layer");
  if (byCat.outer.length > rules.maxOuter) reasons.push(`At most ${rules.maxOuter} outer layer`);
  if (byCat.mid.length + byCat.outer.length > rules.maxLayers) reasons.push(`At most ${rules.maxLayers} mid/outer layers`);
  // must have a base, OR a mid worn alone
  if (byCat.base.length === 0 && byCat.mid.length === 0) reasons.push("Needs a base layer or a mid worn alone");

  /* --- weight order: lighter layers sit under heavier ones --- */
  const layers = items.filter(i => i.category in TIER);
  for (let a = 0; a < layers.length; a++) {
    for (let b = 0; b < layers.length; b++) {
      if (TIER[layers[a].category] < TIER[layers[b].category]) {
        if (wv(layers[a]) > wv(layers[b])) {
          reasons.push("Heavier layer worn under a lighter one");
          a = b = layers.length; // break out
        }
      }
    }
  }

  /* --- color --- */
  const accents = items.filter(i => i.colorFamily === "accent").length;
  if (accents > rules.maxAccentItems) reasons.push("Too many accent colors");

  if (rules.requireDarkAnchor && items.length && items.every(i => i.colorFamily === "neutralLight"))
    reasons.push("Needs a darker anchor (all items are light)");

  for (const [c1, c2] of rules.blockedPairs) {
    const has1 = items.some(i => (i.color || "").toLowerCase() === c1.toLowerCase());
    const has2 = items.some(i => (i.color || "").toLowerCase() === c2.toLowerCase());
    if (has1 && has2) reasons.push(`${c1} + ${c2} — requires intent`);
  }

  /* --- formality: all within spread --- */
  if (items.length) {
    const fs = items.map(i => i.formality);
    if (Math.max(...fs) - Math.min(...fs) > rules.formalitySpread) reasons.push("Formality mismatch");
  }

  /* --- season: every pair compatible --- */
  outer:
  for (let a = 0; a < items.length; a++) {
    for (let b = a + 1; b < items.length; b++) {
      const compat = rules.seasonCompatibility[items[a].season] || [];
      if (!compat.includes(items[b].season)) { reasons.push("Season clash (hot + cold)"); break outer; }
    }
  }

  /* --- silhouette: relaxed bottom rejects blocked shoe profiles --- */
  const bottom = byCat.bottom[0], shoe = byCat.shoe[0];
  if (bottom && shoe && bottom.fit === "relaxed" &&
      rules.relaxedBottomBlockedShoes.includes(shoe.visualWeight)) {
    reasons.push("Relaxed bottom needs a more substantial shoe");
  }

  return { valid: reasons.length === 0, reasons };
}
function wv(item) { return WEIGHT_VAL[item.weight] || 2; }

// combinations of `arr` of size 0..k
function subsetsUpTo(arr, k) {
  const res = [[]];
  const rec = (start, chosen) => {
    if (chosen.length === k) return;
    for (let i = start; i < arr.length; i++) {
      const next = chosen.concat(arr[i]);
      res.push(next);
      rec(i + 1, next);
    }
  };
  rec(0, []);
  return res;
}

// enumerate structurally-plausible torso stacks (validity re-checked later)
function buildTorsos(byCat) {
  const torsos = [];
  const baseOpts = [null, ...byCat.base];
  const outerOpts = [null, ...byCat.outer];
  for (const base of baseOpts) {
    for (const outer of outerOpts) {
      const midBudget = rules.maxLayers - (outer ? 1 : 0);
      for (const midSet of subsetsUpTo(byCat.mid, midBudget)) {
        if (!base && midSet.length === 0) continue; // need base or a mid worn alone
        const torso = [];
        if (base) torso.push(base);
        torso.push(...midSet);
        if (outer) torso.push(outer);
        torsos.push(torso);
      }
    }
  }
  return torsos;
}

function groupByCategory(garments) {
  const byCat = { base: [], mid: [], outer: [], bottom: [], shoe: [] };
  for (const g of garments) if (byCat[g.category]) byCat[g.category].push(g);
  return byCat;
}

/*
  Core generator. Always counts every valid outfit (bounded by MAX_EVAL);
  stores the first `store` outfit objects for display. Optionally restrict
  to outfits containing `requireId`.
  Returns { outfits:[{garmentIds, items}], count, capped }.
*/
function generateOutfits(garments, opts = {}) {
  const { store = Infinity, requireId = null } = opts;
  const byCat = groupByCategory(garments);
  const torsos = buildTorsos(byCat);
  const outfits = [];
  let count = 0, evals = 0, capped = false;

  loops:
  for (const bottom of byCat.bottom) {
    for (const shoe of byCat.shoe) {
      for (const torso of torsos) {
        if (++evals > MAX_EVAL) { capped = true; break loops; }
        const items = [bottom, shoe, ...torso];
        if (!isValidOutfit(items).valid) continue;
        if (requireId && !items.some(i => i.id === requireId)) continue;
        count++;
        if (outfits.length < store) outfits.push({ garmentIds: items.map(i => i.id), items });
      }
    }
  }
  return { outfits, count, capped };
}

// aesthetic heuristic used to surface "best" combos (and later OOTD)
function scoreOutfit(items) {
  let s = 0;
  const fs = items.map(i => i.formality);
  s += (rules.formalitySpread - (Math.max(...fs) - Math.min(...fs))); // tighter = higher
  if (items.some(i => i.colorFamily === "neutralDark" || i.colorFamily === "warmNeutral")) s += 1;
  const accents = items.filter(i => i.colorFamily === "accent").length;
  s += accents === 1 ? 0.5 : 0;                    // one pop of color is good
  const rated = items.filter(i => i.rating);
  if (rated.length) s += (rated.reduce((a, i) => a + i.rating, 0) / rated.length) / 5;
  const torso = items.filter(i => i.category in TIER).length;
  if (torso === 2) s += 0.4;                        // a little layering reads intentional

  // outfit-rating feedback: rated combos and their component pairings rise
  const ids = items.map(i => i.id);
  const key = [...ids].sort().join(",");
  if (ratingContext.exact[key] != null) s += (ratingContext.exact[key] - 3) * 0.5;
  if (ratingContext.pair.size) {
    let pa = 0;
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const pk = ids[i] < ids[j] ? ids[i] + "|" + ids[j] : ids[j] + "|" + ids[i];
      const v = ratingContext.pair.get(pk); if (v != null) pa += v;
    }
    s += Math.max(-1.5, Math.min(1.5, pa * 0.15));
  }
  return s;
}

// Unlock counter: outfits before vs after adding `garment`.
function calculateUnlock(existingGarments, garment) {
  const before = generateOutfits(existingGarments, { store: 0 });
  const withNew = existingGarments.concat(garment);
  const after = generateOutfits(withNew, { store: 0 });
  const created = generateOutfits(withNew, { store: 60, requireId: garment.id });
  const best = created.outfits
    .map(o => ({ o, s: scoreOutfit(o.items) }))
    .sort((a, b) => b.s - a.s)
    .slice(0, 5)
    .map(x => x.o);
  return {
    before: before.count,
    after: after.count,
    delta: after.count - before.count,
    capped: before.capped || after.capped,
    best,
  };
}

/*
  Gap analysis: score each hypothetical garment by how many new outfits it
  unlocks against the current wardrobe. `before` is computed once and reused.
  Returns rows sorted by unlock delta, richest first.
*/
function analyzeGaps(garments, candidates) {
  const before = generateOutfits(garments, { store: 0 });
  return candidates.map(c => {
    const draft = normalizeGarment(c);
    const withNew = garments.concat(draft);
    const after = generateOutfits(withNew, { store: 0 });
    const created = generateOutfits(withNew, { store: 24, requireId: draft.id });
    const best = created.outfits
      .map(o => ({ o, s: scoreOutfit(o.items) }))
      .sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.o);
    const delta = after.count - before.count;
    return {
      spec: c,
      draft,
      delta,
      capped: before.capped || after.capped,
      costPerUnlock: (c.cost > 0 && delta > 0) ? c.cost / delta : null,
      best,
    };
  }).sort((a, b) => b.delta - a.delta);
}

/*
  Outfit of the day: weighted random pick from a pool of valid outfits.
  Weight = aesthetic score, heavily reduced for outfits whose items were worn
  within OOTD_AVOID_DAYS. `excludeKey` skips the current pick on reshuffle.
*/
function pickOOTD(pool, excludeKey) {
  const cands = pool.filter(o => o.garmentIds.join() !== excludeKey);
  if (!cands.length) return pool[0] || null;
  const weighted = cands.map(o => {
    let w = Math.max(0.15, scoreOutfit(o.items));
    const recent = o.items.some(i => { const d = daysSince(i.lastWorn); return d != null && d < OOTD_AVOID_DAYS; });
    if (recent) w *= 0.15;
    return { o, w };
  });
  const total = weighted.reduce((a, x) => a + x.w, 0);
  let r = Math.random() * total;
  for (const x of weighted) { r -= x.w; if (r <= 0) return x.o; }
  return weighted[weighted.length - 1].o;
}

// An outfit suits a season if every item is season-compatible with it.
function outfitSuitsSeason(items, s) {
  return items.every(i => (rules.seasonCompatibility[i.season] || []).includes(s));
}

/*
  Packing mode: cover `days` distinct outfits (matching the chosen occasions)
  with as few garments as possible. Greedy — each step adds the outfit that
  introduces the fewest new garments, tie-broken by aesthetic score (the pool
  is pre-sorted, so the first minimum wins). Returns the capsule + day outfits.
*/
function planPacking(garments, days, occasions) {
  const { outfits } = generateOutfits(garments, { store: OUTFIT_STORE });
  let pool = outfits;
  if (occasions.length) {
    pool = pool.filter(o => occasions.some(occ => { try { return occasionRules[occ](o.items); } catch (e) { return false; } }));
  }
  pool = pool.map(o => ({ o, s: scoreOutfit(o.items) })).sort((a, b) => b.s - a.s).map(x => x.o);
  if (!pool.length) return { chosen: [], capsule: [], pool: 0, shortfall: days };

  const chosen = [], capsule = new Set(), used = new Set();
  while (chosen.length < days) {
    let best = null, bestCost = Infinity, bestIdx = -1;
    for (let i = 0; i < pool.length; i++) {
      if (used.has(i)) continue;
      let cost = 0;
      for (const id of pool[i].garmentIds) if (!capsule.has(id)) cost++;
      if (cost < bestCost) { bestCost = cost; best = pool[i]; bestIdx = i; if (cost === 0) break; }
    }
    if (!best) break; // pool exhausted before reaching `days`
    used.add(bestIdx);
    chosen.push(best);
    best.garmentIds.forEach(id => capsule.add(id));
  }
  const capsuleItems = [...capsule].map(getGarment).filter(Boolean);
  return { chosen, capsule: capsuleItems, pool: pool.length, shortfall: Math.max(0, days - chosen.length) };
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function money(n) { return "$" + (Number(n) || 0).toFixed(0); }
function cpw(g) {
  if (!g.timesWorn) return null;
  return g.cost / g.timesWorn;
}
function daysSince(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function swatchStyle(color) {
  // trust the free-text color as a CSS value; invalid strings render transparent
  const c = (color || "").trim();
  return c ? `background:${esc(c)};` : "background:transparent;";
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll("[data-nav]").forEach(el => el.classList.toggle("active", el.dataset.nav === tab));
  if (tab !== "add") { editingId = null; }
  render();
}

function render() {
  topActions.innerHTML = "";
  if (currentTab === "wardrobe") renderWardrobe();
  else if (currentTab === "outfits") renderOutfits();
  else if (currentTab === "add") renderForm();
  else if (currentTab === "plan") renderPlan();
  else if (currentTab === "stats") renderStats();
  window.scrollTo(0, 0);
}

/* ---------- Wardrobe (list view) ---------- */
function renderWardrobe() {
  viewTitle.textContent = "Wardrobe";
  const g = getGarments();
  viewSub.textContent = g.length ? `${g.length} item${g.length === 1 ? "" : "s"}` : "";

  if (!g.length) {
    view.innerHTML = emptyState("👕", "No garments yet",
      "Add your first piece, or load a sample wardrobe to see the outfit engine at work.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>
       <button class="btn" onclick="loadSample()">Load sample wardrobe</button>`);
    return;
  }

  const cats = ["all", ...CATEGORIES];
  const seasons = ["all", ...SEASONS.filter(s => s !== "all")];
  const sorts = [
    ["dateAdded", "Newest"], ["cost", "Cost"], ["timesWorn", "Most worn"], ["cpw", "Cost / wear"],
  ];

  const toolbar = `
    <div class="toolbar">
      <input class="search" id="f-search" type="text" placeholder="Search by name…" value="${esc(filters.search)}" />
      <select id="f-category">${cats.map(c => opt(c, c === "all" ? "All categories" : CATEGORY_LBL[c], filters.category)).join("")}</select>
      <select id="f-season">${seasons.map(s => opt(s, s === "all" ? "All seasons" : cap(s), filters.season)).join("")}</select>
      <select id="f-sort">${sorts.map(([v, l]) => opt(v, l, filters.sort)).join("")}</select>
    </div>`;

  let list = g.slice();
  if (filters.category !== "all") list = list.filter(x => x.category === filters.category);
  if (filters.season !== "all") list = list.filter(x => x.season === filters.season || x.season === "all");
  if (filters.search.trim()) {
    const q = filters.search.trim().toLowerCase();
    list = list.filter(x => (x.name + " " + x.subcategory + " " + x.color).toLowerCase().includes(q));
  }
  list.sort((a, b) => {
    switch (filters.sort) {
      case "cost": return b.cost - a.cost;
      case "timesWorn": return b.timesWorn - a.timesWorn;
      case "cpw": return (cpw(b) ?? Infinity) - (cpw(a) ?? Infinity) === 0 ? 0 : (cpw(b) ?? 1e12) - (cpw(a) ?? 1e12);
      default: return (b.dateAdded || "").localeCompare(a.dateAdded || "") || b.id.localeCompare(a.id);
    }
  });

  const cards = list.map(garmentCard).join("");
  view.innerHTML = toolbar + (list.length
    ? `<div class="grid">${cards}</div>`
    : `<div class="empty muted">No garments match those filters.</div>`);

  document.getElementById("f-search").oninput = e => { filters.search = e.target.value; renderWardrobe(); scrollKeep(); };
  document.getElementById("f-category").onchange = e => { filters.category = e.target.value; renderWardrobe(); };
  document.getElementById("f-season").onchange = e => { filters.season = e.target.value; renderWardrobe(); };
  document.getElementById("f-sort").onchange = e => { filters.sort = e.target.value; renderWardrobe(); };
}
let _scroll = 0;
function scrollKeep() { /* keep focus in search box after re-render */
  const s = document.getElementById("f-search"); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

function garmentCard(g) {
  const worn = g.timesWorn ? `${g.timesWorn}× worn` : "Never worn";
  const perWear = cpw(g);
  const stale = daysSince(g.lastWorn);
  const staleBadge = (g.timesWorn && stale != null && stale >= STALE_DAYS)
    ? `<span class="badge warn" title="Not worn in ${stale} days">💤 ${stale}d</span>` : "";
  const thumb = g.imageData
    ? `<img src="${g.imageData}" alt="" />`
    : `<span>${CATEGORY_ICO[g.category] || "👚"}</span>`;
  return `
    <div class="card g-card">
      <div class="g-thumb">${thumb}</div>
      <div class="g-meta">
        <div class="g-name truncate">${esc(g.name)}</div>
        <div class="row small muted" style="gap:7px; margin:2px 0 5px;">
          <span class="swatch" style="${swatchStyle(g.color)}"></span>
          <span class="truncate">${esc(g.color || "—")}</span>
          <span>·</span><span>${esc(g.subcategory || CATEGORY_LBL[g.category])}</span>
        </div>
        <div class="row wrap tiny muted" style="gap:6px;">
          <span class="badge">${CATEGORY_LBL[g.category]}</span>
          <span class="badge">F${g.formality}</span>
          <span class="badge">${cap(g.season)}</span>
          <span>${worn}</span>
          ${perWear != null ? `<span>· ${money(perWear)}/wear</span>` : ""}
          ${staleBadge}
        </div>
      </div>
      <div class="g-actions">
        <button class="btn sm" onclick="startEdit('${g.id}')">Edit</button>
        <button class="btn sm danger" onclick="confirmDelete('${g.id}')">✕</button>
      </div>
    </div>`;
}

window.confirmDelete = function (id) {
  const g = getGarment(id);
  if (g && confirm(`Delete “${g.name}”?`)) { deleteGarment(id); render(); }
};

        <select name="weight">${WEIGHTS.map(w => opt(w, cap(w), g.weight || "medium")).join("")}</select>
      </div>
    </div>

}
// keep the shoe-only visual-weight field in sync with the category select
function wireGarmentForm(form) {
  form.category.addEventListener("change", e => {
    const vw = form.querySelector("#vw-field");
    if (vw) vw.hidden = e.target.value !== "shoe";
  });
}
function readGarmentForm(form) { return Object.fromEntries(new FormData(form).entries()); }

/* ---------- Add / Edit form ---------- */
function renderForm() {
  const editing = editingId ? getGarment(editingId) : null;
  viewTitle.textContent = editing ? "Edit garment" : "Add garment";
  viewSub.textContent = editing ? esc(editing.name) : "New piece";

  const g = editing || {};

  view.innerHTML = `
    ${lastUnlock && !editing ? unlockBanner(lastUnlock) : ""}
    <form id="gform" class="stack card" style="padding:16px;">
      <div class="field">
        <label>Name <span class="req">*</span></label>
        <input type="text" name="name" value="${esc(g.name || "")}" placeholder="Charcoal merino crewneck" />
        <div class="err" id="err-name" hidden>Name is required.</div>
      </div>

      ${garmentAttrFieldsHTML(g)}

      <div class="field">
        <label>Rating</label>
        <select name="rating">${["", 1,2,3,4,5].map(n => opt(n, n === "" ? "—" : `${n}★`, g.rating || "")).join("")}</select>
      </div>

      <div class="field">
        <label>Photo</label>
        <div class="row wrap" style="gap:10px;">
          <div class="g-thumb" id="photo-preview" style="width:72px;height:72px;">
            ${g.imageData ? `<img src="${g.imageData}" alt="" />` : `<span>${CATEGORY_ICO[g.category] || "👚"}</span>`}
          </div>
          <div class="grow">
            <input type="file" id="photo-input" accept="image/*" style="min-height:auto;padding:8px;" />
            <div class="tiny muted" style="margin-top:4px;">Resized to 800px max, stored on-device.</div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea name="notes" placeholder="Optional">${esc(g.notes || "")}</textarea>
      </div>

      <div class="row" style="gap:10px; margin-top:4px;">
        <button type="submit" class="btn primary grow">${editing ? "Save changes" : "Add garment"}</button>
        ${editing ? `<button type="button" class="btn danger" onclick="confirmDelete('${g.id}')">Delete</button>` : ""}
      </div>
    </form>`;

  const form = document.getElementById("gform");
  let pendingImage = g.imageData || null;

  wireGarmentForm(form);
  form.category.addEventListener("change", e => {
    if (!pendingImage) { const pv = document.getElementById("photo-preview"); if (pv) pv.innerHTML = `<span>${CATEGORY_ICO[e.target.value] || "👚"}</span>`; }
  });

  document.getElementById("photo-input").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingImage = await resizeImage(file, 800);
      document.getElementById("photo-preview").innerHTML = `<img src="${pendingImage}" alt="" />`;
    } catch (err) { alert("Could not read image: " + err.message); }
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    // validate required
    const nameErr = document.getElementById("err-name");
    if (!data.name.trim()) { nameErr.hidden = false; form.name.classList.add("invalid"); form.name.focus(); return; }
    nameErr.hidden = true; form.name.classList.remove("invalid");

    data.imageData = pendingImage;
    data.rating = data.rating || null;

    if (editing) {
      updateGarment(editing.id, data);
      editingId = null;
      lastUnlock = null;
      setTab("wardrobe");
    } else {
      // unlock counter: measure before adding, then add
      const draft = normalizeGarment(data);
      lastUnlock = calculateUnlock(getGarments(), draft);
      addGarment(draft);
      form.reset();
      render(); // re-render Add view with the unlock banner on top
    }
  });
}

function unlockBanner(u) {
  const delta = u.delta;
  const sign = delta > 0 ? "+" : "";
  const previews = u.best.length
    ? `<div class="sectitle" style="margin-top:14px;">New combinations unlocked</div>
       <div class="stack" style="gap:8px;">${u.best.map(o => outfitStrip(o)).join("")}</div>`
    : "";
  return `
    <div class="unlock">
      <div class="small muted">Added to your wardrobe</div>
      <div class="big ${delta > 0 ? "pos" : ""}">${sign}${delta}${u.capped ? "+" : ""} outfits</div>
      <div class="small muted">${u.before}${u.capped ? "+" : ""} → ${u.after}${u.capped ? "+" : ""} valid combinations</div>
      ${previews}
      <div class="row" style="gap:8px; margin-top:14px;">
        <button class="btn sm" onclick="setTab('outfits')">Browse outfits</button>
        <button class="btn sm ghost" onclick="dismissUnlock()">Dismiss</button>
      </div>
    </div>`;
}
window.dismissUnlock = function () { lastUnlock = null; render(); };

function outfitStrip(o) {
  return `<div class="o-item" style="width:100%;">
    <div class="row wrap grow" style="gap:6px;">
      ${o.items.map(it => `<span class="chip tag">${it.imageData ? `<span class="mini" style="width:18px;height:18px;"><img src="${it.imageData}"></span>` : (CATEGORY_ICO[it.category]||"")} ${esc(it.name)}</span>`).join("")}
    </div>
  </div>`;
}

/* ---------- Outfits (Suggested / Build) ---------- */
function renderOutfits() {
  viewTitle.textContent = "Outfits";
  const garments = getGarments();
  const seg = segmented([["suggested", "Suggested"], ["build", "Build"]], outfitMode, "setOutfitMode");
  if (outfitMode === "build") renderBuilder(garments, seg);
  else renderSuggested(garments, seg);
}
window.setOutfitMode = function (m) { outfitMode = m; renderOutfits(); };

function segmented(opts, cur, fn) {
  return `<div class="seg">${opts.map(([v, l]) => `<button class="seg-btn ${v === cur ? "on" : ""}" onclick="${fn}('${v}')">${esc(l)}</button>`).join("")}</div>`;
}

/* ----- Suggested: outfit of the day + occasion filter + ranked browser ----- */
function renderSuggested(garments, seg) {
  const byCat = groupByCategory(garments);
  if (!byCat.bottom.length || !byCat.shoe.length || (!byCat.base.length && !byCat.mid.length)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◈", "Not enough to build outfits yet",
      "The engine needs at least one bottom, one shoe, and a top layer (base or mid).",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }

  const { outfits, count, capped } = generateOutfits(garments, { store: OUTFIT_STORE });
  outfits.sort((a, b) => scoreOutfit(b.items) - scoreOutfit(a.items));

  // weather filter — narrow the working pool to outfits that suit the temperature
  const weatherOn = weatherFilter && weather.status === "ok";
  const pool = weatherOn ? outfits.filter(o => outfitSuitsSeason(o.items, weather.season)) : outfits;

  // outfit of the day — picked from the (weather-aware) pool; re-pick if stale
  if (!ootdDismissed) {
    const inPool = ootd && pool.some(o => o.garmentIds.join() === ootd.garmentIds.join());
    if (!ootd || !inPool) ootd = pickOOTD(pool, "");
  }
  const ootdHTML = (ootd && !ootdDismissed) ? ootdCard(ootd) : "";

  // occasion filter
  const filtered = occasionFilter === "all" ? pool
    : pool.filter(o => { try { return occasionRules[occasionFilter](o.items); } catch (e) { return false; } });
  const occChips = `<div class="row wrap" style="gap:7px; margin-bottom:14px;">
    ${["all", ...OCCASIONS].map(o => `<span class="chip btn-chip ${occasionFilter === o ? "on" : ""}" onclick="setOccasion('${o}')">${o === "all" ? "All" : OCCASION_LBL[o]}</span>`).join("")}
  </div>`;

  viewSub.textContent = `${count}${capped ? "+" : ""} valid · ${filtered.length} shown`;

  const pages = Math.max(1, Math.ceil(filtered.length / OUTFITS_PER_PAGE));
  outfitPage = Math.max(0, Math.min(outfitPage, pages - 1));
  const slice = filtered.slice(outfitPage * OUTFITS_PER_PAGE, (outfitPage + 1) * OUTFITS_PER_PAGE);

  const cappedBanner = capped ? `<div class="banner warn">Showing the first ${OUTFIT_STORE.toLocaleString()} outfits — generation was capped for performance.</div>` : "";
  const emptyMsg = weatherOn && !filtered.length
    ? `No ${occasionFilter === "all" ? "" : OCCASION_LBL[occasionFilter] + " "}outfits suit ${weather.tempC}°C right now — turn off the weather filter to see more.`
    : `No ${occasionFilter === "all" ? "" : OCCASION_LBL[occasionFilter] + " "}outfits from your current wardrobe.`;
  const body = slice.length
    ? `<div class="stack">${slice.map((o, i) => outfitCard(o, outfitPage * OUTFITS_PER_PAGE + i)).join("")}</div>`
    : `<div class="empty muted">${emptyMsg}</div>`;

  view.innerHTML = seg + weatherBar() + ootdHTML + occChips + cappedBanner + body +
    (pages > 1 ? `
      <div class="pager">
        <button class="btn sm" ${outfitPage === 0 ? "disabled" : ""} onclick="pageOutfits(-1)">← Prev</button>
        <span class="small muted">Page ${outfitPage + 1} / ${pages}</span>
        <button class="btn sm" ${outfitPage >= pages - 1 ? "disabled" : ""} onclick="pageOutfits(1)">Next →</button>
      </div>` : "");
}
window.setOccasion = function (o) { occasionFilter = o; outfitPage = 0; renderOutfits(); };
window.pageOutfits = function (d) { outfitPage += d; renderOutfits(); };

/* ----- weather (Open-Meteo, no key; fails gracefully to no filtering) ----- */
function weatherBar() {
  const emoji = { hot: "☀️", mild: "🌤", cold: "❄️" };
  if (weather.status === "ok") {
    return `<div class="card" style="padding:10px 12px; margin-bottom:14px;">
      <div class="row wrap" style="gap:10px;">
        <span class="row" style="gap:6px;"><span style="font-size:18px;">${emoji[weather.season]}</span>
          <b>${weather.tempC}°C</b><span class="muted small">· ${cap(weather.season)} weather</span></span>
        <span class="chip btn-chip ${weatherFilter ? "on" : ""}" onclick="toggleWeatherFilter()">${weatherFilter ? "Filtering by weather ✓" : "Filter by weather"}</span>
        <button class="btn sm ghost" onclick="clearWeather()">Clear</button>
      </div>
    </div>`;
  }
  const loading = weather.status === "loading";
  const errNote = weather.status === "error"
    ? `<div class="tiny muted" style="margin-top:6px;">Couldn't fetch weather (offline or location blocked). Enter a temperature manually, or continue without it.</div>` : "";
  return `<div class="card" style="padding:10px 12px; margin-bottom:14px;">
    <div class="row wrap" style="gap:8px;">
      <button class="btn sm" onclick="fetchWeather()" ${loading ? "disabled" : ""}>${loading ? "Locating…" : "🌤 Use my location"}</button>
      <span class="muted small">or</span>
      <input id="manual-temp" type="number" placeholder="°C" style="width:78px; min-height:34px;" onkeydown="if(event.key==='Enter')applyManualTemp()" />
      <button class="btn sm" onclick="applyManualTemp()">Set</button>
    </div>${errNote}
  </div>`;
}
window.fetchWeather = function () {
  if (!navigator.geolocation) { weather = { status: "error", tempC: null, season: null }; renderOutfits(); return; }
  weather = { status: "loading", tempC: null, season: null }; renderOutfits();
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`${OPEN_METEO_URL}?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`);
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const t = data.current.temperature_2m;
      weather = { status: "ok", tempC: Math.round(t), season: tempToSeason(t) };
      weatherFilter = true;
    } catch (e) { weather = { status: "error", tempC: null, season: null }; }
    renderOutfits();
  }, () => { weather = { status: "error", tempC: null, season: null }; renderOutfits(); }, { timeout: 8000, maximumAge: 600000 });
};
window.applyManualTemp = function () {
  const el = document.getElementById("manual-temp"); if (!el) return;
  const t = parseFloat(el.value);
  if (Number.isNaN(t)) return;
  weather = { status: "ok", tempC: Math.round(t), season: tempToSeason(t) };
  weatherFilter = true; renderOutfits();
};
window.toggleWeatherFilter = function () { weatherFilter = !weatherFilter; renderOutfits(); };
window.clearWeather = function () { weather = { status: "idle", tempC: null, season: null }; weatherFilter = false; renderOutfits(); };

function ootdCard(o) {
  return `
    <div class="ootd">
      <div class="eyebrow">Outfit of the day</div>
      <div class="o-items" style="margin:10px 0;">
        ${o.items.slice().sort(sortForDisplay).map(itemPill).join("")}
      </div>
      <div class="row wrap" style="gap:8px;">
        <button class="btn sm primary" onclick="acceptOOTD()">Wear today</button>
        <button class="btn sm" onclick="reshuffleOOTD()">Reshuffle</button>
        <button class="btn sm ghost" onclick="dismissOOTD()">Dismiss</button>
      </div>
    </div>`;
}
window.acceptOOTD = function () {
  if (ootd) wearOutfit(ootd.items);
  ootd = null; ootdDismissed = true; renderOutfits();
};
window.reshuffleOOTD = function () {
  const { outfits } = generateOutfits(getGarments(), { store: OUTFIT_STORE });
  ootd = pickOOTD(outfits, ootd ? ootd.garmentIds.join() : "");
  ootdDismissed = false; renderOutfits();
};
window.dismissOOTD = function () { ootd = null; ootdDismissed = true; renderOutfits(); };

/* ----- shared outfit rendering ----- */
function outfitCard(o, idx) {
  const totalCost = o.items.reduce((a, i) => a + i.cost, 0);
  const fs = o.items.map(i => i.formality);
  const seasons = [...new Set(o.items.map(i => i.season))];
  return `
    <div class="card o-card">
      <div class="row" style="justify-content:space-between; align-items:flex-start;">
        <div class="small muted">Outfit #${idx + 1}</div>
        <div class="row wrap tiny muted" style="gap:5px; justify-content:flex-end;">
          <span class="badge">F${Math.min(...fs)}–${Math.max(...fs)}</span>
          <span class="badge">${seasons.map(cap).join("/")}</span>
          <span class="badge">${money(totalCost)}</span>
        </div>
      </div>
      <div class="o-items">
        ${o.items.slice().sort(sortForDisplay).map(itemPill).join("")}
      </div>
      <div class="row wrap" style="gap:8px; align-items:center;">
        <button class="btn sm primary" onclick="woreOutfit('${o.garmentIds.join(",")}')">Wore this today</button>
        <button class="btn sm" onclick="saveOutfit('${o.garmentIds.join(",")}')">Save</button>
        ${ratingStars(o.garmentIds)}
      </div>
    </div>`;
}
// clickable 1–5 star row keyed to a garment set; click the current rating to clear
function ratingStars(ids) {
  const cur = getOutfitRating(ids) || 0;
  const csv = ids.join(",");
  return `<span class="stars" title="Rate this outfit — feeds future suggestions">${[1,2,3,4,5].map(n =>
    `<span class="star ${n <= cur ? "on" : ""}" onclick="rateOutfitUI('${csv}',${n})">★</span>`).join("")}</span>`;
}
window.rateOutfitUI = function (csv, n) {
  const ids = csv.split(",");
  const cur = getOutfitRating(ids);
  rateOutfit(ids, cur === n ? 0 : n);
  renderOutfits();
};
function sortForDisplay(a, b) {
  const order = { base: 0, mid: 1, outer: 2, bottom: 3, shoe: 4 };
  return order[a.category] - order[b.category];
}
function itemPill(it) {
  const mini = it.imageData ? `<span class="mini"><img src="${it.imageData}"></span>`
                            : `<span class="mini">${CATEGORY_ICO[it.category] || "👚"}</span>`;
  return `<div class="o-item">${mini}<div style="min-width:0;">
      <div class="small truncate" style="max-width:130px;">${esc(it.name)}</div>
      <div class="tiny muted">${esc(it.subcategory || CATEGORY_LBL[it.category])}</div>
    </div></div>`;
}
window.woreOutfit = function (ids) {
  const items = ids.split(",").map(getGarment).filter(Boolean);
  wearOutfit(items);
  renderOutfits();
};
window.saveOutfit = function (ids) {
  const rec = saveOutfitRecord({ garmentIds: ids.split(",") });
  alert(rec ? "Saved to your outfits (see Build tab)." : "You've already saved this outfit.");
};

/* ----- Build: manual outfit builder + saved outfits ----- */
function renderBuilder(garments, seg) {
  viewSub.textContent = "";
  if (!garments.length) {
    view.innerHTML = seg + emptyState("◈", "Nothing to build with", "Add garments first.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>`);
    return;
  }
  const selItems = [...builderSel].map(getGarment).filter(Boolean);
  const validity = selItems.length ? isValidOutfit(selItems) : null;

  const groups = CATEGORIES.map(cat => {
    const items = garments.filter(g => g.category === cat);
    if (!items.length) return "";
    return `<div class="build-cat">
      <div class="sectitle">${CATEGORY_LBL[cat]}</div>
      <div class="build-chips">
        ${items.map(g => `<span class="pick ${builderSel.has(g.id) ? "on" : ""}" onclick="toggleBuilderPick('${g.id}')">
          <span class="mini">${g.imageData ? `<img src="${g.imageData}">` : (CATEGORY_ICO[cat] || "👚")}</span>${esc(g.name)}</span>`).join("")}
      </div>
    </div>`;
  }).join("");

  const vBox = validity
    ? `<div class="validity ${validity.valid ? "ok" : "bad"}">
        ${validity.valid ? "✓ Valid — passes every rule." : "⚠ Breaks: " + validity.reasons.map(esc).join(" · ") + ". You can still save it."}
      </div>` : `<div class="small muted" style="margin:6px 0 12px;">Tap items to build an outfit. Rule-breaking combos are flagged but still savable.</div>`;

  const saved = state.outfits.slice().reverse();
  const savedCards = saved.map(savedOutfitCard).filter(Boolean);
  const savedHTML = savedCards.length ? `
    <div class="sectitle" style="margin-top:22px;">Saved outfits (${savedCards.length})</div>
    <div class="stack">${savedCards.join("")}</div>` : "";

  view.innerHTML = seg + `
    <div class="card" style="padding:14px; margin-bottom:16px;">
      ${groups}
      ${vBox}
      <div class="row wrap" style="gap:10px; margin-top:6px;">
        <input type="text" id="build-name" class="grow" value="${esc(builderName)}" placeholder="Name this outfit (optional)" style="min-width:160px;" />
        <select id="build-occasion" style="width:auto;">
          ${["", ...OCCASIONS].map(o => opt(o, o === "" ? "No occasion" : OCCASION_LBL[o], builderOccasion)).join("")}
        </select>
      </div>
      <div class="row" style="gap:10px; margin-top:12px;">
        <button class="btn primary grow" onclick="saveManualOutfit()" ${selItems.length ? "" : "disabled"}>Save outfit</button>
        <button class="btn" onclick="clearBuilder()" ${builderSel.size ? "" : "disabled"}>Clear</button>
      </div>
    </div>
    ${savedHTML}`;

  const nameEl = document.getElementById("build-name");
  if (nameEl) nameEl.oninput = e => { builderName = e.target.value; };
  const occEl = document.getElementById("build-occasion");
  if (occEl) occEl.onchange = e => { builderOccasion = e.target.value; };
}
function syncBuilderInputs() {
  const n = document.getElementById("build-name"); if (n) builderName = n.value;
  const o = document.getElementById("build-occasion"); if (o) builderOccasion = o.value;
}
window.toggleBuilderPick = function (id) {
  syncBuilderInputs();
  if (builderSel.has(id)) builderSel.delete(id); else builderSel.add(id);
  renderOutfits();
};
window.clearBuilder = function () { syncBuilderInputs(); builderSel.clear(); renderOutfits(); };
window.saveManualOutfit = function () {
  const items = [...builderSel].map(getGarment).filter(Boolean);
  if (!items.length) return;
  const v = isValidOutfit(items);
  if (!v.valid && !confirm("This outfit breaks:\n\n• " + v.reasons.join("\n• ") + "\n\nSave it anyway?")) return;
  const name = (document.getElementById("build-name").value || "").trim() || null;
  const occasion = document.getElementById("build-occasion").value || null;
  const rec = saveOutfitRecord({ garmentIds: items.map(i => i.id), name, occasion, isManual: true });
  if (!rec) { alert("You've already saved this exact outfit."); return; }
  builderSel.clear(); builderName = ""; builderOccasion = "";
  renderOutfits();
};

function savedOutfitCard(rec) {
  const items = rec.garmentIds.map(getGarment).filter(Boolean);
  if (items.length !== rec.garmentIds.length) return ""; // a component garment was deleted
  const v = isValidOutfit(items);
  return `
    <div class="card o-card">
      <div class="row wrap" style="justify-content:space-between; align-items:flex-start; gap:6px;">
        <div class="small">${rec.name ? esc(rec.name) : "Untitled outfit"}
          ${rec.occasion ? `<span class="badge" style="margin-left:6px;">${OCCASION_LBL[rec.occasion]}</span>` : ""}
          ${rec.isManual ? `<span class="badge" style="margin-left:4px;">Manual</span>` : ""}
          ${!v.valid ? `<span class="badge warn" style="margin-left:4px;" title="${esc(v.reasons.join(', '))}">Breaks a rule</span>` : ""}
        </div>
        <div class="small muted">${rec.timesWorn ? rec.timesWorn + "× worn" : ""}</div>
      </div>
      <div class="o-items">${items.slice().sort(sortForDisplay).map(itemPill).join("")}</div>
      <div class="row wrap" style="gap:8px; align-items:center;">
        <button class="btn sm primary" onclick="woreSaved('${rec.id}')">Wore this today</button>
        <button class="btn sm danger" onclick="deleteSaved('${rec.id}')">Delete</button>
        ${ratingStars(rec.garmentIds)}
      </div>
    </div>`;
}
window.woreSaved = function (id) {
  const rec = state.outfits.find(o => o.id === id); if (!rec) return;
  wearOutfit(rec.garmentIds.map(getGarment).filter(Boolean));
  rec.timesWorn += 1; rec.lastWorn = todayISO();
  saveToStorage(); renderOutfits();
};
window.deleteSaved = function (id) {
  if (confirm("Delete this saved outfit?")) { deleteOutfitRecord(id); renderOutfits(); }
};

/* ---------- Plan (Gap analysis / Wishlist) ---------- */
function renderPlan() {
  viewTitle.textContent = "Plan";
  const garments = getGarments();
  const seg = segmented([["gaps", "Gap analysis"], ["wishlist", "Wishlist"], ["packing", "Packing"]], planMode, "setPlanMode");
  if (planMode === "wishlist") renderWishlist(garments, seg);
  else if (planMode === "packing") renderPacking(garments, seg);
  else renderGaps(garments, seg);
}
window.setPlanMode = function (m) { planMode = m; renderPlan(); };

function canBuildOutfits(garments) {
  const b = groupByCategory(garments);
  return !!(b.bottom.length && b.shoe.length && (b.base.length || b.mid.length));
}

/* ----- Gap analysis: rank hypothetical garments by outfits unlocked ----- */
function renderGaps(garments, seg) {
  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◇", "Gap analysis needs a base wardrobe",
      "Add at least a bottom, a shoe and a top so the engine has outfits to compare against.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }
  const rows = analyzeGaps(garments, gapCandidates);
  const maxDelta = Math.max(1, ...rows.map(r => r.delta));
  viewSub.textContent = `${gapCandidates.length} candidates ranked`;
  const intro = `<div class="small muted" style="margin-bottom:14px;">New valid outfits each hypothetical piece would unlock, ranked richest-first. Edit the candidate list in the config block at the top of the file.</div>`;
  view.innerHTML = seg + intro + `<div class="stack">${rows.map(r => gapRow(r, maxDelta)).join("")}</div>`;
}

function gapRow(r, maxDelta) {
  const spec = r.spec;
  const preview = r.best.length
    ? `<div class="o-items" style="margin-top:10px;">${r.best[0].items.slice().sort(sortForDisplay).map(itemPill).join("")}</div>` : "";
  const cpu = r.costPerUnlock != null ? `${money(r.costPerUnlock)} per new outfit`
    : (r.delta > 0 ? "cost not set" : "no new outfits");
  const specJson = esc(JSON.stringify(spec));
  return `
    <div class="card gap-row">
      <div class="row" style="gap:12px; align-items:flex-start;">
        <div class="grow" style="min-width:0;">
          <div class="g-name">${esc(spec.name)}</div>
          <div class="tiny muted" style="margin-top:2px;">${CATEGORY_LBL[spec.category]} · ${esc(spec.color)} · F${spec.formality} · ${cap(spec.season)} · ${money(spec.cost)}</div>
          <div class="tiny muted" style="margin-top:4px;">${esc(cpu)}</div>
        </div>
        <div class="gap-delta ${r.delta > 0 ? "" : "zero"}">${r.delta > 0 ? "+" : ""}${r.delta}${r.capped ? "+" : ""}</div>
      </div>
      <div class="gap-bar"><span style="width:${Math.round(r.delta / maxDelta * 100)}%"></span></div>
      ${preview}
      <div class="row wrap" style="gap:8px; margin-top:12px;">
        <button class="btn sm primary" onclick='addCandidateToWardrobe(${specJson})'>Add to wardrobe</button>
        <button class="btn sm" onclick='addCandidateToWishlist(${specJson})'>Add to wishlist</button>
      </div>
    </div>`;
}
window.addCandidateToWardrobe = function (spec) { const g = addGarment(spec); alert(`Added “${g.name}” to your wardrobe.`); renderPlan(); };
window.addCandidateToWishlist = function (spec) { addWishlist(spec); planMode = "wishlist"; renderPlan(); };

/* ----- Wishlist: hypotheticals with projected unlock + convert-to-real ----- */
function renderWishlist(garments, seg) {
  const wl = getWishlist();
  viewSub.textContent = wl.length ? `${wl.length} item${wl.length === 1 ? "" : "s"}` : "";
  const canProject = canBuildOutfits(garments);

  const form = `
    <details class="card" style="padding:14px; margin-bottom:16px;" ${wl.length ? "" : "open"}>
      <summary style="cursor:pointer; font-weight:600;">Add a wishlist item</summary>
      <form id="wl-form" class="stack" style="margin-top:12px;">
        <div class="field">
          <label>Name <span class="req">*</span></label>
          <input type="text" name="name" placeholder="Navy quarter-zip" />
          <div class="err" id="wl-err" hidden>Name is required.</div>
        </div>
        ${garmentAttrFieldsHTML({})}
        <button type="submit" class="btn primary">Add to wishlist</button>
      </form>
    </details>`;

  const list = wl.length
    ? `<div class="stack">${wl.map(w => wishlistCard(w, garments, canProject)).join("")}</div>`
    : `<div class="empty muted" style="padding:24px;">Nothing on your wishlist yet. Add a piece you're considering to see what it would unlock before you buy.</div>`;

  view.innerHTML = seg + form + list;

  const f = document.getElementById("wl-form");
  wireGarmentForm(f);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const data = readGarmentForm(f);
    const err = document.getElementById("wl-err");
    if (!data.name.trim()) { err.hidden = false; f.name.classList.add("invalid"); f.name.focus(); return; }
    addWishlist(data);
    renderPlan();
  });
}

function wishlistCard(w, garments, canProject) {
  let projLine = `<div class="tiny muted" style="margin-top:4px;">Add a base wardrobe to project unlocks.</div>`;
  if (canProject) {
    const u = calculateUnlock(garments, w);
    const cpu = (w.cost > 0 && u.delta > 0) ? `${money(w.cost / u.delta)} / outfit` : (u.delta > 0 ? "cost not set" : "—");
    projLine = `<div class="row wrap" style="gap:8px; margin-top:6px;">
      <span class="badge" style="color:var(--accent); border-color:#2f3b6b;">+${u.delta}${u.capped ? "+" : ""} outfits</span>
      <span class="badge">${esc(cpu)}</span>
    </div>`;
  }
  return `
    <div class="card gap-row">
      <div class="grow" style="min-width:0;">
        <div class="g-name">${esc(w.name)}</div>
        <div class="tiny muted" style="margin-top:2px;">${CATEGORY_LBL[w.category]} · ${esc(w.color || "—")} · F${w.formality} · ${cap(w.season)} · ${money(w.cost)}</div>
        ${projLine}
      </div>
      <div class="row wrap" style="gap:8px; margin-top:12px;">
        <button class="btn sm primary" onclick="buyWishlist('${w.id}')">Bought it — add to wardrobe</button>
        <button class="btn sm danger" onclick="removeWishlist('${w.id}')">Remove</button>
      </div>
    </div>`;
}
window.buyWishlist = function (id) { const g = convertWishlist(id); if (g) alert(`“${g.name}” moved into your wardrobe.`); renderPlan(); };
window.removeWishlist = function (id) { if (confirm("Remove from wishlist?")) { deleteWishlist(id); renderPlan(); } };

/* ----- Packing: minimum capsule covering N days of chosen occasions ----- */
function renderPacking(garments, seg) {
  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◇", "Packing needs a base wardrobe",
      "Add at least a bottom, a shoe and a top so the engine has outfits to pack.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }
  viewSub.textContent = "";
  const controls = `
    <div class="card" style="padding:14px; margin-bottom:16px;">
      <div class="row wrap" style="gap:14px; align-items:flex-end;">
        <div class="field" style="width:96px; flex:none;">
          <label>Days</label>
          <input id="pack-days" type="number" min="1" max="30" value="${packDays}" />
        </div>
        <div class="grow" style="min-width:180px;">
          <label class="small muted">Occasions (optional)</label>
          <div class="row wrap" style="gap:7px; margin-top:7px;">
            ${OCCASIONS.map(o => `<span class="chip btn-chip ${packOccasions.includes(o) ? "on" : ""}" onclick="togglePackOccasion('${o}')">${OCCASION_LBL[o]}</span>`).join("")}
          </div>
        </div>
      </div>
      <button class="btn primary" style="margin-top:14px;" onclick="runPacking()">Build packing list</button>
    </div>`;

  let result = "";
  if (packResult) {
    const r = packResult;
    if (!r.pool) {
      result = `<div class="empty muted">No outfits match ${packOccasions.map(o => OCCASION_LBL[o]).join(" / ") || "your wardrobe"}. Try different occasions.</div>`;
    } else {
      const shortfall = r.shortfall > 0
        ? `<div class="banner warn">Only ${r.chosen.length} distinct outfit${r.chosen.length === 1 ? "" : "s"} available — ${r.shortfall} day${r.shortfall === 1 ? "" : "s"} short. Add pieces or widen occasions.</div>` : "";
      const totalCost = r.capsule.reduce((a, g) => a + g.cost, 0);
      const capsuleByCat = CATEGORIES.map(cat => {
        const items = r.capsule.filter(g => g.category === cat);
        if (!items.length) return "";
        return `<div style="margin-bottom:10px;">
          <div class="tiny muted" style="margin-bottom:5px;">${CATEGORY_LBL[cat]}</div>
          <div class="build-chips">${items.map(g => `<span class="pick"><span class="mini">${g.imageData ? `<img src="${g.imageData}">` : (CATEGORY_ICO[cat] || "👚")}</span>${esc(g.name)}</span>`).join("")}</div>
        </div>`;
      }).join("");
      const daysHTML = r.chosen.map((o, i) => `
        <div class="card o-card">
          <div class="small muted">Day ${i + 1}</div>
          <div class="o-items">${o.items.slice().sort(sortForDisplay).map(itemPill).join("")}</div>
        </div>`).join("");
      result = `
        ${shortfall}
        <div class="stat-grid" style="margin-bottom:16px;">
          <div class="card stat"><div class="n">${r.capsule.length}</div><div class="l">Garments to pack</div></div>
          <div class="card stat"><div class="n">${r.chosen.length}</div><div class="l">Outfits produced</div></div>
        </div>
        <div class="card" style="padding:14px; margin-bottom:16px;">
          <div class="sectitle">Pack these ${r.capsule.length} pieces · ${money(totalCost)}</div>
          <div style="margin-top:10px;">${capsuleByCat}</div>
        </div>
        <div class="sectitle" style="margin:4px 0 10px;">Daily outfits</div>
        <div class="stack">${daysHTML}</div>`;
    }
  }

  view.innerHTML = seg + controls + result;
  const d = document.getElementById("pack-days");
  if (d) d.onchange = e => { packDays = clampInt(e.target.value, 1, 30, 4); };
}
window.togglePackOccasion = function (o) {
  const i = packOccasions.indexOf(o);
  if (i >= 0) packOccasions.splice(i, 1); else packOccasions.push(o);
  packResult = null; renderPlan();
};
window.runPacking = function () {
  const d = document.getElementById("pack-days");
  if (d) packDays = clampInt(d.value, 1, 30, 4);
  packResult = planPacking(getGarments(), packDays, packOccasions);
  renderPlan();
};

/* ---------- Stats (full dashboard) ---------- */
function renderStats() {
  viewTitle.textContent = "Stats";
  viewSub.textContent = "";
  const g = getGarments();
  if (!g.length) {
    view.innerHTML = emptyState("◐", "Nothing to summarize yet", "Add garments to see your wardrobe stats.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>
       <button class="btn" onclick="loadSample()">Load sample wardrobe</button>`);
    return;
  }
  const spent = g.reduce((a, x) => a + x.cost, 0);
  const { count, capped } = generateOutfits(g, { store: 0 });
  const worn = g.filter(x => x.timesWorn > 0);
  const totalWears = g.reduce((a, x) => a + x.timesWorn, 0);
  const avgCpw = worn.length ? worn.reduce((a, x) => a + cpw(x), 0) / worn.length : null;
  const neverWorn = g.filter(x => !x.timesWorn);
  const stale = g.filter(x => x.timesWorn && daysSince(x.lastWorn) >= STALE_DAYS);
  const wl = getWishlist();
  const wlValue = wl.reduce((a, x) => a + x.cost, 0);
  const ratings = Object.values(state.ratings);
  const avgRating = ratings.length ? ratings.reduce((a, r) => a + r, 0) / ratings.length : null;

  const most = g.slice().sort((a, b) => b.timesWorn - a.timesWorn)[0];
  const least = worn.slice().sort((a, b) => a.timesWorn - b.timesWorn)[0];
  const bestValue = worn.slice().sort((a, b) => cpw(a) - cpw(b))[0];   // lowest cost/wear
  const worstValue = worn.slice().sort((a, b) => cpw(b) - cpw(a))[0];  // highest cost/wear

  // wardrobe composition by category
  const catCounts = CATEGORIES.map(c => [CATEGORY_LBL[c], g.filter(x => x.category === c).length]);
  const catMax = Math.max(1, ...catCounts.map(c => c[1]));
  const catBars = catCounts.filter(c => c[1]).map(([lbl, n]) => `
    <div class="row" style="gap:10px; margin:6px 0;">
      <span class="small muted" style="width:88px; flex:none;">${lbl}</span>
      <div class="gap-bar grow" style="margin:0;"><span style="width:${Math.round(n / catMax * 100)}%"></span></div>
      <span class="small" style="width:22px; text-align:right; flex:none;">${n}</span>
    </div>`).join("");

  const line = (label, g) => g ? `<div class="row" style="justify-content:space-between; gap:10px;"><span class="small truncate">${esc(g.name)}</span><span class="small muted" style="flex:none;">${label}</span></div>` : "";

  view.innerHTML = `
    <div class="stat-grid" style="margin-bottom:12px;">
      <div class="card stat"><div class="n">${g.length}</div><div class="l">Garments</div></div>
      <div class="card stat"><div class="n">${money(spent)}</div><div class="l">Total spent</div></div>
      <div class="card stat"><div class="n">${count}${capped ? "+" : ""}</div><div class="l">Valid outfits</div></div>
      <div class="card stat"><div class="n">${avgCpw != null ? money(avgCpw) : "—"}</div><div class="l">Avg cost / wear</div></div>
    </div>
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="card stat"><div class="n">${totalWears}</div><div class="l">Total wears</div></div>
      <div class="card stat"><div class="n">${neverWorn.length}</div><div class="l">Never worn</div></div>
      <div class="card stat"><div class="n">${state.outfits.length}</div><div class="l">Saved outfits</div></div>
      <div class="card stat"><div class="n">${wl.length}${wl.length ? ` · ${money(wlValue)}` : ""}</div><div class="l">Wishlist${wl.length ? " value" : ""}</div></div>
    </div>
    <div class="stack">
      <div class="card" style="padding:14px;">
        <div class="sectitle" style="margin-bottom:8px;">Wardrobe by category</div>
        ${catBars}
      </div>
      <div class="card" style="padding:14px;">
        <div class="sectitle" style="margin-bottom:6px;">Wear leaders</div>
        ${most && most.timesWorn ? line(`${most.timesWorn}× worn`, most) : `<div class="small muted">Nothing worn yet — hit “Wore this today” on an outfit.</div>`}
        ${least ? line(`${least.timesWorn}× worn`, least) : ""}
        ${bestValue ? `<div class="sectitle" style="margin:12px 0 6px;">Cost per wear</div>${line(`${money(cpw(bestValue))}/wear · best`, bestValue)}${worstValue && worstValue !== bestValue ? line(`${money(cpw(worstValue))}/wear · worst`, worstValue) : ""}` : ""}
      </div>
      ${avgRating != null ? `<div class="card" style="padding:14px;">
        <div class="sectitle">Outfit ratings</div>
        <div class="small">${ratings.length} rated · ${avgRating.toFixed(1)}★ average</div>
      </div>` : ""}
      ${neverWorn.length ? `<div class="card" style="padding:14px;">
        <div class="sectitle">Never worn (${neverWorn.length})</div>
        <div class="row wrap" style="gap:6px;">${neverWorn.map(x => `<span class="badge">${esc(x.name)}</span>`).join("")}</div>
      </div>` : ""}
      ${stale.length ? `<div class="card" style="padding:14px;">
        <div class="sectitle">Not worn in ${STALE_DAYS}+ days (${stale.length})</div>
        <div class="row wrap" style="gap:6px;">${stale.map(x => `<span class="badge warn">${esc(x.name)} · ${daysSince(x.lastWorn)}d</span>`).join("")}</div>
      </div>` : ""}
      <div class="card" style="padding:14px;">
        <div class="sectitle" style="margin-bottom:8px;">Data</div>
        <div class="row wrap" style="gap:8px;">
          <button class="btn sm" onclick="exportData()">Export JSON</button>
          <label class="btn sm" style="cursor:pointer;">Import JSON<input type="file" accept="application/json,.json" onchange="importData(this)" hidden></label>

          <button class="btn sm danger" onclick="wipeAll()">Erase everything</button>
        </div>
        <div class="tiny muted" style="margin-top:8px;">Export downloads your whole wardrobe as JSON — this is how you move between devices. Import replaces everything currently stored.</div>
      </div>
    </div>`;
}
window.wipeAll = function () {
  if (confirm("Erase ALL garments, outfits, wishlist and ratings from this device? This can't be undone.")) {
    state = { garments: [], outfits: [], wishlist: [], ratings: {} };
    saveToStorage(); rebuildRatingContext(); lastUnlock = null; ootd = null; render();
  }
};

/* ---------- export / import (move data between devices) ---------- */
window.exportData = function () {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `wardrobe-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
window.importData = function (input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== "object" || !Array.isArray(parsed.garments)) throw new Error("Not a wardrobe export.");
      if (!confirm(`Replace all current data with ${parsed.garments.length} garments from this file?`)) { input.value = ""; return; }
      state = {
        garments: parsed.garments.map(normalizeGarment),
        outfits: Array.isArray(parsed.outfits) ? parsed.outfits : [],
        wishlist: Array.isArray(parsed.wishlist) ? parsed.wishlist.map(x => { const w = normalizeGarment(x); w.isWishlist = true; return w; }) : [],
        ratings: (parsed.ratings && typeof parsed.ratings === "object") ? parsed.ratings : {},
      };
      saveToStorage(); rebuildRatingContext();
      lastUnlock = null; ootd = null; ootdDismissed = false; packResult = null;
      alert(`Imported ${state.garments.length} garments.`);
      setTab("wardrobe");
    } catch (err) { alert("Import failed: " + err.message); }
    input.value = "";
  };
  reader.readAsText(file);
};

function emptyState(ico, title, body, actions) {

    <div class="ico">${ico}</div>
    <h2 style="margin:10px 0 4px; font-size:18px; color:var(--text);">${title}</h2>

    <div class="row" style="gap:10px; justify-content:center; flex-wrap:wrap;">${actions}</div>
  </div>`;
}
function opt(v, label, selected) {
  return `<option value="${esc(v)}" ${String(v) === String(selected) ? "selected" : ""}>${esc(label)}</option>`;
}
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// image resize → base64 jpeg, max longest side `max`
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error("read error"));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => rej(new Error("decode error"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > max) { height = Math.round(height * max / width); width = max; }
        else if (height > max) { width = Math.round(width * max / height); height = max; }
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
