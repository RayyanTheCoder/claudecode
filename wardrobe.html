function wireDeck() {
  const card = document.querySelector(".deck-card");
  if (!card) return;
  // No pointer capture — that would retarget the click and break taps on the
  // buttons, stars and garment rows inside the card. We track the drag on
  // window instead, added on pointerdown and removed on release.
  let x0 = 0, y0 = 0, drag = false;
  const move = e => {
    if (!drag) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    card.style.transform = `translate(${dx}px, ${Math.min(0, dy)}px) rotate(${dx * 0.03}deg)`; // downward reserved for pull-to-refresh
  };
  const end = e => {
    if (!drag) return; drag = false; card.classList.remove("dragging");
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end);
    const dx = e.clientX - x0, dy = e.clientY - y0; card.style.transform = "";
    const T = 55;
    if (Math.abs(dx) > Math.abs(dy)) { if (dx < -T) { haptic(12); window.deckNext(); } else if (dx > T) { haptic(12); window.deckPrev(); } }
    else if (dy < -T) { window.deckWear(); }   // swipe up = wear
  };
  card.addEventListener("pointerdown", e => {
    drag = true; x0 = e.clientX; y0 = e.clientY; card.classList.add("dragging");
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end);
  });
}

/* ----- weather (Open-Meteo, no key; fails gracefully to no filtering) ----- */
function weatherBar() {
  const emoji = { hot: "☀️", mild: "🌤", cold: "❄️" };
  if (weather.status === "ok") {
    return `<div class="card" style="padding:10px 12px; margin-bottom:14px;">
      <div class="row wrap" style="gap:10px;">
        <span class="row" style="gap:6px;"><span style="font-size:18px;">${emoji[weather.season]}</span>
          <b>${weather.tempC}°C</b><span class="muted small">· ${cap(weather.season)} weather</span></span>
        <span class="chip btn-chip ${weatherFilter ? "on" : ""}" onclick="toggleWeatherFilter()">${weatherFilter ? "Filtering by weather ✓" : "Filter by weather"}</span>
        <button class="btn sm ghost" onclick="clearWeather()">Clear</button>
      </div>
    </div>`;
  }
  const loading = weather.status === "loading";
  const errNote = weather.status === "error"
    ? `<div class="tiny muted" style="margin-top:6px;">Couldn't fetch weather (offline or location blocked). Enter a temperature manually, or continue without it.</div>` : "";
  return `<div class="card" style="padding:10px 12px; margin-bottom:14px;">
    <div class="row wrap" style="gap:8px;">
      <button class="btn sm" onclick="fetchWeather()" ${loading ? "disabled" : ""}>${loading ? "Locating…" : "🌤 Use my location"}</button>
      <span class="muted small">or</span>
      <input id="manual-temp" type="number" placeholder="°C" style="width:78px; min-height:34px;" onkeydown="if(event.key==='Enter')applyManualTemp()" />
      <button class="btn sm" onclick="applyManualTemp()">Set</button>
    </div>${errNote}
  </div>`;
}
window.fetchWeather = function () {
  if (!navigator.geolocation) { weather = { status: "error", tempC: null, season: null }; renderOutfits(); return; }
  weather = { status: "loading", tempC: null, season: null }; renderOutfits();
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`${OPEN_METEO_URL}?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`);
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const t = data.current.temperature_2m;
      weather = { status: "ok", tempC: Math.round(t), season: tempToSeason(t) };
      weatherFilter = true;
    } catch (e) { weather = { status: "error", tempC: null, season: null }; }
    renderOutfits();
  }, () => { weather = { status: "error", tempC: null, season: null }; renderOutfits(); }, { timeout: 8000, maximumAge: 600000 });
};
window.applyManualTemp = function () {
  const el = document.getElementById("manual-temp"); if (!el) return;
  const t = parseFloat(el.value);
  if (Number.isNaN(t)) return;
  weather = { status: "ok", tempC: Math.round(t), season: tempToSeason(t) };
  weatherFilter = true; renderOutfits();
};
window.toggleWeatherFilter = function () { weatherFilter = !weatherFilter; renderOutfits(); };
window.clearWeather = function () { weather = { status: "idle", tempC: null, season: null }; weatherFilter = false; renderOutfits(); };

function renderWeekPlanner(garments, seg) {
  if (!plannerWeek) plannerWeek = currentMonday();
  if (plannerHistory) return renderWeekHistory(garments, seg);

  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◇", "The planner needs a base wardrobe",
      "Add at least a bottom, a shoe and a top, then fill your whole week in one tap.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }

  const monIso = plannerWeek;
  applyCarryOver(monIso);                         // roll unworn past days forward (current week only)
  const dates = weekDates(monIso);
  const week = getWeek(monIso);
  viewSub.textContent = `${fmtShort(dates[0])} – ${fmtShort(dates[6])}`;

  const strict = state.planner.strictness;
  const strictSeg = `<div class="seg sm">
    <button class="seg-btn ${strict === "consecutive" ? "on" : ""}" onclick="setStrictness('consecutive')">No back-to-back</button>

  const nav = `<div class="pl-nav">
    <button class="btn sm ghost" onclick="plannerShiftWeek(-1)" title="Previous week">←</button>
    <button class="pl-week-label" onclick="plannerGoCurrent()" title="Jump to this week">${esc(weekRelLabel(monIso))}</button>
    <button class="btn sm ghost" onclick="plannerShiftWeek(1)" title="Next week">→</button>
  </div>`;

  const strictRow = `<div class="pl-strict"><span class="tiny muted">Repeat rule</span>${strictSeg}</div>`;
  const wx = plannerWeatherControl();

  const filled = week.days.filter(d => d.outfit).length;
  const controls = `<div class="row wrap" style="gap:8px; margin:12px 0 2px;">
    <button class="btn sm primary" onclick="autoPlanUI()">✨ Auto-plan week</button>

  const grid = `<div class="pl-grid" id="pl-grid">${dates.map((_, i) => plannerDayCell(monIso, i)).join("")}</div>`;

function plannerDayCell(monIso, i) {

    ? `<div class="pl-thumbs">${planThumbs(hy.items)}</div>`

// swipe left/right on the grid to change weeks; a small drag won't fire (day taps still work)
function wirePlannerSwipe() {
  const grid = document.getElementById("pl-grid");
  if (!grid) return;
  let x0 = null, y0 = null;
  grid.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; }, { passive: true });
  grid.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;

    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) plannerShiftWeek(dx < 0 ? 1 : -1);

};
window.closeDaySheet = function () { const o = document.getElementById("day-overlay"); if (o) o.remove(); };
window.dayWore = function () {

window.dayToggleLock = function () {

window.dayClear = function () {

window.dayShuffleFromSheet = function () {

/* ----- manual assignment: pick a saved or generated outfit for a day ----- */
window.openAssignPicker = function (i) {
  plannerSheetDay = i; closeDaySheet();
  const iso = weekDates(plannerWeek)[i];
  const season = forecastSeason(iso);
  const scored = plannerPool();
  const gen = poolForDay(scored, season).slice().sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.o);
  const saved = state.outfits.map(o => ({ garmentIds: o.garmentIds, items: o.garmentIds.map(getGarment).filter(Boolean), _name: o.name, _saved: true }))
    .filter(o => o.items.length === o.garmentIds.length && o.items.length);

  const cards = [];
  if (saved.length) cards.push(`<div class="sectitle" style="margin:4px 0 8px;">Saved outfits</div>` + saved.map(assignCard).join(""));
  cards.push(`<div class="sectitle" style="margin:${saved.length ? "16px" : "4px"} 0 8px;">Generated${season ? ` · suited to ${cap(season)} weather` : ""}</div>` +
    (gen.length ? gen.map(assignCard).join("") : `<div class="tiny muted">No outfits available.</div>`));

  const el = document.createElement("div");
  el.className = "overlay"; el.id = "assign-overlay";

    <div class="stack" style="margin-top:12px;">${cards.join("")}</div>

};
function assignCard(o) {
  const ids = o.garmentIds.join(",");
  return `<div class="card" style="padding:12px;">
    ${o._saved ? `<div class="small" style="margin-bottom:6px;"><b>${esc(o._name || "Saved outfit")}</b></div>` : ""}

  </div>`;
}
window.assignOutfit = function (idsStr) {
  const ids = idsStr.split(",").filter(Boolean);
  const d = getWeek(plannerWeek).days[plannerSheetDay];
  d.outfit = { garmentIds: ids }; d.worn = false; d.carriedOver = false;

window.closeAssign = function () { const o = document.getElementById("assign-overlay"); if (o) o.remove(); };

/* ----- planner controls ----- */
window.plannerShiftWeek = function (n) { plannerWeek = mondayOf(isoAddDays(plannerWeek || currentMonday(), n * 7)); haptic(8); renderPlan(); };
window.plannerGoCurrent = function () { plannerWeek = currentMonday(); haptic(8); renderPlan(); };
window.setStrictness = function (v) { state.planner.strictness = v === "weekly" ? "weekly" : "consecutive"; saveToStorage(); haptic(10); renderPlan(); };
window.autoPlanUI = function () { const ok = autoPlanWeek(plannerWeek); haptic(20); renderPlan(); if (ok) showToast("Week planned"); };
window.clearWeekUI = function () {
  if (!confirm("Clear all unlocked days this week? Locked days stay put.")) return;
  getWeek(plannerWeek).days.forEach(d => { if (!d.locked) { d.outfit = null; d.worn = false; d.carriedOver = false; } });
  saveToStorage(); haptic(12); renderPlan();
};
window.togglePlannerHistory = function () { plannerHistory = !plannerHistory; haptic(8); renderPlan(); };
window.clearPlannerForecast = function () { plannerForecast = { status: "idle", byDate: {} }; renderPlan(); };
window.fetchPlannerForecast = function () {
  if (!navigator.geolocation) { plannerForecast = { status: "error", byDate: {} }; renderPlan(); return; }
  plannerForecast = { status: "loading", byDate: {} }; renderPlan();
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`${OPEN_METEO_URL}?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max&past_days=7&forecast_days=14&timezone=auto`);
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const times = (data.daily && data.daily.time) || [], temps = (data.daily && data.daily.temperature_2m_max) || [];
      const byDate = {};
      times.forEach((t, i) => { if (typeof temps[i] === "number") byDate[t] = Math.round(temps[i]); });
      plannerForecast = { status: "ok", byDate };
    } catch (e) { plannerForecast = { status: "error", byDate: {} }; }
    if (currentTab === "plan") renderPlan();
  }, () => { plannerForecast = { status: "error", byDate: {} }; if (currentTab === "plan") renderPlan(); }, { timeout: 8000, maximumAge: 1800000 });
};

/* ----- week history: planned vs. actually worn ----- */
function renderWeekHistory(garments, seg) {
  viewSub.textContent = "Planned vs. worn";
  const cur = currentMonday();
  const keys = Object.keys(state.planner.weeks)
    .filter(k => k < cur && state.planner.weeks[k].days.some(d => d.outfit || d.worn))
    .sort().reverse();
  const back = `<div class="row" style="margin:12px 0;"><button class="btn sm ghost" onclick="togglePlannerHistory()">← Back to week</button></div>`;
  if (!keys.length) {
    view.innerHTML = seg + back + emptyState("◷", "No past weeks yet",
      "Plan a week and mark outfits worn. Once a week is behind you it lands here, showing how closely you followed the plan.", "");
    return;
  }
  const blocks = keys.map(k => {
    const w = state.planner.weeks[k], dates = weekDates(k);
    const planned = w.days.filter(d => d.outfit).length;
    const worn = w.days.filter(d => d.worn).length;
    const pct = planned ? Math.round(worn / planned * 100) : 0;
    const rows = w.days.map((d, i) => {
      const hy = hydrateOutfit(d.outfit);
      const status = d.worn ? `<span class="pl-badge worn">✓ Worn</span>`
        : (hy ? `<span class="pl-badge miss">Not worn</span>` : `<span class="tiny muted">—</span>`);
      return `<div class="pl-hrow">
        <span class="pl-hdow">${WEEKDAYS[i]}</span>
        <span class="pl-hthumbs">${hy ? planThumbs(hy.items) : `<span class="tiny muted">Empty</span>`}</span>
        <span>${status}</span>
      </div>`;
    }).join("");
    return `<div class="card" style="padding:14px; margin-bottom:14px;">
      <div class="row" style="justify-content:space-between; align-items:baseline;">
        <b>${fmtShort(dates[0])} – ${fmtShort(dates[6])}</b>
        <span class="tiny muted">${worn}/${planned} worn${planned ? ` · ${pct}%` : ""}</span>
      </div>
      <div style="margin-top:10px;">${rows}</div>
    </div>`;
  }).join("");
  view.innerHTML = seg + back + blocks;
}

function canBuildOutfits(garments) {
  const b = groupByCategory(garments);
  return !!(b.bottom.length && b.shoe.length && (b.base.length || b.mid.length));
}

/* ----- Gap analysis: rank hypothetical garments by outfits unlocked ----- */
function renderGaps(garments, seg) {
  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◇", "Gap analysis needs a base wardrobe",
      "Add at least a bottom, a shoe and a top so the engine has outfits to compare against.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }
  const rows = analyzeGaps(garments, gapCandidates);
  const maxDelta = Math.max(1, ...rows.map(r => r.delta));
  viewSub.textContent = `${gapCandidates.length} candidates ranked`;
  const intro = `<div class="small muted" style="margin-bottom:14px;">New valid outfits each hypothetical piece would unlock, ranked richest-first. Edit the candidate list in the config block at the top of the file.</div>`;
  view.innerHTML = seg + intro + `<div class="stack">${rows.map(r => gapRow(r, maxDelta)).join("")}</div>`;
}

function gapRow(r, maxDelta) {
  const spec = r.spec;
  const preview = r.best.length
    ? `<div style="margin-top:12px;">${visualOutfit(r.best[0].items)}</div>` : "";
  const cpu = r.costPerUnlock != null ? `${money(r.costPerUnlock)} per new outfit`
    : (r.delta > 0 ? "cost not set" : "no new outfits");
  const specJson = esc(JSON.stringify(spec));
  return `
    <div class="card gap-row">
      <div class="row" style="gap:12px; align-items:flex-start;">
        <div class="grow" style="min-width:0;">
          <div class="g-name">${esc(spec.name)}</div>
          <div class="tiny muted" style="margin-top:2px;">${CATEGORY_LBL[spec.category]} · ${esc(spec.color)} · F${spec.formality} · ${cap(spec.season)} · ${money(spec.cost)}</div>
          <div class="tiny muted" style="margin-top:4px;">${esc(cpu)}</div>
        </div>
        <div class="gap-delta ${r.delta > 0 ? "" : "zero"}">${r.delta > 0 ? "+" : ""}${r.delta}${r.capped ? "+" : ""}</div>
      </div>
      <div class="gap-bar"><span style="width:${Math.round(r.delta / maxDelta * 100)}%"></span></div>
      ${preview}
      <div class="row wrap" style="gap:8px; margin-top:12px;">
        <button class="btn sm primary" onclick='addCandidateToWardrobe(${specJson})'>Add to wardrobe</button>
        <button class="btn sm" onclick='addCandidateToWishlist(${specJson})'>Add to wishlist</button>
      </div>
    </div>`;
}
window.addCandidateToWardrobe = function (spec) { const g = addGarment(spec); alert(`Added “${g.name}” to your wardrobe.`); renderPlan(); };
window.addCandidateToWishlist = function (spec) { addWishlist(spec); haptic(14); planMode = "wishlist"; renderPlan(); };

/* ----- Wishlist: hypotheticals with projected unlock + convert-to-real ----- */

  const wl = getWishlist();

window.buyWishlist = function (id) { const g = convertWishlist(id); if (g) alert(`“${g.name}” moved into your wardrobe.`); renderPlan(); };
window.removeWishlist = function (id) { if (confirm("Remove from wishlist?")) { haptic(30); deleteWishlist(id); renderPlan(); } };

/* ----- Packing: minimum capsule covering N days of chosen occasions ----- */
function renderPacking(garments, seg) {
  if (!canBuildOutfits(garments)) {
    viewSub.textContent = "";
    view.innerHTML = seg + emptyState("◇", "Packing needs a base wardrobe",
      "Add at least a bottom, a shoe and a top so the engine has outfits to pack.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>` +
      (garments.length ? "" : `<button class="btn" onclick="loadSample()">Load sample wardrobe</button>`));
    return;
  }
  viewSub.textContent = "";
  const controls = `
    <div class="card" style="padding:14px; margin-bottom:16px;">
      <div class="row wrap" style="gap:14px; align-items:flex-end;">
        <div class="field" style="width:96px; flex:none;">

          <div class="row wrap" style="gap:7px; margin-top:7px;">

        </div>
      </div>

    } else {
      const shortfall = r.shortfall > 0
        ? `<div class="banner warn">Only ${r.chosen.length} distinct outfit${r.chosen.length === 1 ? "" : "s"} available — ${r.shortfall} day${r.shortfall === 1 ? "" : "s"} short. Add pieces or widen occasions.</div>` : "";
      const totalCost = r.capsule.reduce((a, g) => a + g.cost, 0);
      const capsuleByCat = CATEGORIES.map(cat => {
        const items = r.capsule.filter(g => g.category === cat);
        if (!items.length) return "";
        return `<div style="margin-bottom:10px;">
          <div class="tiny muted" style="margin-bottom:5px;">${CATEGORY_LBL[cat]}</div>
          <div class="build-chips">${items.map(g => `<span class="pick"><span class="mini">${g.imageData ? `<img src="${g.imageData}">` : (CATEGORY_ICO[cat] || "👚")}</span>${esc(g.name)} ${colorDot(g.color)}</span>`).join("")}</div>

        </div>
        <div class="card" style="padding:14px; margin-bottom:16px;">
          <div class="sectitle">Pack these ${r.capsule.length} pieces · ${money(totalCost)}</div>

        <div class="sectitle" style="margin:4px 0 10px;">Daily outfits</div>
        <div class="stack">${daysHTML}</div>`;
    }
  }

  view.innerHTML = seg + controls + result;

window.togglePackOccasion = function (o) {

window.runPacking = function () {

  renderPlan();
};

/* ---------- Stats (full dashboard) ---------- */
function renderStats() {
  viewTitle.textContent = "Stats";
  viewSub.textContent = "";
  const g = getGarments();
  if (!g.length) {
    view.innerHTML = emptyState("◐", "Nothing to summarize yet", "Add garments to see your wardrobe stats.",
      `<button class="btn primary" onclick="setTab('add')">Add a garment</button>
       <button class="btn" onclick="loadSample()">Load sample wardrobe</button>`);
    return;
  }
  const spent = g.reduce((a, x) => a + x.cost, 0);
  const { count, capped } = generateOutfits(g, { store: 0 });
  const worn = g.filter(x => x.timesWorn > 0);
  const totalWears = g.reduce((a, x) => a + x.timesWorn, 0);
  const avgCpw = worn.length ? worn.reduce((a, x) => a + cpw(x), 0) / worn.length : null;
  const neverWorn = g.filter(x => !x.timesWorn);
  const stale = g.filter(x => x.timesWorn && daysSince(x.lastWorn) >= STALE_DAYS);
  const wl = getWishlist();
  const wlValue = wl.reduce((a, x) => a + x.cost, 0);
  const ratings = Object.values(state.ratings);
  const avgRating = ratings.length ? ratings.reduce((a, r) => a + r, 0) / ratings.length : null;

  const most = g.slice().sort((a, b) => b.timesWorn - a.timesWorn)[0];
  const least = worn.slice().sort((a, b) => a.timesWorn - b.timesWorn)[0];
  const bestValue = worn.slice().sort((a, b) => cpw(a) - cpw(b))[0];   // lowest cost/wear
  const worstValue = worn.slice().sort((a, b) => cpw(b) - cpw(a))[0];  // highest cost/wear

  // wardrobe composition by category
  const catCounts = CATEGORIES.map(c => [CATEGORY_LBL[c], g.filter(x => x.category === c).length]);
  const catMax = Math.max(1, ...catCounts.map(c => c[1]));

    <div class="row" style="gap:10px; margin:6px 0;">
      <span class="small muted" style="width:88px; flex:none;">${lbl}</span>

      <span class="small" style="width:22px; text-align:right; flex:none;">${n}</span>
    </div>`).join("");

  const line = (label, g) => g ? `<div class="row" style="justify-content:space-between; gap:10px;"><span class="small truncate">${esc(g.name)}</span><span class="small muted" style="flex:none;">${label}</span></div>` : "";

  view.innerHTML = `
    <div class="stat-grid" style="margin-bottom:12px;">
      <div class="card stat"><div class="n">${g.length}</div><div class="l">Garments</div></div>
      <div class="card stat"><div class="n">${money(spent)}</div><div class="l">Total spent</div></div>
      <div class="card stat"><div class="n">${count}${capped ? "+" : ""}</div><div class="l">Valid outfits</div></div>
      <div class="card stat"><div class="n">${avgCpw != null ? money(avgCpw) : "—"}</div><div class="l">Avg cost / wear</div></div>
    </div>
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="card stat"><div class="n">${totalWears}</div><div class="l">Total wears</div></div>
      <div class="card stat"><div class="n">${neverWorn.length}</div><div class="l">Never worn</div></div>
      <div class="card stat"><div class="n">${state.outfits.length}</div><div class="l">Saved outfits</div></div>
      <div class="card stat"><div class="n">${wl.length}${wl.length ? ` · ${money(wlValue)}` : ""}</div><div class="l">Wishlist${wl.length ? " value" : ""}</div></div>
    </div>
    <div class="stack">
      <div class="card" style="padding:14px;">
        <div class="sectitle" style="margin-bottom:8px;">Wardrobe by category</div>
        ${catBars}
      </div>
      <div class="card" style="padding:14px;">
        <div class="sectitle" style="margin-bottom:6px;">Wear leaders</div>
        ${most && most.timesWorn ? line(`${most.timesWorn}× worn`, most) : `<div class="small muted">Nothing worn yet — hit “Wore this today” on an outfit.</div>`}
        ${least ? line(`${least.timesWorn}× worn`, least) : ""}
        ${bestValue ? `<div class="sectitle" style="margin:12px 0 6px;">Cost per wear</div>${line(`${money(cpw(bestValue))}/wear · best`, bestValue)}${worstValue && worstValue !== bestValue ? line(`${money(cpw(worstValue))}/wear · worst`, worstValue) : ""}` : ""}
      </div>
      ${avgRating != null ? `<div class="card" style="padding:14px;">
        <div class="sectitle">Outfit ratings</div>
        <div class="small">${ratings.length} rated · ${avgRating.toFixed(1)}★ average</div>
      </div>` : ""}
      ${rejectionsCard()}
      ${neverWorn.length ? `<div class="card" style="padding:14px;">
        <div class="sectitle">Never worn (${neverWorn.length})</div>
        <div class="row wrap" style="gap:6px;">${neverWorn.map(x => `<span class="badge">${esc(x.name)}</span>`).join("")}</div>
      </div>` : ""}
      ${stale.length ? `<div class="card" style="padding:14px;">
        <div class="sectitle">Not worn in ${STALE_DAYS}+ days (${stale.length})</div>
        <div class="row wrap" style="gap:6px;">${stale.map(x => `<span class="badge warn">${esc(x.name)} · ${daysSince(x.lastWorn)}d</span>`).join("")}</div>
      </div>` : ""}
      <div class="card" style="padding:14px;">
        <div class="sectitle" style="margin-bottom:10px;">Appearance</div>
        <div class="row wrap" style="gap:10px;">
          ${THEMES.map(t => `<button class="theme-card ${t.id === theme ? "on" : ""}" style="width:98px; padding:8px;" onclick="setTheme('${t.id}')">
            <div class="theme-prev" style="height:38px;"><span style="background:${t.bg}"></span><span style="background:${t.surface}"></span><span class="a" style="background:${t.accent}"></span></div>
            <div style="font-size:12px; font-weight:600;">${t.name}</div>
          </button>`).join("")}
        </div>

/* ---- rejection patterns + one-tap config suggestion (item 3) ---- */
function rejectionsCard() {
  const a = analyzeRejections();
  if (!a) { pendingSuggestion = null; return ""; }
  const lbl = r => (REJECT_REASONS.find(x => x[0] === r) || [r, r])[1];
  const list = Object.entries(a.byReason).sort((x, y) => y[1] - x[1]).map(([r, c]) => `<span class="badge">${esc(lbl(r))} · ${c}</span>`).join("");
  pendingSuggestion = a.top ? a.top.suggestion : null;
  const suggestion = a.top ? `
    <div class="small" style="margin-top:10px;">${esc(a.top.message)}</div>
    <button class="btn sm primary" style="margin-top:10px;" onclick="applySuggestion()">${esc(a.top.suggestion.label)}</button>
    <div class="tiny muted" style="margin-top:6px;">Applied only after you confirm — nothing changes automatically.</div>` : "";
  return `<div class="card" style="padding:14px;">
    <div class="sectitle">What you've turned down (${a.total})</div>
    <div class="row wrap" style="gap:6px; margin-top:6px;">${list}</div>
    ${suggestion}
  </div>`;
}
window.applySuggestion = function () {
  if (!pendingSuggestion) return;

  applyRuleOverride(s.key, s.value); haptic(14);
  showToast(`Applied · ${s.label}`, null, null, 2600);

};

/* ---------- export / import (move data between devices) ---------- */
window.exportData = function () {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `wardrobe-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
window.importData = function (input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== "object" || !Array.isArray(parsed.garments)) throw new Error("Not a wardrobe export.");
      if (!confirm(`Replace all current data with ${parsed.garments.length} garments from this file?`)) { input.value = ""; return; }
      state = {
        garments: parsed.garments.map(normalizeGarment),
        outfits: Array.isArray(parsed.outfits) ? parsed.outfits : [],
        wishlist: Array.isArray(parsed.wishlist) ? parsed.wishlist.map(x => { const w = normalizeGarment(x); w.isWishlist = true; return w; }) : [],
        ratings: (parsed.ratings && typeof parsed.ratings === "object") ? parsed.ratings : {},
        rejections: Array.isArray(parsed.rejections) ? parsed.rejections : [],
        ruleOverrides: (parsed.ruleOverrides && typeof parsed.ruleOverrides === "object") ? parsed.ruleOverrides : {},
        coWear: (parsed.coWear && typeof parsed.coWear === "object") ? parsed.coWear : {},
        planner: normalizePlanner(parsed.planner),
      };
      Object.assign(rules, state.ruleOverrides);
      saveToStorage(); rebuildRatingContext();
      lastUnlock = null; ootd = null; ootdDismissed = false; packResult = null;
      plannerWeek = null; plannerHistory = false; plannerForecast = { status: "idle", byDate: {} };
      alert(`Imported ${state.garments.length} garments.`);
      setTab("wardrobe");
    } catch (err) { alert("Import failed: " + err.message); }
    input.value = "";
  };
  reader.readAsText(file);
};

/* ---------- photo helpers ---------- */
const PHOTO_MAX = 1000;                 // longest side (bumped from 800 to survive cropping)
const PHOTO_BG_DEFAULT = "#eceae6";     // neutral fill behind transparent/letterboxed images
const PHOTO_BGS = ["#eceae6", "#ffffff", "#1a1c20"];

function fileToDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(new Error("read error")); r.onload = e => res(e.target.result); r.readAsDataURL(file); });
}
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("decode error")); im.src = src; });
}
// resize keeping aspect (used by the fast paths: quick add, batch). Fills a neutral bg first.
function resizeImage(file, max) {
  max = max || PHOTO_MAX;
  return fileToDataURL(file).then(loadImage).then(img => {
    let { width, height } = img;
    if (width > height && width > max) { height = Math.round(height * max / width); width = max; }
    else if (height > max) { width = Math.round(width * max / height); height = max; }
    const c = document.createElement("canvas"); c.width = width; c.height = height;
    const ctx = c.getContext("2d"); ctx.fillStyle = PHOTO_BG_DEFAULT; ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);
    return c.toDataURL("image/jpeg", 0.85);
  });
}

/* ---- drag & drop wiring (item: drop zones) ---- */
function wireDropZone(el, onFiles) {
  if (!el) return;
  el.classList.add("dropzone");
  if (!el.querySelector(".drop-hint")) el.insertAdjacentHTML("beforeend", `<div class="drop-hint">Drop to upload</div>`);
  const over = e => { e.preventDefault(); el.classList.add("dragover"); };
  el.addEventListener("dragenter", over);
  el.addEventListener("dragover", over);
  el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove("dragover"); });
  el.addEventListener("drop", e => {
    e.preventDefault(); el.classList.remove("dragover");
    const files = [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith("image/"));
    if (files.length) onFiles(files);
  });
}
// paste: one document-level handler, driven by whatever photo screen is active (cleared each render)
let activePasteHandler = null;
document.addEventListener("paste", e => {
  if (!activePasteHandler) return;
  const items = e.clipboardData && e.clipboardData.items; if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) { const f = it.getAsFile(); if (f) { e.preventDefault(); activePasteHandler([f]); return; } }
  }
});

/* ---- crop modal: pan + pinch/zoom into a 4:5 frame, neutral bg, → cropped JPEG ---- */
function openCropper(srcDataURL, onDone) {
  loadImage(srcDataURL).then(img => {
    const overlay = document.createElement("div"); overlay.className = "overlay"; overlay.id = "crop-overlay";
    overlay.innerHTML = `<div class="sheet">
      <div class="row" style="justify-content:space-between; align-items:center;"><b>Crop photo</b><button class="btn sm ghost" id="crop-cancel">Cancel</button></div>
      <div class="tiny muted" style="margin:4px 0 0;">Drag to reposition · pinch or use the slider to zoom.</div>
      <div class="crop-frame" id="crop-frame"><img id="crop-img"><div class="crop-grid"></div></div>
      <input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" style="width:100%; margin-top:14px;">
      <div class="row" style="gap:8px; align-items:center; margin-top:8px;"><span class="tiny muted">Background</span>
        ${PHOTO_BGS.map((c, i) => `<span class="bg-swatch ${i === 0 ? "on" : ""}" data-bg="${c}" style="background:${c}"></span>`).join("")}
      </div>
      <button class="btn primary" id="crop-done" style="width:100%; margin-top:14px;">Use photo</button>
    </div>`;
    document.body.appendChild(overlay);

    const frame = document.getElementById("crop-frame"), imel = document.getElementById("crop-img");
    const FW = frame.clientWidth, FH = frame.clientHeight;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const cover = Math.max(FW / nw, FH / nh);
    let scale = 1, tx = 0, ty = 0, bg = PHOTO_BGS[0];
    const size = () => ({ w: nw * cover * scale, h: nh * cover * scale });
    const apply = () => {
      const { w, h } = size();
      tx = Math.min(0, Math.max(FW - w, tx)); ty = Math.min(0, Math.max(FH - h, ty));
      imel.style.width = w + "px"; imel.style.height = h + "px"; imel.style.left = tx + "px"; imel.style.top = ty + "px";
    };
    imel.src = srcDataURL;
    (() => { const { w, h } = size(); tx = (FW - w) / 2; ty = (FH - h) / 2; apply(); })();

    const pts = new Map(); let startDist = 0, startScale = 1;
    const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    frame.addEventListener("pointerdown", e => { frame.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const p = [...pts.values()]; startDist = d2(p[0], p[1]); startScale = scale; } });
    frame.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { tx += e.clientX - prev.x; ty += e.clientY - prev.y; apply(); }
      else if (pts.size === 2) { const p = [...pts.values()]; scale = Math.min(4, Math.max(1, startScale * (d2(p[0], p[1]) / startDist))); document.getElementById("crop-zoom").value = scale; apply(); }
    });
    const up = e => pts.delete(e.pointerId);
    frame.addEventListener("pointerup", up); frame.addEventListener("pointercancel", up);
    frame.addEventListener("wheel", e => { e.preventDefault(); scale = Math.min(4, Math.max(1, scale * (e.deltaY < 0 ? 1.08 : 0.92))); document.getElementById("crop-zoom").value = scale; apply(); }, { passive: false });
    document.getElementById("crop-zoom").addEventListener("input", e => { scale = parseFloat(e.target.value); apply(); });
    overlay.querySelectorAll(".bg-swatch").forEach(s => s.addEventListener("click", () => { overlay.querySelectorAll(".bg-swatch").forEach(x => x.classList.remove("on")); s.classList.add("on"); bg = s.dataset.bg; }));
    document.getElementById("crop-cancel").onclick = () => overlay.remove();
    document.getElementById("crop-done").onclick = () => {
      const { w } = size(); const ratio = nw / w;   // natural px per displayed px
      const sx = (-tx) * ratio, sy = (-ty) * ratio, sW = FW * ratio, sH = FH * ratio;
      const OW = 800, OH = 1000;                     // 4:5, longest side 1000
      const c = document.createElement("canvas"); c.width = OW; c.height = OH;
      const ctx = c.getContext("2d"); ctx.fillStyle = bg; ctx.fillRect(0, 0, OW, OH);
      ctx.drawImage(img, sx, sy, sW, sH, 0, 0, OW, OH);
      overlay.remove(); haptic(12); onDone(c.toDataURL("image/jpeg", 0.85));
    };
  }).catch(err => alert("Could not read image: " + err.message));
}
// select-or-drop-or-paste a single file → crop → done(dataURL)
function pickAndCrop(file, onDone) {
  fileToDataURL(file).then(src => openCropper(src, onDone)).catch(err => alert("Could not read image: " + err.message));
}

// PWA: register the service worker only when served over http(s). On file:// this
// is a no-op — the app still works, it just can't be installed/offline-cached there.
// Detects a waiting worker and prompts to refresh instead of needing a manual cache clear.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let updating = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    // ignore the first-install clients.claim(); only reload for a user-triggered update
    if (updating) location.reload();
  });
  const onUpdateReady = worker => showUpdatePrompt(() => {
    updating = true;
    worker.postMessage("SKIP_WAITING");
    setTimeout(() => { if (updating) location.reload(); }, 1800); // fallback if controllerchange is missed
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) onUpdateReady(reg.waiting);   // update already waiting from a prior visit
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener("statechange", () => {
          // "installed" + an existing controller ⇒ this is an update, not a first install
          if (nw.state === "installed" && navigator.serviceWorker.controller) onUpdateReady(reg.waiting || nw);
        });
      });
      reg.update().catch(() => {});   // proactively check for a newer SW on load
    }).catch(() => {});
  });
}
